# Несколько раз в час забирает свежие данные с Lichess и публикует их на GitHub Pages.
# Токен Lichess — в Settings → Secrets and variables → Actions → LICHESS_TOKEN.
# Расписание GitHub не гарантирует: запуски по cron бывают задержаны на часы или пропущены (на деле — примерно раз в 6 часов).
# Поэтому главный запуск — внешний будильник cron-job.org: каждые 30 мин POST на API workflow_dispatch с ключом GitHub
# (fine-grained, только этот репозиторий, Actions: Read and write, до 31.12.2026) — README, раздел 0а «Будильник».
# cron ниже — запасной. Если давно не обновлялось — History на cron-job.org (401 — новый ключ), update.bat с ПК или «Run workflow».
# Каждый запуск делает коммит (время обновления меняется) — это же не даёт GitHub выключить расписание через 60 дней без активности.
name: Обновление данных с Lichess

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # 4 раза в час (не в :00 — тогда GitHub перегружен)
  workflow_dispatch:          # кнопка «Run workflow» — запустить вручную

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Установить зависимости
        working-directory: scripts
        run: npm ci --no-audit --no-fund

      - name: Забрать данные с Lichess
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: node scripts/update.mjs

      - name: Сохранить изменения
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data scripts/cache
          if git diff --cached --quiet; then
            echo "Нет изменений"
            exit 0
          fi
          git commit -m "Обновление данных $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M')"
          # пока шло обновление, с ПК могли отправить правки (так упал запуск 30.09 15:53 UTC):
          # подтягиваем их поверх и отправляем снова; при споре в файлах данных побеждают данные этого запуска (они свежее)
          for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "Не удалось отправить данные после 3 попыток"
          exit 1
