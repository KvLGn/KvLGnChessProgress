  svg text { font-family: 'Inter', sans-serif; }
  .hit { cursor: pointer; }
  .hit:hover, .hit.active { fill: rgba(255,255,255,0.035); }

  /* черта над нижней строкой — только под панелью «Средние» (над винрейтом), над легендой её нет */
  .legend-rule { width: 100%; height: 3px; background: linear-gradient(to right, #2a2e3f 0, #2a2e3f 203px, transparent 203px);
    position: relative; top: -8px; }   /* чуть выше — винрейт / ELO под ней свободнее (общая для «Показателей» и «Активности») */
  .legend .legend-item { position: relative; top: -24px; }
  .legend {
    display: flex;
    gap: 24px;
    align-items: center;
    justify-content: center;
    padding: 8px 20px 8px 220px;
    width: 100%;
    position: relative;
  }
  .legend-wr { position: absolute; left: 20px; display: flex; align-items: center; gap: 6px; transform: translateY(-6px); }   /* чуть выше — ближе к черте над ним */
  /* подпись «Винрейт» — в стиле заголовков блока: капс, разрядка, зелёная точка-акцент */
  .legend-wr { gap: 10px; }
  .legend-wr-label { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #4ade80; }
  .legend-wr-label::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }
  .legend-wr-val { font-size: 22px; font-weight: 700; color: var(--fg-num); }
  .legend-wr-val small { font-size: 14px; color: var(--fg-dim); }
  #legendWrBox { cursor: pointer; }   /* клик — винрейт ⇄ ELO; при наведении только светлеет число, без фона */
  #legendWrBox .legend-wr-val { transition: color 0.15s; }
  #legendWrBox:hover .legend-wr-val { color: #f3f4f6; }
  #legendWrBox:focus { outline: none; }
  #legendWrBox .legend-wr-val .trend-n { font-size: 11px; font-weight: 500; color: var(--fg-mute); margin-left: 4px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; }

  /* show / hide series */
  .toggle { cursor: pointer; user-select: none; outline: none; transition: opacity 0.15s; }
  .toggle:hover { filter: brightness(1.15); }
  .toggle:focus-visible { box-shadow: inset 0 0 0 1px var(--border); }
  .toggle.off { opacity: 0.3; }
  .toggle.off:hover { opacity: 0.5; }
  .series.off { display: none; }
  .avg-line { transition: opacity 0.15s; }
  svg.focus .series { opacity: 0.15; transition: opacity 0.15s; }
  svg.focus .series.hl { opacity: 1; }
  /* линии средних скрыты, пока не наведёшь на показатель */
  svg .series.avg-line, svg.focus .series.avg-line { opacity: 0; }
  svg.focus .series.avg-line.hl { opacity: 1; }
  .lock { vertical-align: -1px; margin-left: 2px; }
  .win-toggle.filtered, .win-toggle.filtered:hover { color: #818cf8; }
  .sel-clear { font: 12px Inter, sans-serif; color: var(--fg-dim); background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin-left: 6px; cursor: pointer; line-height: 16px; }
  .sel-clear:hover { color: var(--fg); }
  .sel-n { color: #f3f4f6; font-weight: 700; }
  .wl { font-size: 12px; font-weight: 600; color: var(--fg-dim); margin-right: 5px; white-space: nowrap; }
  /* W/L и прирост — в одну строку, чтобы блок не рос в высоту */
  #actList .stat-trend { display: flex; align-items: center; white-space: nowrap; }
  #actList .stat-trend .trend-n { overflow: hidden; text-overflow: ellipsis; }
  .act-sel { font-size: 13px; color: var(--fg-mute); margin-left: 6px; white-space: nowrap; }
  /* выбор дней: «2/14 ✕» должен помещаться в панель 200px и при «2 недели» / «3 месяца» */
  .period-pick { display: inline-flex; align-items: center; min-width: 0; max-width: 100%; }
  .period-pick .sel-clear { margin-left: 4px; }
  .period-pick .period-toggle { letter-spacing: 1.5px; }
  .win-pick { display: inline-flex; align-items: center; }
  .avg-line text { display: none; }
  svg.focus .avg-line.hl text { display: inline; }
  .win-short { color: var(--fg-mute); font-weight: 400; font-size: 11px; margin-left: 4px; }

  /* ---------- анализ партий: список партий · ходы · доска, внизу график перевеса ---------- */
  .chart-container:not(.mode-analysis) .analysis-only { display: none !important; }
  /* в анализе блок занят разбором — панели, график, легенда и кнопки других режимов спрятаны */
  .mode-analysis .panel-stack, .mode-analysis .chart-area, .mode-analysis .legend-rule, .mode-analysis .legend,
  .mode-analysis .records-btn, .mode-analysis .cmp-btn, .mode-analysis .cmp-hint, .mode-analysis .rec-scope,
  .mode-analysis .act-range { display: none !important; }
  .chart-container.mode-analysis::before, .chart-container.mode-analysis::after { display: none; }
  .an-box {
    --an-list-w: 260px; --an-moves-w: 250px; --an-mom-w: 150px; --an-board: 360px;
    width: 100%; display: grid; grid-template-columns: var(--an-list-w) var(--an-moves-w) var(--an-mom-w) minmax(0, 1fr);
  }
  .an-head { display: flex; align-items: baseline; gap: 8px; height: 42px; padding: 10.5px 16px 0; font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #cbd0da; text-transform: uppercase; }
  .an-head span { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--fg-mute); }
  .an-empty { padding: 14px 16px; font-size: 12px; color: var(--fg-mute); }
  /* колонка 1: партии (прокрутка внутри; высоту задают доска и график) */
  .an-list { grid-row: 1 / span 2; position: relative; border-right: 3px solid var(--divider); min-height: 200px; }
  .an-list-in { position: absolute; inset: 42px 0 0 0; overflow-y: auto; border-top: 3px solid var(--divider); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
  .an-g { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 8px 14px 8px 13px; text-align: left; color: var(--fg); background: none;
    border: none; border-left: 3px solid transparent; border-bottom: 1px solid rgba(46,50,68,0.6); cursor: pointer; font: 12px Inter, sans-serif; }
  .an-g:hover { background: rgba(255,255,255,0.03); }
  .an-g.on { background: rgba(34,211,238,0.07); border-left-color: #22d3ee; }
  .an-g-top { display: flex; align-items: center; gap: 7px; font-size: 13px; }
  .an-g-top .an-date { color: var(--fg-dim); font-size: 12px; }
  .an-res { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; line-height: 16px; }
  .an-g-bl { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--fg-dim); }
  .an-g-bl i { width: 6px; height: 6px; border-radius: 50%; }
  .an-g-bl .an-bang { margin-right: 3px; }
  .an-g-op, .an-g-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .an-g-op { font-size: 12px; color: var(--fg); }
  .an-g-sub { font-size: 11px; color: var(--fg-mute); }
  /* колонка 2: ходы — описание текущего хода, запись партии, кнопки листания */
  .an-moves { position: relative; border-right: 1px solid rgba(46,50,68,0.6); }
  .an-moves-in { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .an-info { flex-shrink: 0; margin: 0 12px 8px; padding: 7px 10px; border-radius: 8px; border-left: 3px solid var(--c, var(--border)); background: rgba(255,255,255,0.03); min-height: 52px; }
  .an-info-t { font-size: 13px; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .an-info-t em { font-style: normal; color: var(--c); }
  .an-info-s { font-size: 11.5px; color: var(--fg-dim); margin-top: 3px; line-height: 1.4; }
  .an-info-s b { color: var(--fg); }
  .an-info-s .good { color: #4ade80; } .an-info-s .bad { color: #f87171; }
  /* строки карточки с подписью слева: «Ты сыграл · 31. Qxg6» */
  .an-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 6px; margin-top: 3px; }
  .an-row > span:first-child { color: var(--fg-mute); }
  .an-mvs { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px; display: grid; grid-template-columns: 30px 1fr 1fr; grid-auto-rows: 26px; align-items: center; align-content: start; gap: 1px 4px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
  .an-no { font-size: 11px; color: var(--fg-mute); text-align: right; padding-right: 4px; }
  .an-mv { font: 12.5px Inter, sans-serif; color: var(--fg-dim); text-align: left; background: none; border: 1px solid transparent; border-radius: 5px; height: 24px; padding: 0 6px; cursor: pointer; }
  .an-mv:hover { background: rgba(255,255,255,0.05); color: var(--fg); }
  .an-mv.me { color: var(--fg); }
  .an-mv.mk { color: var(--c); font-weight: 700; }
  .an-mv.mk::after { content: ' ●'; font-size: 8px; vertical-align: 2px; }
  .an-mv.next { border-color: var(--c); border-style: dashed; }
  .an-mv.on { background: rgba(34,211,238,0.18); color: #fff; }
  .an-nav { display: flex; align-items: center; gap: 4px; padding: 8px 12px 10px; }
  .an-nav button { font: 14px/1 Inter, sans-serif; color: var(--fg-dim); background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; width: 34px; height: 28px; cursor: pointer; }
  .an-nav button:hover:not(:disabled) { color: var(--fg); border-color: #22d3ee; }
  .an-nav button:disabled { opacity: 0.3; cursor: default; }
  .an-nav span { margin-left: auto; font-size: 11px; color: var(--fg-mute); }
  /* выпадающий список линз («Зевки ▾») в заголовке «Ходов» — те же .win-pick / .win-menu, что у окна средних */
  .an-pick { margin-left: 6px; text-transform: none; letter-spacing: 0; }   /* сразу за «Ходы N», не у края */
  .an-pick .win-toggle { font: 600 12px Inter, sans-serif; color: #22d3ee; }
  .an-pick .win-toggle:hover, .an-pick.open .win-toggle { color: #67e8f9; }
  .an-pick .win-menu { left: -8px; right: auto; min-width: 130px; }
  .an-pick .win-opt { display: flex; align-items: center; gap: 6px; }
  .an-pick .win-opt .an-bang { order: 1; margin-left: auto; }   /* «!» у правого края, ✓ остаётся у названия */
  /* «Мастера»: колонки «Моменты» нет — запись ходов на её месте, таблицей «ты / мастера / соперник» */
  .an-box.an-wide .an-mom { display: none; }
  .an-box.an-wide .an-moves { grid-column: 2 / span 2; }
  .an-mpick { margin-left: 10px; }
  /* «i» у линзы: при наведении — расшифровка записи ходов */
  .an-ni { position: relative; align-self: baseline; flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--fg-mute); color: var(--fg-mute);
    font: italic 700 10px/14px Georgia, serif; letter-spacing: 0; text-transform: none; text-align: center; cursor: help; margin-left: 2px; position: relative; top: -1.5px; }   /* по базовой линии заголовка: центр на уровне слов при любой ширине */
  .an-ni.right { margin-left: auto; margin-right: -4px; top: -1.5px; }   /* «Мастера»: правый край — по краю карточки хода под заголовком */
  .an-box.an-wide .an-ni { top: -0.5px; }   /* только «Мастера» (an-wide): на 1px ниже — центр по строчным буквам имени мастера рядом */
  .an-ni:hover, .an-ni:focus { color: var(--fg); border-color: var(--fg-dim); outline: none; }
  .an-ni-tip { display: none; position: absolute; top: calc(100% + 8px); left: -8px; z-index: 40; width: 250px; padding: 9px 11px; border-radius: 8px;
    background: #1b1e2c; border: 1px solid var(--border); box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    font: 400 11.5px/1.45 Inter, sans-serif; font-style: normal; color: var(--fg-dim); text-align: left; cursor: default; }
  .an-ni.right .an-ni-tip { left: auto; right: -8px; }
  .an-ni:hover .an-ni-tip, .an-ni:focus .an-ni-tip { display: block; }
  /* внутри заголовка «Ходов»: у его span — свой серый цвет и разрядка, здесь их сбрасываем */
  .an-head .an-ni-tip, .an-head .an-ni-tip * { letter-spacing: 0; text-transform: none; }
  .an-head .an-ni-h { display: block; margin-bottom: 5px; font-weight: 700; color: var(--fg); }
  .an-head .an-ni-r { display: grid; grid-template-columns: 70px 1fr; gap: 8px; padding: 2px 0; color: var(--fg-dim); }
  .an-head .an-ni-r span { color: var(--fg-dim); }
  .an-head .an-ni-r b { color: var(--fg); font-weight: 700; white-space: nowrap; }
  .an-mvs.ms-t.ms-w { grid-template-columns: 26px 1fr 1.3fr 1fr; }
  .an-mvs.ms-t.ms-b { grid-template-columns: 26px 1fr 1fr 1.3fr; }
  .an-th { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--fg-mute); padding-left: 7px; align-self: end; }
  .an-mv.mk2 { color: var(--c); font-weight: 700; }
  .an-mc { font: 12.5px Inter, sans-serif; color: #cbd5e1; text-align: left; background: rgba(74,222,128,0.05); border: 1px solid transparent; border-radius: 5px; height: 24px; padding: 0 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .an-mc small { font-size: 10.5px; color: var(--fg-mute); }
  .an-mc:hover { background: rgba(74,222,128,0.1); }
  .an-mc.on { border-color: rgba(34,211,238,0.45); }
  /* слабый ориентир: любители 1800+ или меньше 10 партий в позиции */
  .an-mc.weak { color: var(--fg-mute); background: rgba(255,255,255,0.02); }
  .an-mv.mk2.weak { opacity: 0.6; }
  .an-ms-sum { flex-shrink: 0; margin: -2px 12px 6px; font-size: 11px; line-height: 1.35; color: var(--fg-dim); }
  /* колонка 3: моменты выбранной линзы (клик — позиция перед ходом) */
  .an-mom { position: relative; border-right: 1px solid rgba(46,50,68,0.6); }
  .an-mom-in { position: absolute; inset: 0; display: flex; flex-direction: column; }
  /* «Партии», «Ходы», «Моменты»: есть прокрутка — у края колёсико не крутит страницу; нет прокрутки — крутит как обычно.
     Класс ставит anScrollLock: Chrome с overscroll-behavior не пропускает колёсико к странице даже у окна без прокрутки */
  .an-box .sc-lock, .cmp-rows.sc-lock { overscroll-behavior: contain; }   /* то же у строк сравнения (cmpFit) */
  .an-ms { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 10px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
  .an-m { position: relative; display: flex; flex-direction: column; gap: 1px; width: 100%; padding: 5px 8px; margin-bottom: 2px; text-align: left; background: none;
    border: 1px solid transparent; border-radius: 6px; cursor: pointer; font: 12.5px Inter, sans-serif; color: var(--fg); }
  .an-m:hover { background: rgba(255,255,255,0.04); }
  .an-m.on { background: rgba(34,211,238,0.12); border-color: rgba(34,211,238,0.35); }
  .an-m-top { display: flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
  .an-m-top i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
  .an-m-s { font-size: 11px; color: var(--c); padding-left: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .an-mom .an-empty { padding: 6px 8px; }
  .an-pos .an-info { margin: 0; }   /* «Все ходы»: карточка позиции в колонке «Моменты» */
  .an-m .an-bang { position: absolute; top: 5px; right: 5px; }
  /* колонка 4: доска (сверху отступ под кнопки режимов) */
  .an-board { padding: 54px 16px 12px; display: flex; justify-content: center; }
  .an-board svg { display: block; width: min(100%, var(--an-board)); height: auto; border-radius: 4px; box-shadow: 0 6px 20px rgba(0,0,0,0.35); }
  /* строка 2: график перевеса под ходами, моментами и доской; точки — моменты линзы, клик — момент или позиция на этом ходу */
  .an-graph { grid-column: 2 / -1; padding: 10px 16px 12px; border-top: 1px solid rgba(46,50,68,0.6); }
  .an-graph .mr-graph { margin-bottom: 0; }
  .an-graph .mr-graph svg { height: 92px; cursor: pointer; }
  .an-lock { grid-column: 2 / -1; display: flex; align-items: center; justify-content: center; min-height: 300px; font-size: 13px; color: var(--fg-mute); }

  /* ---------- Table filters ---------- */
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 8px; margin-bottom: 12px; }
  /* скрытый режим: вместо фильтров — одна надпись той же высоты */
  /* таблица скрыта — фильтры видны, но приглушены и не нажимаются (как «Фильтр графика» в скрытом режиме) */
  body.hush-table #filters { cursor: not-allowed; }
  body.hush-table #filters > :not(.f-eye) { opacity: 0.45; pointer-events: none; }   /* глаз таблицы — в строке фильтров, он нажимается всегда */
  .sect-eye.f-eye { width: 30px; height: 30px; }
  /* длинное название дебюта не переносит строку фильтров: на широком экране строка одна, кнопка дебюта сжимается с «…» (полное — в подсказке) */
  #fOpening .f-btn { display: inline-flex; align-items: center; max-width: 100%; }
  #fOpening .f-lbl { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  @media (min-width: 1200px) {
    .filters { flex-wrap: nowrap; }
    .filters > * { flex-shrink: 0; }
    .filters > #fOpening { flex-shrink: 1; min-width: 96px; max-width: 280px; }
  }
  body.hush-table #fCount { font-size: 0; }   /* число партий не показываем — таблица скрыта */
  body.hush-table #fCount::after { content: '—'; font-size: 12px; }
  body.hush-table .pager { visibility: hidden; }
  /* пустая таблица: колонки на тех же местах, что и с партиями (доли замерены по обычной таблице) */
  body.hush-table .table-wrap th:nth-child(1) { width: 11.2%; }
  body.hush-table .table-wrap th:nth-child(2) { width: 5.4%; }
  body.hush-table .table-wrap th:nth-child(3) { width: 7.7%; }
  body.hush-table .table-wrap th:nth-child(4) { width: 48%; }
  body.hush-table .table-wrap th:nth-child(5) { width: 11.2%; }
  body.hush-table .table-wrap th:nth-child(6) { width: 11.3%; }
  body.hush-table .table-wrap th:nth-child(7) { width: 5.2%; }
  .f-chips { display: flex; gap: 6px; }
  #fColor { padding-left: 10px; border-left: 1px solid var(--border); }
  .f-knight { font-size: 14px; line-height: 1; margin-right: 5px; vertical-align: -1px; }
  .f-chip, .f-btn {
    font: 600 12px Inter, sans-serif;
    color: var(--fg-dim);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
  }
  .f-chip:hover, .f-btn:hover { color: var(--fg); }
  .f-chip.on { color: var(--c, var(--fg)); background: var(--bg-c, var(--bg-card-hover)); border-color: var(--c, var(--fg-mute)); }
  .f-btn { border-radius: 8px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
  .f-btn .caret { font-size: 11px; margin-left: 4px; }
  .f-btn.active { color: var(--fg); border-color: var(--accent-light, #818cf8); background: rgba(129,140,248,0.1); }
  .f-drop { position: relative; }
  .f-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 30;
    width: 320px;
    padding: 8px;
    background: var(--bg-card);
    border: 1px solid #3a3d4a;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  .f-drop.open .f-menu { display: block; }
  .f-search {
    width: 100%;
    font: 13px Inter, sans-serif;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    outline: none;
  }
  .f-search:focus { border-color: #818cf8; }
  .f-list { max-height: 260px; overflow-y: auto; margin-top: 6px; }
  /* «Мой план | Lichess | Все» в заголовке колонки «Дебют» и в списке «Партии» анализа */
  .th-seg { display: inline-flex; gap: 2px; margin-left: 10px; padding: 2px; vertical-align: middle; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; text-transform: none; letter-spacing: 0; }
  .th-seg button { font: 600 10.5px Inter, sans-serif; color: var(--fg-mute); background: none; border: none; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  .th-seg button:hover { color: var(--fg); }
  .th-seg button.on { background: var(--bg-card-hover); color: var(--fg); }
  .an-head .th-seg { margin-left: auto; align-self: flex-start; margin-top: -3px; }   /* «План / Lichess» (33px) — центр на уровне слов заголовка, не заходит на список партий */
  /* «Партии» → ⟳ на месте числа: сброс мест разбора в остальных партиях (anResetArmed). Значок поверх скрытого числа — ширина та же при любом числе */
  .an-ph { font-weight: inherit; }
  .an-ph.on { cursor: pointer; }
  .an-cnt { position: relative; }
  .an-cnt i { font-style: normal; }
  .an-cnt.armed i { visibility: hidden; }
  .an-reset { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; width: 18px; height: 20px;
    padding: 0; border: 0; border-radius: 4px; background: none; color: var(--fg-mute); cursor: pointer; }
  .an-reset:hover, .an-reset:focus-visible { color: var(--fg); outline: none; }
  /* «Lichess | Мой план» — какие названия дебютов в списке */
  .f-seg { display: flex; gap: 2px; margin-top: 6px; padding: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .f-seg button { flex: 1; font: 600 11px Inter, sans-serif; color: var(--fg-mute); background: none; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  .f-seg button:hover { color: var(--fg); }
  .f-seg button.on { background: var(--bg-card-hover); color: var(--fg); }
  .f-opt {
    display: flex; align-items: center; gap: 8px;
    width: 100%;
    font: 13px Inter, sans-serif;
    color: var(--fg-dim);
    background: none; border: none; border-radius: 6px;
    padding: 6px 8px;
    text-align: left; cursor: pointer;
  }
  .f-opt:hover { background: var(--bg-card-hover); color: var(--fg); }
  .f-opt.on { color: var(--fg); }
  .f-box {
    flex-shrink: 0; width: 14px; height: 14px;
    border: 1px solid var(--fg-mute); border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; line-height: 1;
  }
  .f-opt.on .f-box { background: #818cf8; border-color: #818cf8; color: #0f1117; }
  .f-opt-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-opt-n { color: var(--fg-mute); font-size: 12px; font-variant-numeric: tabular-nums; }
  .f-empty { font-size: 12px; color: var(--fg-mute); padding: 10px 8px; }
  .f-foot { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; }
  .f-link { font: 12px Inter, sans-serif; color: #818cf8; background: none; border: none; padding: 4px 6px; cursor: pointer; }
  .f-link:hover { text-decoration: underline; }
  .f-menu-metrics { width: 300px; }
  .f-menu-dates { width: 300px; }
  /* фильтр дат — в заголовке колонки «Дата»: выглядит как заголовок, меню над страницей (таблица обрезает выпадающее) */
  .th-drop { display: inline-block; }
  .th-btn { font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--fg-dim);
    background: none; border: none; border-radius: 4px; padding: 2px 4px; margin: -2px -4px; max-width: none; }
  .th-btn:hover { color: var(--fg); background: rgba(255,255,255,0.05); }
  .th-btn.active { color: #a5b4fc; background: rgba(129,140,248,0.1); border: none; }
  .th-drop .f-menu { position: fixed; text-transform: none; letter-spacing: 0; font-weight: 400; text-align: left; }
  body.hush-table .th-btn .caret { display: none; }
  .f-dq { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 10px; }   /* быстрые кнопки сеткой 2×2 */
  .f-dq .f-chip { padding: 4px 6px; font-size: 11.5px; text-align: center; }
  .f-dr { display: flex; flex-direction: column; gap: 6px; }
  .f-dr label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg-dim); }
  .f-date { flex: 1; font: 13px Inter, sans-serif; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; outline: none; color-scheme: dark; }
  .f-date:focus { border-color: #818cf8; }
  .f-dr label:first-child .f-date { margin-left: 8px; }   /* «с» короче «по» — поля ровно */
  .f-metrics { display: grid; grid-template-columns: 1fr auto 10px auto; gap: 6px 6px; align-items: center; padding: 4px; }
  .f-metrics label { font-size: 13px; }
  .f-metrics .dash { color: var(--fg-mute); text-align: center; }
  .f-num {
    width: 64px;
    font: 13px Inter, sans-serif;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    outline: none;
    -moz-appearance: textfield;
  }
  .f-num::-webkit-outer-spin-button, .f-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .f-num:focus { border-color: #818cf8; }
  /* сводка справа от фильтров таблицы */
  .f-summary { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 10px; white-space: nowrap; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); }
  .f-cond { display: inline-flex; align-items: center; font-size: 12px; color: var(--fg-dim); white-space: nowrap; }
  .f-count { font-size: 12px; color: var(--fg-mute); white-space: nowrap; padding-left: 10px; border-left: 1px solid var(--border); }
  .f-count b { color: var(--fg); }
  .f-reset { font: 600 12px Inter, sans-serif; color: #818cf8; background: rgba(129,140,248,0.1); border: 1px solid rgba(129,140,248,0.35); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  .f-reset:hover { background: rgba(129,140,248,0.2); }
  .f-reset:disabled { color: var(--fg-mute); background: none; border-color: var(--border); cursor: default; opacity: 0.6; }
  .no-rows td { text-align: center; color: var(--fg-mute); padding: 24px; cursor: default; }

  /* ---------- Table ---------- */
  .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th {
    background: var(--bg-card);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--fg-dim);
    text-align: left;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .game-row { cursor: pointer; transition: background 0.15s; }
  .game-row:hover, .game-row:focus-visible { background: var(--bg-card-hover); outline: none; }
  .game-row td:first-child::before {
    content: '▸';
    display: inline-block;
    margin-right: 6px;
    color: var(--fg-dim);
    font-size: 10px;
    transition: transform 0.2s;
  }
  .game-row.open td:first-child::before { transform: rotate(90deg); }
  .game-detail { display: none; }
  .game-row.open + .game-detail { display: table-row; }
  .game-detail td { padding: 0; }
  /* no double border against the wrapper at the bottom */
  #gameRows tr.game-row:nth-last-child(2):not(.open) td,
  #gameRows tr.game-detail:last-child td { border-bottom: none; }
  .td-knight { font-size: 18px; }
  .td-dim { color: var(--fg-dim); font-size: 12px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  /* ---------- освежённая таблица ---------- */
  .table-wrap {
    background: linear-gradient(180deg, #1b1e2c 0%, #161924 100%);
    border-color: #2d3143;
    border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 12px 32px rgba(0,0,0,0.3);
  }
  th { background: rgba(255,255,255,0.025); border-bottom-color: #2d3143; }
  td { border-bottom-color: rgba(45,49,67,0.7); }
  /* цветная кромка слева — результат партии */
  .game-row td:first-child { box-shadow: inset 3px 0 0 transparent; }
  .game-row.r-win td:first-child { box-shadow: inset 3px 0 0 rgba(34,197,94,0.7); }
  .game-row.r-lose td:first-child { box-shadow: inset 3px 0 0 rgba(239,68,68,0.7); }
  .game-row.r-draw td:first-child { box-shadow: inset 3px 0 0 rgba(156,163,175,0.7); }
  .game-row:hover, .game-row:focus-visible { background: rgba(255,255,255,0.035); }
  .game-row.open { background: rgba(255,255,255,0.04); }
  /* открытая партия: линия цвета результата сверху строки и снизу под раскрытой карточкой (вариант «рамка»; можно оставить одну) */
  #gameRows .r-win { --rc: rgba(34,197,94,0.75); } #gameRows .r-lose { --rc: rgba(239,68,68,0.75); } #gameRows .r-draw { --rc: rgba(156,163,175,0.75); }
  .game-row.open td { box-shadow: inset 0 2px 0 var(--rc); }
  .game-row.open td:first-child { box-shadow: inset 3px 0 0 var(--rc), inset 0 2px 0 var(--rc); }
  .game-row.open + .game-detail td { box-shadow: inset 0 -2px 0 var(--rc); }
  .game-row.open + .game-detail:has(+ .game-row.open) td { box-shadow: none; }   /* две раскрытые подряд — между ними одна линия (верхняя у следующей), а не двойная */
  .badge { border: 1px solid currentColor; border-color: color-mix(in srgb, currentColor 35%, transparent); }
  .detail-inner {
    padding: 8px 20px 8px 42px;
    background: rgba(0,0,0,0.18);
    display: flex;
    gap: 4px 14px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .detail-item { font-size: 12px; display: flex; gap: 3px; align-items: baseline; }
  .detail-label { color: var(--fg-dim); }
  .detail-value { font-weight: 600; font-size: 13px; }
  .detail-d { font-size: 10.5px; color: var(--fg-dim); }
  /* отчёт о матче */
  .detail-inner.mr { display: block; padding: 14px 20px 12px 42px; }
  .mr-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .mr-res { font: 800 13px Inter, sans-serif; letter-spacing: 2px; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    background: color-mix(in srgb, var(--c) 12%, transparent); border-radius: 8px; padding: 6px 12px; white-space: nowrap; }
  .mr-sub { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font-size: 12px; color: var(--fg-dim); }
  .mr-sub b { color: var(--fg); font-size: 13px; }
  .mr-stats { display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; margin-bottom: 12px; }
  .mr-acc { display: flex; flex-direction: column; }
  .mr-acc span { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--fg-dim); }
  .mr-acc b { font-size: 30px; line-height: 1.1; color: var(--fg-num); }
  .mr-acc b small { font-size: 15px; color: var(--fg-dim); }
  .mr-phs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .mr-ph-top { display: flex; align-items: baseline; gap: 6px; font-size: 12px; margin-bottom: 5px; white-space: nowrap; }
  .mr-ph-top b { color: var(--fg); font-size: 14px; }
  .mr-ph-bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.07); overflow: hidden; }
  .mr-ph-bar i { display: block; height: 100%; border-radius: 3px; opacity: 0.85; }
  .mr-cnts { display: flex; gap: 16px; }
  .mr-cnt { display: flex; flex-direction: column; align-items: center; min-width: 44px; }
  .mr-cnt b { font-size: 20px; line-height: 1.1; }
  .mr-cnt span { font-size: 10px; color: var(--fg-dim); }
  .mr-graph { position: relative; margin-bottom: 6px; }
  /* «i» над числом зевков и панель поверх графика перевеса (выезжает справа налево) */
  .mr-cnt { position: relative; }
  /* свой класс, не .bl-info: на .bl-info висит обработчик режима зевков графика */
  .mr-cnt .mr-i { position: absolute; top: -34px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; border-radius: 50%; padding: 0; line-height: 1;
    font: 700 12px Georgia, serif; font-style: italic; color: #cbd5e1; background: #0b0d13; border: none; cursor: pointer; }   /* тёмная, нейтральная */
  .mr-cnt .mr-i:hover { color: #fff; background: #151826; }
  .mr-cnt .mr-i.on { color: #11131a; background: #e4e4e7; }
  .mr-gwrap { position: relative; overflow-x: clip; overflow-y: visible; }   /* прячем панель справа, но подсказка графика может выходить вниз */
  /* высота — по содержимому (не по блоку): при подъёме над графиком панель не сжимается */
  .mr-info { position: absolute; top: 0; left: 0; right: 0; min-height: 100%; z-index: 6; display: grid; grid-template-columns: 1.35fr 1fr 1fr 1fr; gap: 0 18px; padding: 10px 56px 10px 14px;
    background: #171a25; border: 1px solid #2d3143; border-radius: 8px; overflow: hidden; white-space: normal;   /* строка таблицы — nowrap, здесь текст переносится */
    transform: translateX(102%); transition: transform 0.3s ease; }
  .mr-gwrap.info-open .mr-info { transform: none; }
  /* над графиком: сдвиг вверх ставит mrInfoFit (верх панели = начало отчёта, график ниже панели) */
  .mri-ud { position: absolute; top: 6px; right: 30px; width: 22px; height: 20px; font-size: 10px; line-height: 1; color: var(--fg-mute); background: rgba(255,255,255,0.04);
    border: 1px solid var(--border); border-radius: 5px; cursor: pointer; }
  .mri-ud:hover { color: var(--fg); border-color: var(--fg-mute); }
  .mr-gwrap.info-up .mri-ud { top: auto; bottom: 6px; }   /* поднята — кнопка «вниз» внизу, на той же вертикали, что ▲ (right: 30px) */
  .mri-x { position: absolute; top: 4px; right: 8px; font-size: 18px; line-height: 1; color: var(--fg-mute); background: none; border: none; cursor: pointer; }
  .mri-x:hover { color: var(--fg); }
  .mri-sec { min-width: 0; cursor: pointer; border-radius: 6px; margin: -4px -6px; padding: 4px 6px; transition: background 0.15s; }
  .mri-sec:hover { background: rgba(255,255,255,0.025); }
  .mr-stats [data-gv] { cursor: pointer; border-radius: 6px; transition: background 0.15s; }
  .mr-ph[data-gv] { margin: -4px -6px; padding: 4px 6px; }
  .mr-cnt[data-gv] { padding: 2px 4px; }
  .mr-stats [data-gv]:hover { background: rgba(255,255,255,0.03); }
  .mr-stats [data-gv].on { background: rgba(34,211,238,0.07); box-shadow: inset 0 0 0 1px rgba(34,211,238,0.35); }
  .mri-sec.on { background: rgba(34,211,238,0.07); box-shadow: inset 0 0 0 1px rgba(34,211,238,0.35); }   /* этот блок показан на графике */
  .mr-cap { color: #67e8f9; font-weight: 600; }
  .mri-sec + .mri-sec { border-left: 1px solid rgba(46,50,68,0.7); padding-left: 16px; }
  .mri-h { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 6px; }
  .mri-t { font-size: 12px; color: var(--fg); line-height: 1.45; margin-bottom: 3px; }
  .mri-n { font-size: 11.5px; color: var(--fg-mute); }
  .mri-go { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; border-radius: 4px; }
  .mri-go:hover { background: rgba(255,255,255,0.06); }
  .mri-adv { margin-top: 4px; color: var(--fg-dim); }   /* «Перелом партии»: чем кончилась история перевеса */
  .mri-marks { display: flex; flex-wrap: wrap; gap: 2px; margin: 2px 0 5px; }
  .mri-marks .mri-go { width: 20px; height: 20px; font-size: 13px; font-weight: 700; background: rgba(255,255,255,0.04); }
  .mri-chips { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; font-weight: 600; }
  @media (max-width: 700px) {
    .mr-info { position: static; transform: none !important; display: none; grid-template-columns: 1fr; gap: 10px; margin-top: 8px; }
    .mri-ud { display: none; }
    .mr-gwrap.info-open .mr-info { display: grid; }
    .mri-sec + .mri-sec { border-left: none; padding-left: 0; border-top: 1px solid rgba(46,50,68,0.7); padding-top: 8px; }
  }
  .mr-graph-h { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 4px; }
  .mr-leg { text-transform: none; letter-spacing: 0; display: flex; align-items: center; gap: 5px; }
  .mr-leg i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .mr-leg i.up { background: rgba(74,222,128,0.5); } .mr-leg i.dn { background: rgba(248,113,113,0.5); margin-left: 6px; }
  .mr-graph svg { width: 100%; height: 110px; display: block; border-radius: 8px; background: rgba(0,0,0,0.2); }
  .mr-graph svg { cursor: crosshair; touch-action: pan-y; }
  .mr-graph svg circle { pointer-events: none; }
  .mr-dot { display: none; position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #11131a; pointer-events: none; }
  .mr-hint { display: none; position: absolute; z-index: 5; pointer-events: none; white-space: nowrap; font-size: 12px; line-height: 1.45; color: var(--fg-dim);
    background: #1a1d27; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
  .mr-hint b { color: var(--fg); }
  .mr-z { font: 600 11px Inter, sans-serif; fill: rgba(255,255,255,0.35); }
  .mr-ticks { position: relative; height: 14px; font-size: 10px; color: var(--fg-mute); }
  .mr-ticks span { position: absolute; transform: translateX(-50%); top: 2px; }
  .mr-bl { margin: 6px 0 4px; border-top: 1px solid var(--border); padding-top: 6px; }
  .mr-bl-row.more { display: none; }   /* первые 2 зевка видны сразу, остальные — по «Ещё N» */
  .mr.bl-all .mr-bl-row.more { display: grid; }
  .mr-bl-more { font: 12px Inter, sans-serif; color: var(--c-debut); background: none; border: none; padding: 4px 0 0; cursor: pointer; }
  .mr-bl-more:hover { text-decoration: underline; }
  .mr-bl-row { display: grid; grid-template-columns: 10px 58px 64px 1fr 110px 50px 100px 12px; align-items: center; gap: 8px; font-size: 12px; padding: 3px 0; color: var(--fg-dim); }
  .mr-bl-row.go { cursor: pointer; border-radius: 6px; margin: 0 -8px; padding: 3px 8px; outline: none; transition: background 0.15s; }
  .mr-bl-row.go:hover, .mr-bl-row.go:focus-visible { background: rgba(255,255,255,0.05); }
  .mr-bl-go { color: var(--fg-mute); font-size: 14px; line-height: 1; opacity: 0; transition: opacity 0.15s; }
  .mr-bl-row.go:hover .mr-bl-go, .mr-bl-row.go:focus-visible .mr-bl-go { opacity: 1; color: #60a5fa; }
  .mr-bl-row i { width: 8px; height: 8px; border-radius: 50%; }
  .mr-bl-row b { color: var(--fg); }
  .mr-bl-t { font-weight: 600; }
  .mr-bl-d { color: var(--red); text-align: right; }
  .mr .detail-links { display: flex; justify-content: flex-end; }
  @media (max-width: 700px) {
    .detail-inner.mr { padding: 12px; position: sticky; left: 0; width: calc(100vw - 34px); box-sizing: border-box; }   /* таблица шире экрана и крутится вбок — отчёт остаётся в видимой части */
    .mr-phs { grid-template-columns: 1fr; gap: 10px; }
    .mr-z { display: none; }
    .mr-head { flex-wrap: wrap; }
    .mr-stats { grid-template-columns: 1fr; gap: 12px; }
    .mr-bl-row { grid-template-columns: 10px 50px 56px 1fr 60px 12px; }
    .mr-bl-go { opacity: 1; }   /* на телефоне наведения нет — стрелка видна всегда */
    .mr-bl-b, .mr-bl-p { display: none; }
  }
  .bl-row { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; }
  .bl-row .detail-label { font-size: 12px; margin-right: 2px; }
  .bl-chip { font-size: 11px; font-weight: 600; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
    background: color-mix(in srgb, var(--c) 10%, transparent); border-radius: 999px; padding: 2px 9px; cursor: help; white-space: nowrap; }
  .bl-chip i { font-style: normal; font-weight: 400; opacity: 0.7; }
  .detail-d.up { color: #4ade80; }
  .detail-d.down { color: #f87171; }
  .detail-links { flex-basis: 100%; justify-content: flex-end; display: flex; gap: 12px; align-items: baseline; white-space: nowrap; }
  .detail-link { font-size: 12px; color: var(--c-debut); text-decoration: none; }
  button.detail-link { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; cursor: pointer; }
  .detail-link:hover { text-decoration: underline; }

  .pager { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
  .pager button {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 6px;
    padding: 4px 12px;
    cursor: pointer;
    font-size: 14px;
  }
  .pager button:disabled { opacity: 0.4; cursor: default; }
  #pageInfo { color: var(--fg-dim); font-size: 13px; }

  .footer { text-align: center; color: var(--fg-dim); font-size: 12px; padding: 24px; }

  /* ---------- Narrow screens ---------- */
  @media (max-width: 760px) {
    .main-container { margin-top: 16px; padding: 0 12px 12px; border-radius: 12px; }
    .profile-row { flex-direction: column; margin: 0 0 24px; padding: 0; }
    .profile-card { margin-left: 0; min-width: 0; border-radius: 12px 12px 0 0; }
    .profile-side { margin-right: 0; }
    .links { border-radius: 0 0 12px 12px; flex-wrap: wrap; gap: 12px; padding: 10px 12px; justify-content: space-around; }
    .link-sep { display: none; }
    .mn { position: static; }
    .mn-panel { left: 8px; right: 8px; width: auto; top: auto; height: auto; max-height: 70vh; grid-template-columns: 1fr; }
    .mn-groups { display: flex; flex-wrap: wrap; gap: 4px; border-right: none; border-bottom: 1px solid var(--border); }
    .mn-g { width: auto; padding: 6px 9px; }
    .mn-g small { display: none; }
    .side-row { flex-direction: column; margin: 12px 0 4px; }
    .pz-card { flex-basis: auto; }
    .pz-detail { display: none; grid-template-columns: 1fr; gap: 10px; }
    .side-row.open .pz-detail { display: grid; }
    .pz-detail, .op-detail, .vd-detail { position: static; width: auto; }
    .vd-card { width: auto; flex-basis: auto; }
    .vd-detail { display: none; }
    .side-row.vd-open .vd-detail { display: flex; }
    .side-row.vd-open .pz-card, .side-row.vd-open .op-card, .side-row.op-open .vd-card, .side-row.open .vd-card { opacity: 1; pointer-events: auto; }
    .op-card { width: auto; flex-basis: auto; }
    .op-detail { display: none; grid-template-columns: 1fr; gap: 10px; }
    .side-row.op-open .op-detail { display: grid; }
    .side-row.open .op-card { opacity: 1; pointer-events: auto; }
    .chart-container::before, .chart-container::after { display: none; }
    .panel-stack { width: 100%; }
    .panel-stack > .stats-panel { width: 100%; }
    .stats-panel { width: 100%; border-bottom: 3px solid var(--divider); }
    .stats-list .stat { padding-top: 6px; }
    .chart-area { flex-basis: 100%; padding: 12px 2px 4px; }
    .legend { padding: 8px 12px; flex-wrap: wrap; gap: 8px 16px; }
    .legend-wr { position: static; width: 100%; justify-content: center; transform: none; }
    .records-btn { left: auto; right: 132px; }
    .rec-scope { top: auto; bottom: 48px; left: 50%; }
    .rec-view { padding: 36px 8px 8px; }
    .rec-grid { grid-template-columns: 1fr; }
    .rec-tiles { grid-template-columns: 1fr 1fr; }
    .footer { padding: 16px; }
  }

  /* ---------- телефон (≤760px): доработка 30.09.2026 ---------- */
  @media (max-width: 760px) {
    body { overflow-x: hidden; }
    /* заголовок блока: фильтр переносится под заголовок */
    .chart-head { flex-wrap: wrap; gap: 8px; }
    .chart-head .chart-title { flex-basis: 100%; }
    .cf-pills { margin-left: 0; justify-content: flex-start; }
    .cf-pills:empty + .cf-summary { margin-left: 0; }
    .cf .f-menu { left: 0; right: auto; width: min(340px, calc(100vw - 40px)); }
    .cf-grid { grid-template-columns: 1fr; }
    .cf-col + .cf-col { padding-left: 0; border-left: none; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px; }
    /* кнопки «Рекорды» / период / «Активность» — строкой между панелью и графиком */
    .panel-stack { order: 1; }
    .records-btn, .act-range, .activity-btn, .rec-scope { position: static; transform: none; order: 2; margin: 10px 0 0; }
    .records-btn { margin-left: 10px; }
    .act-range { margin-left: auto; margin-right: auto; height: 39px; }
    .activity-btn { margin-left: 8px; margin-right: 0; }
    .analysis-btn { position: relative; order: 2; margin: 10px 0 0 8px; padding: 0 10px; letter-spacing: 0.5px; }   /* relative — для «!» в углу */
    #eyeChart { position: static; order: 2; margin: 10px 10px 0 8px; }
    .records-btn, .activity-btn { padding: 0 10px; letter-spacing: 0.5px; }
    .act-range { padding: 0 10px; font-size: 0; gap: 0; }   /* на телефоне только даты, без слова «Период» */
    .act-range b { font-size: 13px; }
    .records-on .rec-scope { display: flex; margin-left: auto; margin-right: auto; }
    .chart-area { order: 3; }
    .legend-rule { order: 4; background: #2a2e3f; top: 0; }
    .legend { order: 5; }
    .legend .legend-item { top: 0; }
    /* график: прокрутка вбок, чтобы подписи не были микроскопическими */
    .chart-area { overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 8px 4px 4px; }
    .chart-area > svg { min-width: 580px; }
    .rec-view { padding: 8px 4px; }
    /* панели карточек — в одну колонку */
    .pz-detail, .op-detail { grid-template-columns: 1fr !important; }
    .vd-list { grid-template-columns: 1fr; }
    .vdx-cols { grid-template-columns: 1fr; }
    .vdx-head { flex-wrap: wrap; gap: 8px 14px; }
    .vd-detail.vdx { position: static !important; display: none; }
    .vd-detail.vdx.show { display: flex; }
    .pz-card, .op-card, .vd-card { width: auto !important; min-height: 120px; }
    /* поиск — выпадающий список по ширине экрана */
    .links { position: relative; }
    /* таблица */
    .filters { gap: 6px; }
    .f-menu, .f-menu.f-menu-mode { width: min(320px, calc(100vw - 40px)); }
    .f-menu.f-menu-mode { left: 0; right: auto; }
    .md-cols { grid-template-columns: 1fr; }
    .md-col + .md-col { padding-left: 0; border-left: none; }
    /* анализ: всё в одну колонку — партии, ходы, доска, график */
    .an-box { order: 3; grid-template-columns: minmax(0, 1fr); }
    .an-list { grid-row: auto; border-right: none; border-bottom: 3px solid var(--divider); min-height: 0; }
    .an-list-in { position: static; max-height: 230px; }
    .an-moves { border-right: none; }
    .an-moves-in { position: static; max-height: 300px; }
    .an-board { order: 1; padding: 12px 8px; }
    .an-mom { order: 2; border-right: none; } .an-moves { order: 3; } .an-graph { order: 4; }
    .an-mom-in { position: static; max-height: 190px; }
    .an-board svg { width: 100%; }
    .an-graph, .an-lock { grid-column: auto; }
    .an-graph .mr-leg { display: none; }
    .an-box.an-wide .an-moves { grid-column: auto; }
  }
</style>
</head>

                  <div class="f-foot"><button class="f-link" data-act="clear">Сбросить фильтр графика</button></div>

  <div class="chart-container" id="chartBox">

  // если партий пока мало — сравниваем по максимуму доступного (приписка покажет, сколько игр)
  var half = Math.min(avgWindow / 2, Math.floor(winEnd() / 2));
  var withTrend = !hush.chart && !dayView && avgWindow >= 10 && half >= 2 && !selCount();   // при выбранных колонках прирост не считаем
  function tr(fn) { return withTrend ? trend(fn, half, cgAll.slice(0, winEnd())) : null; }
  // без прироста строка остаётся пустой, чтобы высота блока не прыгала при переключении
  function th(diff, isPct, lowerIsBetter) {
    // пусто и когда партий пока меньше, чем нужно для сравнения
    return (withTrend && trendHtml(diff, isPct, lowerIsBetter, half)) || '<span class="trend" style="visibility:hidden">▲</span>';
  }

  $('statsList').innerHTML = STATS.map(function(s) {
    var v = avg(list, s.key);
    var value = v === null ? '—' : v.toFixed(1) + '<small>%</small>';
    var diff = tr(function(l) { return avg(l, s.key); });
    // скрытый показатель рождается приглушённым: иначе класс off добавлялся после перерисовки графика и строка мигала (transition opacity у .toggle)
    return '<div class="stat toggle' + (hiddenSeries[s.key] ? ' off' : '') + '" data-s="' + s.key + '" role="button" tabindex="0" style="--sc:' + s.color + '">' + statLine(s.label, s.color, value, s.dotOpacity) +
           '<div class="stat-trend">' + th(diff, true, false) + '</div></div>';
  }).join('');

  var b = avg(list, 'blunders');
  $('statsBlunders').innerHTML = '<button class="bl-info' + (blMode ? ' on' : '') + '" type="button"' + (showRecords ? '' : ' title="' + (blMode ? 'Вернуть обычный график' : 'Показать на графике типы зевков') + '"') + '>i</button>' +   // в «Рекордах» недоступна — без подсказки
    statLine('Зевки', 'var(--c-blunder)', b === null ? '—' : b.toFixed(1)) +
    '<div class="stat-trend">' +
    th(tr(function(l) { return avg(l, 'blunders'); }), false, true) + '</div>';
}

/* ---------- show / hide chart series (side panel + legend) ---------- */
var DEFAULT_HIDDEN = {end: true};   // эндшпиль по умолчанию скрыт, включается кликом
var hiddenSeries = DEFAULT_HIDDEN;
try {
  var saved = localStorage.getItem('hiddenSeries.v2');
  if (saved !== null) hiddenSeries = JSON.parse(saved) || {};
} catch (e) {}

// наведение на строку панели или легенду — эта серия ярче, остальные притухают
function focusSeries(key) {
  var svg = $('chart').querySelector('svg');
  if (!svg) return;
  svg.classList.toggle('focus', !!key);
  svg.querySelectorAll('.series').forEach(function(g) { g.classList.toggle('hl', g.getAttribute('data-s') === key); });
}
// закреплённое выделение (один клик) — держится, пока не кликнешь снова
var pinnedSeries = null;
document.addEventListener('mouseover', function(e) {
  var t = e.target.closest && e.target.closest('.toggle[data-s]');
  var k = t && !hiddenSeries[t.getAttribute('data-s')] ? t.getAttribute('data-s') : null;
  focusSeries(k || pinnedSeries);
});
function markPinned() {
  document.querySelectorAll('.toggle[data-s]').forEach(function(el) { el.classList.toggle('pinned', el.getAttribute('data-s') === pinnedSeries); });
}
function pinSeries(key) {
  if (hiddenSeries[key]) toggleSeries(key);
  pinnedSeries = pinnedSeries === key ? null : key;
  markPinned();
  focusSeries(pinnedSeries);
  if (showRecords && chartMode !== 'activity') renderRecords();
}

function applySeries() {
  document.querySelectorAll('[data-s]').forEach(function(el) {
    el.classList.toggle('off', !!hiddenSeries[el.getAttribute('data-s')]);
  });
  if (typeof pinnedSeries !== 'undefined' && pinnedSeries) { markPinned(); focusSeries(pinnedSeries); }
}

function toggleSeries(key) {
  if (hiddenSeries[key]) delete hiddenSeries[key]; else hiddenSeries[key] = true;
  try { localStorage.setItem('hiddenSeries.v2', JSON.stringify(hiddenSeries)); } catch (e) {}
  applySeries();
  if (showRecords && chartMode !== 'activity') renderRecords();
}

// делегирование: панель и легенда перерисовываются, обработчик один
// клик по панели слева — выделить линию (повторный клик снимает), клик по легенде снизу — скрыть / показать
document.addEventListener('click', function(e) {
  var t = e.target.closest && e.target.closest('.toggle[data-s]');
  if (!t || hush.chart) return;
  var k = t.getAttribute('data-s');
  if (t.closest('.legend')) {
    toggleSeries(k);
    if (hiddenSeries[k] && pinnedSeries === k) { pinnedSeries = null; markPinned(); }
    focusSeries(pinnedSeries);
  } else {
    pinSeries(k);
  }
});
document.addEventListener('keydown', function(e) {
  var t = e.target.closest && e.target.closest('.toggle[data-s]');
  if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); t.click(); }
});

/* ---------- chart ---------- */
var chartGames = [];

// партии за последние 14 дней, включая сегодня (календарный день по Москве, как в update.mjs)
var RECENT_DAYS = 14;
function renderRecentCount() {
  function iso(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  var today = gameToday();
  var from = new Date(today.getFullYear(), today.getMonth(), today.getDate() - (RECENT_DAYS - 1));
  var k = games.filter(function(g) { return g.day && g.day >= iso(from); }).length;
  return k + ' ' + plural(k, 'партия', 'партии', 'партий') + ' за последние 2 недели';
}

// серия: дни подряд с партиями, заканчивая сегодня (или вчера — сегодня ещё можно сыграть)
function streaks() {
  var days = games.map(function(g) { return g.day; }).filter(Boolean)
    .filter(function(d, i, a) { return a.indexOf(d) === i; }).sort();
  var best = 0, run = 0, prev = null;
  days.forEach(function(d) {
    var p = d.split('-'), cur = new Date(+p[0], p[1] - 1, +p[2]);
    run = prev && Math.round((cur - prev) / 864e5) === 1 ? run + 1 : 1;
    best = Math.max(best, run);
    prev = cur;
  });
  var set = {};
  days.forEach(function(d) { set[d] = true; });
  var day = gameToday();
  var playedToday = !!set[isoDay(day)];
  if (!playedToday) day = addDays(day, -1);
  var current = 0;
  while (set[isoDay(day)]) { current++; day = addDays(day, -1); }
  return {current: current, best: best, playedToday: playedToday};
}

// главное крупно (число дней), пояснение — мелким серым справа
function streakTitle() {
  var st = streaks();
  function days(n) { return n + ' ' + plural(n, 'день', 'дня', 'дней'); }
  function note(t) { return ' <span class="title-note">' + t + '</span>'; }
  if (st.current > 0) {
    var tail = !st.playedToday ? 'сыграй сегодня, чтобы продлить'
             : st.current >= st.best ? 'новый рекорд!'
             : 'рекорд ' + days(st.best);
    return '🔥 ' + days(st.current) + ' подряд' + note(tail);
  }
  return st.best > 0 ? 'Серия прервана' + note('рекорд ' + days(st.best)) : 'Начни серию сегодня';
}

// заголовок блока: в показателях — партии за 2 недели, в активности — серия
function renderTitle() {
  if (hush.chart) { $('chartTitle').textContent = 'Недавняя активность'; return; }
  if (chartMode === 'activity') $('chartTitle').innerHTML = streakTitle();
  else if (chartMode === 'analysis') $('chartTitle').textContent = 'Анализ партий';
  else $('chartTitle').textContent = renderRecentCount();
  cfFit();   // ширина заголовка меняется — метки фильтра пересчитать
}

function renderChart() {
  renderCmpBtn();
  var wv = !dayView && !hush.chart && !showRecords && cgAll.length > 0;
  $('winRange').style.display = wv ? '' : 'none';
  if (wv) {
    var wg = cgAll.slice(Math.max(0, winEnd() - avgWindow), winEnd());
    var d1 = wg.length ? wg[0].date : '', d2 = wg.length ? wg[wg.length - 1].date : '';
    $('winRangeTxt').textContent = d1 === d2 ? d1 : d1 + ' – ' + d2;
    $('winRangeTxt').classList.toggle('past', winPage > 0);
    $('winRangeTxt').title = winPage > 0 ? 'Нажми, чтобы вернуться к последним партиям' : '';
    $('wrPrev').disabled = winPage >= winPages() - 1;
    $('wrNext').disabled = winPage === 0;
  }
  var dv = dayView && !hush.chart && !showRecords;
  $('dayRange').style.display = dv ? '' : 'none';
  if (dv) {
    var nd = windowGames().length;
    $('dayRange').firstChild.nodeValue = (dayView.ranges.length === 1 && dayView.ranges[0].from === dayView.ranges[0].to ? 'ДЕНЬ ' : 'ДНИ ');
    $('dayRangeTxt').textContent = dayView.label + ' · ' + nd + ' ' + plural(nd, 'партия', 'партии', 'партий');
  }
  if (showRecords) { renderRecords(); return; }
  chartGames = windowGames();
  var cmpView = cmpMode === 'view' && selCount() && cmpCount();
  $('chartBox').classList.toggle('cmp-on', !!cmpView);
  if (cmpView) { $('chart').innerHTML = cmpHtml(); cmpFit(); return; }
  var list = chartGames, n = list.length;
  if (hush.chart) {
    var g0 = [];
    [100, 75, 50, 25, 0].forEach(function(p) {
      var y = 180 - p / 100 * 150;
      g0.push('<line x1="40" y1="' + y + '" x2="590" y2="' + y + '" stroke="#2a2d3a" stroke-width="0.5"/>');
      if (p > 0) g0.push('<text x="34" y="' + (y + 3.5) + '" text-anchor="end" font-size="9" fill="#9ca3af">' + p + '%</text>');
    });
    $('chart').innerHTML = '<svg viewBox="10 -10 600 245" role="img" aria-label="График">' + g0.join('') + '</svg>';
    return;
  }
  if (!n) {
    $('chart').innerHTML = '<div class="rec-view"><div class="rec-empty">' + (games.length ? 'Нет партий под фильтр графика' : 'Партий пока нет') + '</div></div>';
    return;
  }

  var X0 = 40, W = 550, TOP = 30, BOT = 180, H = BOT - TOP;
  var colW = W / n;
  // колонки не шире, чем при 10 партиях: меньше колонок — по центру графика
  var padN = dayView ? 0 : Math.max(0, avgWindow - n);   // обычный режим: окно всегда N колонок, недостающие слева пустые
  var slots = n + padN;
  colW = W / Math.max(slots, 10);
  var PX0 = 40 + (W - colW * slots) / 2;               // начало первой (в т. ч. пустой) колонки
  X0 = PX0 + padN * colW;
  var badgeW = Math.min(38, colW - 8);
  var narrow = colW < 24, tiny = colW < 14;   // 20+ колонок (режим дня) — значки мельче / только цвет
  var maxB = Math.max.apply(null, list.map(function(g) { return g.blunders; }));
  var bMax = Math.max(15, Math.ceil(maxB / 5) * 5);

  function colX(i) { return r2(X0 + i * colW); }
  function cx(i) { return r2(X0 + i * colW + colW / 2); }
  function yPct(v) { return r2(BOT - v / 100 * H); }
  function yBl(v) { return r2(BOT - Math.min(v, bMax) / bMax * H); }

  var s = [];

  // пустые колонки (партий в окне меньше N)
  for (var pi = 0; pi < padN; pi++) {
    s.push('<rect x="' + r2(PX0 + pi * colW) + '" y="-5" width="' + r2(colW) + '" height="200" fill="rgba(255,255,255,0.025)"/>');
    if (pi) s.push('<line x1="' + r2(PX0 + pi * colW) + '" y1="-5" x2="' + r2(PX0 + pi * colW) + '" y2="195" stroke="#0f1119" stroke-width="1.5" stroke-opacity="0.9"/>');
    s.push('<circle cx="' + r2(PX0 + pi * colW + colW / 2) + '" cy="192" r="1.6" fill="#4b5063"/>');
  }
  if (padN) s.push('<line x1="' + r2(X0) + '" y1="-5" x2="' + r2(X0) + '" y2="195" stroke="#0f1119" stroke-width="1.5" stroke-opacity="0.9"/>');

  // column tint
  list.forEach(function(g, i) {
    s.push('<rect x="' + colX(i) + '" y="-5" width="' + r2(colW) + '" height="200" fill="' + RESULT[g.result].col + '"/>');
  });
  // перегородки между партиями (между днями — толще, ниже)
  for (var i = 1; i < n; i++) {
    s.push('<line x1="' + colX(i) + '" y1="-5" x2="' + colX(i) + '" y2="195" stroke="#0f1119" stroke-width="1.5" stroke-opacity="0.9"/>');
  }
  // day groups: thick separator at each date change + centered date label
  var groups = [];
  list.forEach(function(g, i) {
    var cur = groups[groups.length - 1];
    if (cur && cur.date === g.date) cur.to = i;
    else groups.push({date: g.date, from: i, to: i});
  });
  groups.forEach(function(gr, k) {
    if (k > 0) s.push('<line x1="' + colX(gr.from) + '" y1="-5" x2="' + colX(gr.from) + '" y2="195" stroke="#6b7280" stroke-width="2"/>');
    s.push('<text x="' + r2((cx(gr.from) + cx(gr.to)) / 2) + '" y="214" text-anchor="middle" font-size="9" fill="#9ca3af">' + esc(gr.date) + '</text>');
  });
  // W/L/D badges
  if (!tiny) list.forEach(function(g, i) {
    var R = RESULT[g.result];
    s.push('<rect x="' + r2(cx(i) - badgeW / 2) + '" y="3" width="' + r2(badgeW) + '" height="20" rx="4" fill="' + R.badge + '"/>');
    s.push('<text x="' + cx(i) + '" y="17" text-anchor="middle" font-size="' + (narrow ? 9 : 12) + '" font-weight="700" fill="' + R.color + '">' + R.letter + '</text>');
  });
  // grid + % axis (left) + blunders axis (right)
  [100, 75, 50, 25, 0].forEach(function(p) {
    var y = yPct(p);
    s.push('<line x1="40" y1="' + y + '" x2="590" y2="' + y + '" stroke="#2a2d3a" stroke-width="0.5"/>');
    if (p > 0 && !blMode) s.push('<text x="34" y="' + (y + 3.5) + '" text-anchor="end" font-size="9" fill="#9ca3af">' + p + '%</text>');   // в режиме зевков шкала % не нужна
  });
  // шкала зевков прячется вместе с линией зевков
  s.push('<g class="series' + (hiddenSeries.blunders ? ' off' : '') + '" data-s="blunders">');
  [1, 2 / 3, 1 / 3].forEach(function(f) {
    var v = Math.round(bMax * f);
    s.push('<text x="595" y="' + (yBl(v) + 3) + '" font-size="8" fill="#f87171" opacity="0.6">' + v + '</text>');
  });
  s.push('</g>');
  // knights (side played)
  if (!tiny) list.forEach(function(g, i) {
    s.push('<text x="' + cx(i) + '" y="198" text-anchor="middle" font-size="' + (narrow ? 11 : 16) + '" fill="#d1d5db">' + KNIGHT[g.color] + '</text>');
  });

  // одна серия = <g data-s> с линией и точками; null (фаза не наступила) рвёт линию
  function series(key, y, line, dot, color) {
    var runs = [[]];
    list.forEach(function(g, i) {
      var v = y(g);
      if (v === null) { if (runs[runs.length - 1].length) runs.push([]); }
      else runs[runs.length - 1].push(cx(i) + ',' + v);
    });
    var out = '<g class="series' + (hiddenSeries[key] ? ' off' : '') + '" data-s="' + key + '">';
    runs.forEach(function(r) {
      if (r.length < 2) return;
      // заливка под линией — видна, когда показатель подсвечен наведением
      if (color) out += '<polygon class="area" points="' + r.join(' ') + ' ' + r[r.length - 1].split(',')[0] + ',' + BOT + ' ' + r[0].split(',')[0] + ',' + BOT + '" fill="url(#ga-' + key + ')"/>';
      out += '<polyline points="' + r.join(' ') + '" fill="none" stroke-linejoin="round" stroke-linecap="round" ' + line + '/>';
    });
    list.forEach(function(g, i) {
      var v = y(g);
      if (v !== null) out += '<circle cx="' + cx(i) + '" cy="' + v + '" ' + dot + '/>';
    });
    return out + '</g>';
  }
  function pct(key) { return function(g) { return typeof g[key] === 'number' ? yPct(g[key]) : null; }; }

  // порядок = слои: нижние первыми
  if (!blMode) s.push(series('acc', pct('acc'), 'stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"', 'r="3" fill="#9ca3af" opacity="0.5"', '#9ca3af'));
  if (!blMode) s.push(series('blunders', function(g) { return yBl(g.blunders); }, 'stroke="#f87171" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"', 'r="3" fill="#f87171" opacity="0.85"', '#f87171'));
  else {
    var bw = Math.min(colW * 0.42, 22), unit = H / bMax;
    list.forEach(function(g, i) {
      var y0 = BOT, cnt = {}, shown = 0;
      (g.bl || []).forEach(function(b) { if (!blHidden[b.t]) { cnt[b.t] = (cnt[b.t] || 0) + 1; shown++; } });   // скрытые в легенде типы не рисуются
      BL_ORDER.forEach(function(t) {
        if (!cnt[t]) return;
        var h = Math.min(cnt[t], bMax) * unit;
        y0 -= h;
        s.push('<rect x="' + r2(cx(i) - bw / 2) + '" y="' + r2(y0) + '" width="' + r2(bw) + '" height="' + r2(Math.max(h - 1, 1)) + '" rx="2" fill="' + BL_TYPES[t].color + '" opacity="0.9"/>');
      });
      if (shown) s.push('<text x="' + cx(i) + '" y="' + r2(y0 - 4) + '" text-anchor="middle" font-size="10" font-weight="700" fill="#f3f4f6">' + shown + '</text>');
    });
  }
  if (!blMode) s.push(series('end', pct('end'), 'stroke="#a78bfa" stroke-width="2" opacity="0.8"', 'r="3.5" fill="#a78bfa" opacity="0.9"', '#a78bfa'));
  if (!blMode) s.push(series('debut', pct('debut'), 'stroke="#60a5fa" stroke-width="2.5" opacity="0.8"', 'r="4" fill="#60a5fa" opacity="0.9"', '#60a5fa'));
  if (!blMode) s.push(series('mid', pct('mid'), 'stroke="#f59e0b" stroke-width="2.5" opacity="0.8"', 'r="4" fill="#f59e0b" opacity="0.9"', '#f59e0b'));

  // линии средних: ровно по тем партиям, что на графике (= число в панели слева)
  [['acc', '#9ca3af', yPct, '%'], ['debut', '#60a5fa', yPct, '%'], ['mid', '#f59e0b', yPct, '%'],
   ['end', '#a78bfa', yPct, '%'], ['blunders', '#f87171', yBl, '']].filter(function() { return !blMode; }).forEach(function(a) {
    var v = avg(selCount() ? list.filter(function(g) { return selCols[g.id]; }) : list, a[0]);
    if (v === null) return;
    var yy = a[2](v);
    s.push('<g class="series avg-line' + (hiddenSeries[a[0]] ? ' off' : '') + '" data-s="' + a[0] + '">' +
      '<line x1="40" y1="' + yy + '" x2="590" y2="' + yy + '" stroke="' + a[1] + '" stroke-width="1" stroke-dasharray="2,4"/>' +
      '<text x="588" y="' + r2(yy - 3) + '" text-anchor="end" font-size="8" font-weight="600" fill="' + a[1] + '">ср. ' + v.toFixed(1) + a[3] + '</text></g>');
  });

  if (selCount()) list.forEach(function(g, i) {
    if (cmpMode && cmpSet[g.id]) { s.push('<rect x="' + (colX(i) + 0.75) + '" y="-4.25" width="' + r2(colW - 1.5) + '" height="198.5" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-opacity="0.8" stroke-width="1.2" rx="2"/>'); return; }
    if (selCols[g.id]) s.push('<rect x="' + (colX(i) + 0.75) + '" y="-4.25" width="' + r2(colW - 1.5) + '" height="198.5" fill="rgba(255,255,255,0.04)" stroke="#e4e4e7" stroke-opacity="0.55" stroke-width="1.2" rx="2"/>');
    else s.push('<rect x="' + colX(i) + '" y="-5" width="' + r2(colW) + '" height="200" fill="#0d0f17" opacity="0.62"/>');
  });
  // hover / tap areas: the whole column, on top of everything
  list.forEach(function(g, i) {
    s.push('<rect class="hit" data-i="' + i + '" x="' + colX(i) + '" y="-5" width="' + r2(colW) + '" height="200" fill="rgba(0,0,0,0)"/>');
  });

  var defs = '<defs>' +
    '<filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    [['acc', '#9ca3af'], ['blunders', '#f87171'], ['end', '#a78bfa'], ['debut', '#60a5fa'], ['mid', '#f59e0b']].map(function(a) {
      return '<linearGradient id="ga-' + a[0] + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + a[1] + '" stop-opacity="0.32"/><stop offset="1" stop-color="' + a[1] + '" stop-opacity="0"/></linearGradient>';
    }).join('') +
    [['win', '#2f7a4a', '#1d4a2f'], ['lose', '#7a2f36', '#4a1d22'], ['draw', '#4b5063', '#2c3040']].map(function(a) {
      return '<linearGradient id="gb-' + a[0] + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + a[1] + '"/><stop offset="1" stop-color="' + a[2] + '"/></linearGradient>';
    }).join('') + '</defs>';
  $('chart').innerHTML = '<svg viewBox="10 -10 600 245" role="img" aria-label="График последних партий"' + (blMode ? ' class="bl-mode"' : '') + '>' + defs + s.join('') + '</svg>';
  $('chartBox').classList.toggle('bl-on', blMode);
  renderBlLegend(list);
  bindTooltip();
}

/* ---------- типы зевков (scripts/blunders.mjs → поле bl у партии) ---------- */

  if (inp && e.type !== 'click') {
    var d = f.dates ? {from: f.dates.from, to: f.dates.to} : {from: null, to: null}, side = inp.getAttribute('data-db');
    d[side] = inp.value || null;

var cfilt = {results: {}, colors: {}, openings: {}, ranges: {}};
// фильтры графика и таблицы запоминаются между перезагрузками (localStorage: chartFilt.v1, tblFilt.v1); сохраняются при каждой перерисовке кнопок
function filtSave(key, f) { try { localStorage.setItem(key, JSON.stringify(f)); } catch (e) {} }
function filtLoad(key, def) {
  try {
    var o = JSON.parse(localStorage.getItem(key) || 'null');
    if (!o || typeof o !== 'object') return def;
    ['results', 'colors', 'openings', 'ranges', 'modes', 'planOps'].forEach(function(k) { if (o[k] !== undefined && (!o[k] || typeof o[k] !== 'object')) delete o[k]; });
    ['results', 'colors', 'openings', 'ranges'].forEach(function(k) { o[k] = o[k] || {}; });
    return o;
  } catch (e) { return def; }
}

function filterChart(list) {
  return list.filter(function(g) {
    if (!modeMatch(g, cfilt.modes)) return false;
    if (hasKeys(cfilt.results) && !cfilt.results[g.result]) return false;
    if (hasKeys(cfilt.colors) && !cfilt.colors[g.color]) return false;
    if (hasKeys(cfilt.openings) && !cfilt.openings[g.opening]) return false;
    if (cfilt.planOps && hasKeys(cfilt.planOps) && !cfilt.planOps[planOpKey(g)]) return false;
    if (!dateMatch(g, cfilt.dates)) return false;
    for (var k in cfilt.ranges) {
      var r = cfilt.ranges[k], v = g[k];
      if (typeof v !== 'number') return false;
      if (r.min !== null && v < r.min) return false;
      if (r.max !== null && v > r.max) return false;
    }
    return true;
  });
}

function cfActive() { return modeCount(cfilt.modes) > 0 || hasKeys(cfilt.results) || hasKeys(cfilt.colors) || hasKeys(cfilt.openings) || hasKeys(cfilt.planOps || {}) || hasKeys(cfilt.ranges) || dateActive(cfilt.dates); }

function cfClear() { cfilt = {results: {}, colors: {}, openings: {}, ranges: {}}; renderCfInputs(); renderCfDates(); chartFilterChanged(); }
$('cfReset').addEventListener('click', function(e) { e.stopPropagation(); if (!cfActive()) return; if ($('cf').classList.contains('open')) $('cf').querySelector('.f-btn').click(); cfClear(); });

  cgAll = filterChart(games);
  winPage = 0;

}

}

// активные фильтры — метками с крестиком в строке заголовка
function renderChartFilter(keepMenu) {
  filtSave('chartFilt.v1', cfilt);
  var pills = [];
  F_RESULTS.forEach(function(r) { if (cfilt.results[r.key]) pills.push({t: 'r', k: r.key, label: r.label}); });
  ['white', 'black'].forEach(function(c) { if (cfilt.colors[c]) pills.push({t: 'c', k: c, label: KNIGHT[c] + ' ' + COLOR_NAME[c]}); });
  for (var mg in (cfilt.modes || {})) Object.keys(cfilt.modes[mg]).forEach(function(k) { pills.push({t: 'md', k: mg + ':' + k, label: modeLabel(mg, k)}); });
  Object.keys(cfilt.openings).forEach(function(o) { pills.push({t: 'o', k: o, label: o}); });

  Object.keys(cfilt.ranges).forEach(function(k) { pills.push({t: 'm', k: k, label: rangeLabel(k)}); });
  if (dateActive(cfilt.dates)) pills.push({t: 'd', k: 'd', label: 'Даты: ' + dateLabel(cfilt.dates)});

  var H = hush.chart, act = !H && cfActive();
  if (H) pills = [];

  $('cfCount').innerHTML = '<b>' + cgAll.length + '</b> из ' + games.length;

  }).join('') + (pills.length > 1 ? '<button type="button" class="cf-pill cf-more-p" data-cfmore style="display:none" title="Все условия — в «Фильтре графика»"></button>' : '');
  cfFit();

  btn.innerHTML = (pills.length ? '<span class="cf-cnt">' + pills.length + '</span>' : '⏷ ') + 'Фильтр';   // кнопка в блоке «Фильтр | X из Y | Сброс»; число условий — кружком
  btn.title = act ? 'Под фильтр подходит ' + cgAll.length + ' из ' + games.length + ' партий · условий: ' + pills.length : 'Фильтр для графика показателей и активности';
  if (!keepMenu && $('cf').classList.contains('open')) renderCfMenu();

// метки фильтра — в одну строку между заголовком и кнопкой: лишние с конца прячутся, вместо них «+N» (клик — открыть фильтр)
function cfFit() {
  var box = $('cfPills'), more = box.querySelector('.cf-more-p');
  if (!more) return;
  var ps = [].slice.call(box.querySelectorAll('.cf-pill:not(.cf-more-p)')), gap = 6, w = function(el) { return el.getBoundingClientRect().width; };
  ps.forEach(function(p) { p.style.display = ''; }); more.style.display = 'none';
  var W = box.clientWidth, total = ps.reduce(function(s, p) { return s + w(p) + gap; }, -gap);
  if (!W || total <= W + 0.5) return;
  more.style.display = '';
  for (var i = ps.length - 1, hid = 0; i > 0; i--) {
    total -= w(ps[i]) + gap; ps[i].style.display = 'none'; hid++;
    more.textContent = '+' + hid;
    if (total + gap + w(more) <= W + 0.5) break;
  }
}
window.addEventListener('resize', cfFit);
$('cfPills').addEventListener('click', function(e) {

  } else {
    var map = {r: cfilt.results, c: cfilt.colors, o: cfilt.openings, po: cfilt.planOps || {}, m: cfilt.ranges}[b.getAttribute('data-t')];
    delete map[b.getAttribute('data-k')];

});

/* ---------- table (newest first) ---------- */
var currentPage = 0;

function detailItem(label, value, color, delta) {
  return '<div class="detail-item"><div class="detail-label">' + label + '</div>' +
         '<div class="detail-value"' + (color ? ' style="color:' + color + '"' : '') + '>' + value + '</div>' + (delta || '') + '</div>';
}
// «(+9)» — насколько партия лучше / хуже твоего среднего по остальным партиям
function detailDelta(g, key, pct, lower) {
  if (typeof g[key] !== 'number') return '';
  var others = games.filter(function(x) { return x !== g; }), m = avg(others, key);
  if (m === null) return '';
  var d = g[key] - m, r = Math.round(Math.abs(d) * (pct ? 1 : 10)) / (pct ? 1 : 10);
  var mTxt = (Math.round(m * 10) / 10) + (pct ? '%' : '');
  if (!r) return '<span class="detail-d" title="Как в среднем (' + mTxt + ')">(=)</span>';
  var good = lower ? d < 0 : d > 0;
  return '<span class="detail-d ' + (good ? 'up' : 'down') + '" title="Твоё среднее по остальным партиям: ' + mTxt + '">(' +
    (d > 0 ? '+' : '−') + r + ')</span>';
}

// 2. «Показать на графике»: выделить колонку партии (расширить окно / снять фильтр графика, если нужно)
function chartReach(g) {
  var i = games.indexOf(g);
  return i >= 0 && games.length - i <= WINDOWS[WINDOWS.length - 1];
}
function showOnChart(g) {
  dayView = null; winPage = 0;
  if (cgAll.indexOf(g) < 0) {   // партию скрывает фильтр графика — снимаем его
    cfilt = {results: {}, colors: {}, openings: {}, ranges: {}, modes: {}};
    renderCfInputs();
    chartFilterChanged();
  }
  var fromEnd = cgAll.length - cgAll.indexOf(g);
  if (fromEnd > avgWindow) {
    avgWindow = WINDOWS.filter(function(w) { return w >= fromEnd; })[0] || WINDOWS[WINDOWS.length - 1];
    dayView = null;
    try { localStorage.setItem('avgWindow', String(avgWindow)); } catch (e) {}
  }
  gsChart('metrics', false);
  selCols = {}; cmpMode = null; cmpSet = {};
  selCols[g.id] = true;
  renderWindow();
}

function irCell(ir) {
  if (typeof ir !== 'number') return '<td style="color:var(--fg-dim)">—</td>';
  var color = ir > 0 ? 'var(--green)' : ir < 0 ? 'var(--red)' : 'var(--fg-dim)';
  var text = ir > 0 ? '+' + ir : ir < 0 ? '−' + Math.abs(ir) : '0';
  return '<td style="color:' + color + ';font-weight:600">' + text + '</td>';
}

// высота таблицы не «прыгает» при фильтрах: держим высоту полной страницы (как без фильтров),
// сообщение «ничего не нашлось» — по центру этого места
var tableFullH = 0;
function keepTableHeight(rowsShown) {
  var wrap = document.querySelector('.table-wrap');
