<script>
/* =====================================================================
   ОГЛАВЛЕНИЕ — ищи разделы по заголовкам «/* ---------- … ---------- *\/»
   Полная карта проекта и принятые решения: progress/README.md

   PROFILE + константы ........ этап, цель этапа, окна средних, размер таблицы
   helpers .................... $, esc, plural, avg, winrate, trend
   winrate ⇄ ELO .............. карточка профиля
   stats panel / averages ..... панель «Средние», окно 5/10/20
   show / hide chart series ... выделение (клик слева) и скрытие (клик по легенде)
   chart ...................... SVG графика показателей, серия дней, заголовок
   tooltip .................... подсказка по партии
   table filters .............. фильтры таблицы
   chart filter ............... фильтр графика (общий для показателей и активности)
   table ...................... таблица партий
   activity mode / panel ...... график активности, сводка за период, ELO за период
   records .................... рекорды партий и активности
   switch ..................... переключение показатели ⇄ активность
   карточка задач / подробности  карточка и панель задач
   дебюты ..................... карточка и панель дебютов (data/openings.js)
   итоги ...................... buildVerdicts — все правила выводов
   глобальный поиск ........... gsIndex — все команды поиска
   go ......................... первичная отрисовка

   Данные: data/games.js и data/puzzles.js создаёт update.bat (не править),
   data/openings.js правится вручную. Здесь правится только PROFILE.
   ===================================================================== */
var PROFILE = {
  start: '26.09.2026',
  stage: 'Этап 1: Итальянская за белых vs Stockfish 3',
  goal: {engine: 'Stockfish 3', color: 'white', need: 4, of: 5}   // цель этапа — для «Итогов»
};

var games = window.GAMES || [];
var cgAll = games;   // партии для графика с учётом фильтра графика

/* ===================================================================== */

var CHART_N = 10;   // окно по умолчанию: средние и график за N последних партий (5 / 10 / 20)
var TREND_N = 5;    // тренд: последние N против предыдущих N
var TABLE_N = 30;   // сколько последних партий в таблице
var PER_PAGE = 10;  // партий на страницу таблицы

var RESULT = {
  win:  {letter:'W', label:'Победа',    short:'Win',  color:'#22c55e', badge:'#2d5a3d', col:'rgba(34,197,94,0.14)',   bg:'var(--green-bg)'},
  lose: {letter:'L', label:'Поражение', short:'Lose', color:'#ef4444', badge:'#5a2d2d', col:'rgba(239,68,68,0.14)',   bg:'var(--red-bg)'},
  draw: {letter:'D', label:'Ничья',     short:'Draw', color:'#d1d5db', badge:'#3a3d4a', col:'rgba(156,163,175,0.1)', bg:'var(--grey-bg)'}
};
var COLOR_NAME = {white:'Белые', black:'Чёрные'};
var KNIGHT = {white:'♞', black:'♘'};

games.forEach(function(g, i) { g.n = i + 1; });

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function plural(n, one, few, many) {
  var m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

function hasEnd(g) { return typeof g.end === 'number'; }

function avg(list, key) {
  var vals = list.filter(function(g) { return typeof g[key] === 'number'; })
                 .map(function(g) { return g[key]; });
  if (!vals.length) return null;
  return vals.reduce(function(a, b) { return a + b; }, 0) / vals.length;
}

function winrate(list) {
  if (!list.length) return null;
  return list.filter(function(g) { return g.result === 'win'; }).length / list.length * 100;
}

// last TREND_N vs previous TREND_N; null if not enough games or data
// последние n партий против предыдущих n (по умолчанию TREND_N)
function trend(fn, n, list) {
  n = n || TREND_N;
  list = list || cgAll;
  if (list.length < n * 2) return null;
  var last = fn(list.slice(-n));
  var prev = fn(list.slice(-n * 2, -n));
  return (last === null || prev === null) ? null : last - prev;
}

function r1(v) { return Math.round(v * 10) / 10; }        // 17 / 14.2
function r2(v) { return Math.round(v * 100) / 100; }      // svg coords

function trendHtml(diff, isPct, lowerIsBetter, n) {
  if (diff === null) return '';
  n = n || TREND_N;
  var d = r1(diff);
  var good = lowerIsBetter ? d < 0 : d > 0;
  var color = d === 0 ? 'var(--fg-mute)' : good ? 'var(--up)' : 'var(--red)';
  var arrow = d > 0 ? '▲' : d < 0 ? '▼' : '■';
  var sign = d > 0 ? '+' : d < 0 ? '−' : '';
  var val = isPct ? Math.abs(d) + '%' : Math.abs(d).toFixed(1);
  return '<span class="trend" style="color:' + color + '">' + arrow + ' ' + sign + val +
         ' <span class="trend-n">' + n + ' ' + plural(n, 'игра', 'игры', 'игр') + '</span></span>';
}

function wrColorClass(v) { return v >= 60 ? 'green' : v >= 40 ? 'yellow' : 'red'; }

/* ---------- profile card + legend ---------- */
/* ---------- winrate ⇄ ELO (click) ---------- */
var PERF_RU = {bullet:'Пуля', blitz:'Блиц', rapid:'Рапид', classical:'Классика', correspondence:'Переписка'};
var wrView, eloView;
var showElo = false;
try { showElo = localStorage.getItem('wrMode') === 'elo'; } catch (e) {}

// рейтинг по последней рейтинговой партии; изменение — сумма за последние TREND_N партий того же контроля
function buildEloView() {
  var all = window.RATING_GAMES || [];
  var nTxt = '<span class="trend-n">' + TREND_N + ' ' + plural(TREND_N, 'игра', 'игры', 'игр') + '</span>';
  if (!all.length) {
    return {
      label: 'Рейтинг ELO',
      cls: 'wr-value',
      value: '? <span class="trend" style="color:var(--fg-mute)">? ' + nTxt + '</span>',
      sub: 'рейтинговых партий пока нет'
    };
  }
  var perf = all[all.length - 1].perf;
  var list = all.filter(function(r) { return r.perf === perf; });
  var cur = list[list.length - 1].after;
  var recent = list.slice(-TREND_N);
  var diff = recent.reduce(function(s, r) { return s + r.diff; }, 0);
  var color = diff > 0 ? 'var(--up)' : diff < 0 ? 'var(--red)' : 'var(--fg-mute)';
  var arrow = diff > 0 ? '▲ +' : diff < 0 ? '▼ −' : '■ ';
  var k = recent.length;
  var peak = Math.max.apply(null, list.map(function(r) { return r.after; }));
  return {
    label: 'Рейтинг ELO' + (PERF_RU[perf] ? ' · ' + PERF_RU[perf] : ''),
    cls: 'wr-value',
    value: cur + ' <span class="trend" style="color:' + color + '">' + arrow + Math.abs(diff) +
           ' <span class="trend-n">' + k + ' ' + plural(k, 'игра', 'игры', 'игр') + '</span></span>',
    sub: 'Пик ' + peak + ' — ' + list.length + ' ' + plural(list.length, 'рейтинговая партия', 'рейтинговые партии', 'рейтинговых партий')
  };
}

function renderWrBox() {
  var v = showElo ? eloView : wrView;
  $('wrLabel').textContent = v.label;
  $('wrValue').className = v.cls;
  $('wrValue').innerHTML = v.value;
  $('wrSub').innerHTML = v.sub;
}

function toggleWr() {
  showElo = !showElo;
  try { localStorage.setItem('wrMode', showElo ? 'elo' : 'wr'); } catch (e) {}
  renderWrBox();
  var box = $('wrBox');
  box.classList.remove('swap'); void box.offsetWidth; box.classList.add('swap');
}
$('wrBox').addEventListener('click', toggleWr);
$('wrBox').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleWr(); }
});

function renderSummary() {
  var n = games.length;
  var w = games.filter(function(g) { return g.result === 'win'; }).length;
  var l = games.filter(function(g) { return g.result === 'lose'; }).length;
  var d = n - w - l;
  var wr = n ? Math.round(winrate(games)) : 0;

  wrView = {
    label: 'Общий винрейт',
    // без партий — нейтральный прочерк, а не красные «0%»
    cls: 'wr-value ' + (n ? wrColorClass(wr) : ''),
    value: n ? wr + '% ' + trendHtml(trend(winrate, TREND_N, games), true, false) : '—',
    sub: w + '<span class="green">W</span> / ' + l + '<span class="red">L</span>' +
      (d ? ' / ' + d + '<span style="color:var(--fg)">D</span>' : '') +
      ' — ' + n + ' ' + plural(n, 'партия', 'партии', 'партий')
  };
  eloView = buildEloView();
  renderWrBox();
  $('footer').textContent = 'KvLGn Chess Progress | Дата начала: ' + PROFILE.start + ' | ' + PROFILE.stage +
    (window.GAMES_UPDATED ? ' | Обновлено: ' + window.GAMES_UPDATED : '');
}

/* ---------- stats panel ---------- */
var STATS = [
  {key:'acc',   label:'Точность',   color:'var(--c-acc)',   dotOpacity:0.4},
  {key:'debut', label:'Дебют',      color:'var(--c-debut)'},
  {key:'mid',   label:'Миттельшп.', color:'var(--c-mid)'},
  {key:'end',   label:'Эндшпиль',   color:'var(--c-end)'}
];

function statLine(label, color, value, dotOpacity) {
  return '<div class="stat-line"><div class="stat-name">' +
    '<span class="stat-dot" style="background:' + color + (dotOpacity ? ';opacity:' + dotOpacity : '') + '"></span>' +
    '<span style="color:' + color + '">' + label + '</span></div>' +
    '<span class="stat-fill"></span><span class="stat-val">' + value + '</span></div>';
}

/* ---------- averages window: 5 / 10 / 20 games (panel + chart + legend winrate) ---------- */
var WINDOWS = [5, 10, 20];
var avgWindow = CHART_N;
try {
  var savedWin = +localStorage.getItem('avgWindow');
  if (WINDOWS.indexOf(savedWin) >= 0) avgWindow = savedWin;
} catch (e) {}

function windowGames() { return cgAll.slice(-avgWindow); }

function winLabel(w) { return 'за ' + w + ' ' + plural(w, 'игру', 'игры', 'игр'); }
var LOCK = '<svg class="lock" viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><path fill="currentColor" d="M4 7V5a4 4 0 0 1 8 0v2h1v8H3V7h1zm2 0h4V5a2 2 0 0 0-4 0v2z"/></svg>';
// фактическое окно: сколько партий реально вошло в средние (меньше выбранного — замок)
function winActualLabel() {
  var k = Math.min(avgWindow, cgAll.length);
  return k < avgWindow ? k + ' из ' + avgWindow + LOCK : winLabel(avgWindow);
}

function renderWinPick() {
  $('winPick').innerHTML =
    '<button class="win-toggle' + (cfActive() ? ' filtered' : '') + '" aria-haspopup="listbox" aria-expanded="false" title="' +
      (cgAll.length < avgWindow ? 'Выбрано ' + avgWindow + ', подходит только ' + cgAll.length : 'Средние и график за N последних партий') +
      (cfActive() ? ' · с фильтром графика' : '') + '">' +
      winActualLabel() + '<span class="caret">▾</span></button>' +
    '<div class="win-menu" role="listbox">' + WINDOWS.map(function(w) {
      var short = cgAll.length < w;
      return '<button class="win-opt' + (w === avgWindow ? ' on' : '') + '" role="option" aria-selected="' + (w === avgWindow) + '" data-w="' + w + '">' +
        winLabel(w) + (short ? ' <span class="win-short">' + LOCK + ' ' + cgAll.length + '</span>' : '') + '</button>';
    }).join('') + '</div>';
}

function setWinMenu(open) {
  $('winPick').classList.toggle('open', open);
  var t = $('winPick').querySelector('.win-toggle');
  if (t) t.setAttribute('aria-expanded', String(open));
}

$('winPick').addEventListener('click', function(e) {
  e.stopPropagation();
  var opt = e.target.closest('.win-opt');
  if (opt) {
    avgWindow = +opt.getAttribute('data-w');
    try { localStorage.setItem('avgWindow', String(avgWindow)); } catch (err) {}
    setWinMenu(false);
    renderWindow();
    return;
  }
  if (e.target.closest('.win-toggle')) setWinMenu(!$('winPick').classList.contains('open'));
});
document.addEventListener('click', function() { setWinMenu(false); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') setWinMenu(false); });

function renderWindow() {
  renderWinPick();
  renderStats();
  renderChart();
  var wr = winrate(windowGames());
  $('legendWr').innerHTML = (wr === null ? '—' : Math.round(wr)) + '<small>%</small>';
  applySeries();
}

function renderStats() {
  var list = windowGames();
  // прирост = вторая половина окна против первой: 10 → 5 vs 5, 20 → 10 vs 10; при окне 5 не показываем
  // если партий пока мало — сравниваем по максимуму доступного (приписка покажет, сколько игр)
  var half = Math.min(avgWindow / 2, Math.floor(cgAll.length / 2));
  var withTrend = avgWindow >= 10 && half >= 2;
  function tr(fn) { return withTrend ? trend(fn, half) : null; }
  // без прироста строка остаётся пустой, чтобы высота блока не прыгала при переключении
  function th(diff, isPct, lowerIsBetter) {
    // пусто и когда партий пока меньше, чем нужно для сравнения
    return (withTrend && trendHtml(diff, isPct, lowerIsBetter, half)) || '<span class="trend" style="visibility:hidden">▲</span>';
  }

  $('statsList').innerHTML = STATS.map(function(s) {
    var v = avg(list, s.key);
    var value = v === null ? '—' : v.toFixed(1) + '<small>%</small>';
    var diff = tr(function(l) { return avg(l, s.key); });
    return '<div class="stat toggle" data-s="' + s.key + '" role="button" tabindex="0" style="--sc:' + s.color + '">' + statLine(s.label, s.color, value, s.dotOpacity) +
           '<div class="stat-trend">' + th(diff, true, false) + '</div></div>';
  }).join('');

  var b = avg(list, 'blunders');
  $('statsBlunders').innerHTML = statLine('Зевки', 'var(--c-blunder)', b === null ? '—' : b.toFixed(1)) +
    '<div class="stat-trend">' +
    th(tr(function(l) { return avg(l, 'blunders'); }), false, true) + '</div>';
}

/* ---------- show / hide chart series (side panel + legend) ---------- */
var DEFAULT_HIDDEN = {end: true};   // эндшпиль по умолчанию скрыт, включается кликом
var hiddenSeries = DEFAULT_HIDDEN;
try {
  var saved = localStorage.getItem('hiddenSeries.v2');
  if (saved !== null) hiddenSeries = JSON.parse(saved) || {};
} catch (e) {}

// наведение на строку панели или легенду — эта серия ярче, остальные притухают
function focusSeries(key) {
  var svg = $('chart').querySelector('svg');
  if (!svg) return;
  svg.classList.toggle('focus', !!key);
  svg.querySelectorAll('.series').forEach(function(g) { g.classList.toggle('hl', g.getAttribute('data-s') === key); });
}
// закреплённое выделение (один клик) — держится, пока не кликнешь снова
var pinnedSeries = null;
document.addEventListener('mouseover', function(e) {
  var t = e.target.closest && e.target.closest('.toggle[data-s]');
  var k = t && !hiddenSeries[t.getAttribute('data-s')] ? t.getAttribute('data-s') : null;
  focusSeries(k || pinnedSeries);
});
function markPinned() {
  document.querySelectorAll('.toggle[data-s]').forEach(function(el) { el.classList.toggle('pinned', el.getAttribute('data-s') === pinnedSeries); });
}
function pinSeries(key) {
  if (hiddenSeries[key]) toggleSeries(key);
  pinnedSeries = pinnedSeries === key ? null : key;
  markPinned();
  focusSeries(pinnedSeries);
}

function applySeries() {
  document.querySelectorAll('[data-s]').forEach(function(el) {
    el.classList.toggle('off', !!hiddenSeries[el.getAttribute('data-s')]);
  });
  if (typeof pinnedSeries !== 'undefined' && pinnedSeries) { markPinned(); focusSeries(pinnedSeries); }
}

function toggleSeries(key) {
  if (hiddenSeries[key]) delete hiddenSeries[key]; else hiddenSeries[key] = true;
  try { localStorage.setItem('hiddenSeries.v2', JSON.stringify(hiddenSeries)); } catch (e) {}
  applySeries();
}

// делегирование: панель и легенда перерисовываются, обработчик один
// клик по панели слева — выделить линию (повторный клик снимает), клик по легенде снизу — скрыть / показать
document.addEventListener('click', function(e) {
  var t = e.target.closest && e.target.closest('.toggle[data-s]');
  if (!t) return;
  var k = t.getAttribute('data-s');
  if (t.closest('.legend')) {
    toggleSeries(k);
    if (hiddenSeries[k] && pinnedSeries === k) { pinnedSeries = null; markPinned(); }
    focusSeries(pinnedSeries);
  } else {
    pinSeries(k);
  }
});
document.addEventListener('keydown', function(e) {
  var t = e.target.closest && e.target.closest('.toggle[data-s]');
  if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); t.click(); }
});

/* ---------- chart ---------- */
var chartGames = [];

// партии за последние 14 игровых дней, включая сегодня (день начинается в 05:00, как в update.mjs)
var RECENT_DAYS = 14;
function renderRecentCount() {
  function iso(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  var today = new Date(Date.now() - 5 * 3600e3);
  var from = new Date(today.getFullYear(), today.getMonth(), today.getDate() - (RECENT_DAYS - 1));
  var k = games.filter(function(g) { return g.day && g.day >= iso(from); }).length;
  return k + ' ' + plural(k, 'партия', 'партии', 'партий') + ' за последние 2 недели';
}

// серия: дни подряд с партиями, заканчивая сегодня (или вчера — сегодня ещё можно сыграть)
function streaks() {
  var days = games.map(function(g) { return g.day; }).filter(Boolean)
    .filter(function(d, i, a) { return a.indexOf(d) === i; }).sort();
  var best = 0, run = 0, prev = null;
  days.forEach(function(d) {
    var p = d.split('-'), cur = new Date(+p[0], p[1] - 1, +p[2]);
    run = prev && Math.round((cur - prev) / 864e5) === 1 ? run + 1 : 1;
    best = Math.max(best, run);
    prev = cur;
  });
  var set = {};
  days.forEach(function(d) { set[d] = true; });
  var day = gameToday();
  var playedToday = !!set[isoDay(day)];
  if (!playedToday) day = addDays(day, -1);
  var current = 0;
  while (set[isoDay(day)]) { current++; day = addDays(day, -1); }
  return {current: current, best: best, playedToday: playedToday};
}

// главное крупно (число дней), пояснение — мелким серым справа
function streakTitle() {
  var st = streaks();
  function days(n) { return n + ' ' + plural(n, 'день', 'дня', 'дней'); }
  function note(t) { return ' <span class="title-note">' + t + '</span>'; }
  if (st.current > 0) {
    var tail = !st.playedToday ? 'сыграй сегодня, чтобы продлить'
             : st.current >= st.best ? 'новый рекорд!'
             : 'рекорд ' + days(st.best);
    return '🔥 ' + days(st.current) + ' подряд' + note(tail);
  }
  return st.best > 0 ? 'Серия прервана' + note('рекорд ' + days(st.best)) : 'Начни серию сегодня';
}

// заголовок блока: в показателях — партии за 2 недели, в активности — серия
function renderTitle() {
  if (chartMode === 'activity') $('chartTitle').innerHTML = streakTitle();
  else $('chartTitle').textContent = renderRecentCount();
}

function renderChart() {
  if (showRecords) { renderRecords(); return; }
  chartGames = windowGames();
  var list = chartGames, n = list.length;
  if (!n) {
    $('chart').innerHTML = '<div class="rec-view"><div class="rec-empty">' + (games.length ? 'Нет партий под фильтр графика' : 'Партий пока нет') + '</div></div>';
    return;
  }

  var X0 = 40, W = 550, TOP = 30, BOT = 180, H = BOT - TOP;
  var colW = W / n;
  var badgeW = Math.min(38, colW - 8);
  var maxB = Math.max.apply(null, list.map(function(g) { return g.blunders; }));
  var bMax = Math.max(15, Math.ceil(maxB / 5) * 5);

  function colX(i) { return r2(X0 + i * colW); }
  function cx(i) { return r2(X0 + i * colW + colW / 2); }
  function yPct(v) { return r2(BOT - v / 100 * H); }
  function yBl(v) { return r2(BOT - Math.min(v, bMax) / bMax * H); }

  var s = [];

  // column tint
  list.forEach(function(g, i) {
    s.push('<rect x="' + colX(i) + '" y="-5" width="' + r2(colW) + '" height="200" fill="' + RESULT[g.result].col + '"/>');
  });
  // перегородки между партиями (между днями — толще, ниже)
  for (var i = 1; i < n; i++) {
    s.push('<line x1="' + colX(i) + '" y1="-5" x2="' + colX(i) + '" y2="195" stroke="#0f1119" stroke-width="1.5" stroke-opacity="0.9"/>');
  }
  // day groups: thick separator at each date change + centered date label
  var groups = [];
  list.forEach(function(g, i) {
    var cur = groups[groups.length - 1];
    if (cur && cur.date === g.date) cur.to = i;
    else groups.push({date: g.date, from: i, to: i});
  });
  groups.forEach(function(gr, k) {
    if (k > 0) s.push('<line x1="' + colX(gr.from) + '" y1="-5" x2="' + colX(gr.from) + '" y2="195" stroke="#6b7280" stroke-width="2"/>');
    s.push('<text x="' + r2((cx(gr.from) + cx(gr.to)) / 2) + '" y="214" text-anchor="middle" font-size="9" fill="#9ca3af">' + esc(gr.date) + '</text>');
  });
  // W/L/D badges
  list.forEach(function(g, i) {
    var R = RESULT[g.result];
    s.push('<rect x="' + r2(cx(i) - badgeW / 2) + '" y="3" width="' + r2(badgeW) + '" height="20" rx="4" fill="' + R.badge + '"/>');
    s.push('<text x="' + cx(i) + '" y="17" text-anchor="middle" font-size="12" font-weight="700" fill="' + R.color + '">' + R.letter + '</text>');
  });
  // grid + % axis (left) + blunders axis (right)
  [100, 75, 50, 25, 0].forEach(function(p) {
    var y = yPct(p);
    s.push('<line x1="40" y1="' + y + '" x2="590" y2="' + y + '" stroke="#2a2d3a" stroke-width="0.5"/>');
    if (p > 0) s.push('<text x="34" y="' + (y + 3.5) + '" text-anchor="end" font-size="9" fill="#9ca3af">' + p + '%</text>');
  });
  // шкала зевков прячется вместе с линией зевков
  s.push('<g class="series' + (hiddenSeries.blunders ? ' off' : '') + '" data-s="blunders">');
  [1, 2 / 3, 1 / 3].forEach(function(f) {
    var v = Math.round(bMax * f);
    s.push('<text x="595" y="' + (yBl(v) + 3) + '" font-size="8" fill="#f87171" opacity="0.6">' + v + '</text>');
  });
  s.push('</g>');
  // knights (side played)
  list.forEach(function(g, i) {
    s.push('<text x="' + cx(i) + '" y="198" text-anchor="middle" font-size="16" fill="#d1d5db">' + KNIGHT[g.color] + '</text>');
  });

  // одна серия = <g data-s> с линией и точками; null (фаза не наступила) рвёт линию
  function series(key, y, line, dot, color) {
    var runs = [[]];
    list.forEach(function(g, i) {
      var v = y(g);
      if (v === null) { if (runs[runs.length - 1].length) runs.push([]); }
      else runs[runs.length - 1].push(cx(i) + ',' + v);
    });
    var out = '<g class="series' + (hiddenSeries[key] ? ' off' : '') + '" data-s="' + key + '">';
    runs.forEach(function(r) {
      if (r.length < 2) return;
      // заливка под линией — видна, когда показатель подсвечен наведением
      if (color) out += '<polygon class="area" points="' + r.join(' ') + ' ' + r[r.length - 1].split(',')[0] + ',' + BOT + ' ' + r[0].split(',')[0] + ',' + BOT + '" fill="url(#ga-' + key + ')"/>';
      out += '<polyline points="' + r.join(' ') + '" fill="none" stroke-linejoin="round" stroke-linecap="round" ' + line + '/>';
    });
    list.forEach(function(g, i) {
      var v = y(g);
      if (v !== null) out += '<circle cx="' + cx(i) + '" cy="' + v + '" ' + dot + '/>';
    });
    return out + '</g>';
  }
  function pct(key) { return function(g) { return typeof g[key] === 'number' ? yPct(g[key]) : null; }; }

  // порядок = слои: нижние первыми
  s.push(series('acc', pct('acc'), 'stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"', 'r="3" fill="#9ca3af" opacity="0.5"', '#9ca3af'));
  s.push(series('blunders', function(g) { return yBl(g.blunders); }, 'stroke="#f87171" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"', 'r="3" fill="#f87171" opacity="0.85"', '#f87171'));
  s.push(series('end', pct('end'), 'stroke="#a78bfa" stroke-width="2" opacity="0.8"', 'r="3.5" fill="#a78bfa" opacity="0.9"', '#a78bfa'));
  s.push(series('debut', pct('debut'), 'stroke="#60a5fa" stroke-width="2.5" opacity="0.8"', 'r="4" fill="#60a5fa" opacity="0.9"', '#60a5fa'));
  s.push(series('mid', pct('mid'), 'stroke="#f59e0b" stroke-width="2.5" opacity="0.8"', 'r="4" fill="#f59e0b" opacity="0.9"', '#f59e0b'));

  // линии средних: ровно по тем партиям, что на графике (= число в панели слева)
  [['acc', '#9ca3af', yPct, '%'], ['debut', '#60a5fa', yPct, '%'], ['mid', '#f59e0b', yPct, '%'],
   ['end', '#a78bfa', yPct, '%'], ['blunders', '#f87171', yBl, '']].forEach(function(a) {
    var v = avg(list, a[0]);
    if (v === null) return;
    var yy = a[2](v);
    s.push('<g class="series avg-line' + (hiddenSeries[a[0]] ? ' off' : '') + '" data-s="' + a[0] + '">' +
      '<line x1="40" y1="' + yy + '" x2="590" y2="' + yy + '" stroke="' + a[1] + '" stroke-width="1" stroke-dasharray="2,4"/>' +
      '<text x="588" y="' + r2(yy - 3) + '" text-anchor="end" font-size="8" font-weight="600" fill="' + a[1] + '">ср. ' + v.toFixed(1) + a[3] + '</text></g>');
  });

  // hover / tap areas: the whole column, on top of everything
  list.forEach(function(g, i) {
    s.push('<rect class="hit" data-i="' + i + '" x="' + colX(i) + '" y="-5" width="' + r2(colW) + '" height="200" fill="rgba(0,0,0,0)"/>');
  });

  var defs = '<defs>' +
    '<filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    [['acc', '#9ca3af'], ['blunders', '#f87171'], ['end', '#a78bfa'], ['debut', '#60a5fa'], ['mid', '#f59e0b']].map(function(a) {
      return '<linearGradient id="ga-' + a[0] + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + a[1] + '" stop-opacity="0.32"/><stop offset="1" stop-color="' + a[1] + '" stop-opacity="0"/></linearGradient>';
    }).join('') +
    [['win', '#2f7a4a', '#1d4a2f'], ['lose', '#7a2f36', '#4a1d22'], ['draw', '#4b5063', '#2c3040']].map(function(a) {
      return '<linearGradient id="gb-' + a[0] + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + a[1] + '"/><stop offset="1" stop-color="' + a[2] + '"/></linearGradient>';
    }).join('') + '</defs>';
  $('chart').innerHTML = '<svg viewBox="10 -10 600 245" role="img" aria-label="График последних партий">' + defs + s.join('') + '</svg>';
  bindTooltip();
}

/* ---------- tooltip ---------- */
function tooltipHtml(g) {
  var R = RESULT[g.result];
  $('tt-title').innerHTML = '#' + g.n + ' — ' + esc(g.date) + ' <span style="color:' + R.color + ';font-weight:700">' + R.label + '</span>';
  var rows = [
    {k: 'acc', html: '<span style="color:#9ca3af">Точность: <span style="color:#e4e4e7;font-weight:600">' + g.acc + '%</span></span>'},
    {k: 'debut', html: '<span style="color:#60a5fa">Дебют: ' + g.debut + '%</span>'},
    {k: 'mid', html: '<span style="color:#f59e0b">Миттельшпиль: ' + (typeof g.mid === 'number' ? g.mid + '%' : '—') + '</span>'},
    {k: 'end', html: '<span style="color:#a78bfa">Эндшпиль: <span style="color:#e4e4e7">' + (hasEnd(g) ? g.end + '%' : '—') + '</span></span>'},
    {k: 'blunders', html: '<span style="color:#ef4444">Зевки: ' + g.blunders + '</span>'}
  ];
  // выделенный слева показатель — первым строкой и крупнее
  if (pinnedSeries) rows.sort(function(a, b) { return (b.k === pinnedSeries) - (a.k === pinnedSeries); });
  $('tt-body').innerHTML =
    rows.map(function(r) {
      return '<div' + (r.k === pinnedSeries ? ' style="font-size:14px;font-weight:700;margin-bottom:3px"' : '') + '>' + r.html + '</div>';
    }).join('') +
    '<div style="color:var(--fg-dim);margin-top:4px;font-size:11px">' + esc(g.opening) + '</div>' +
    '<div style="color:#6b7080;margin-top:3px;font-size:10px">' + esc(g.engine) + ' · ' + COLOR_NAME[g.color] + '</div>';
}

function placeTooltip(x, y) {
  var tt = $('tooltip');
  var w = tt.offsetWidth, h = tt.offsetHeight;
  var left = x + 14, top = y - 10;
  if (left + w > window.innerWidth - 8) left = Math.max(8, x - 14 - w);
  if (top + h > window.innerHeight - 8) top = Math.max(8, window.innerHeight - 8 - h);
  tt.style.left = left + 'px';
  tt.style.top = top + 'px';
}

var activeHit = null;
function showTooltip(el, x, y) {
  if (activeHit) activeHit.classList.remove('active');
  activeHit = el;
  el.classList.add('active');
  if (el.hasAttribute('data-b')) activityTip(actBuckets[+el.getAttribute('data-b')]);
  else tooltipHtml(chartGames[+el.getAttribute('data-i')]);
  $('tooltip').style.display = 'block';
  placeTooltip(x, y);
}
function hideTooltip() {
  if (activeHit) activeHit.classList.remove('active');
  activeHit = null;
  $('tooltip').style.display = 'none';
}

function bindTooltip() {
  document.querySelectorAll('#chart .hit').forEach(function(el) {
    el.addEventListener('mouseenter', function(e) { showTooltip(el, e.clientX, e.clientY); });
    el.addEventListener('mousemove', function(e) { placeTooltip(e.clientX, e.clientY); });
    el.addEventListener('mouseleave', hideTooltip);
    // touch: tap toggles
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      if (activeHit === el && e.pointerType !== 'mouse') hideTooltip();
      else showTooltip(el, e.clientX, e.clientY);
    });
  });
}
document.addEventListener('click', hideTooltip);
window.addEventListener('scroll', hideTooltip, {passive: true});

/* ---------- table filters: результат, дебют (поиск), показатели от–до ---------- */
var filt = {results: {}, colors: {}, openings: {}, ranges: {}};
var F_RESULTS = [
  {key: 'win',  label: 'Победа',    c: 'var(--green)', bg: 'var(--green-bg)'},
  {key: 'lose', label: 'Поражение', c: 'var(--red)',   bg: 'var(--red-bg)'},
  {key: 'draw', label: 'Ничья',     c: '#d1d5db',      bg: 'var(--grey-bg)'}
];
var F_METRICS = [
  {key: 'acc',      label: 'Точность, %',     color: '#9ca3af'},
  {key: 'debut',    label: 'Дебют, %',        color: '#60a5fa'},
  {key: 'mid',      label: 'Миттельшпиль, %', color: '#f59e0b'},
  {key: 'end',      label: 'Эндшпиль, %',     color: '#a78bfa'},
  {key: 'blunders', label: 'Зевки',           color: '#f87171'},
  {key: 'mistakes', label: 'Ошибки',          color: '#fb923c'},
  {key: 'inacc',    label: 'Неточности',      color: '#eab308'},
  {key: 'moves',    label: 'Ходы',            color: '#e4e4e7'}
];

function hasKeys(o) { return Object.keys(o).length > 0; }

function filterGames(list) {
  return list.filter(function(g) {
    if (hasKeys(filt.results) && !filt.results[g.result]) return false;
    if (hasKeys(filt.colors) && !filt.colors[g.color]) return false;
    if (hasKeys(filt.openings) && !filt.openings[g.opening]) return false;
    for (var k in filt.ranges) {
      var r = filt.ranges[k], v = g[k];
      if (typeof v !== 'number') return false;   // например, эндшпиля не было
      if (r.min !== null && v < r.min) return false;
      if (r.max !== null && v > r.max) return false;
    }
    return true;
  });
}

function filtersChanged() {
  currentPage = 0;
  renderFilterBar();
  renderGames();
}

/* результат — кнопки-переключатели */
function renderResultChips() {
  $('fResult').innerHTML = F_RESULTS.map(function(r) {
    var on = !!filt.results[r.key];
    return '<button class="f-chip' + (on ? ' on' : '') + '" data-r="' + r.key + '" aria-pressed="' + on + '" style="--c:' + r.c + ';--bg-c:' + r.bg + '">' + r.label + '</button>';
  }).join('');
}
$('fResult').addEventListener('click', function(e) {
  var b = e.target.closest('.f-chip');
  if (!b) return;
  var k = b.getAttribute('data-r');
  if (filt.results[k]) delete filt.results[k]; else filt.results[k] = true;
  filtersChanged();
});

/* цвет — белые / чёрные (кони как в таблице) */
function renderColorChips() {
  $('fColor').innerHTML = ['white', 'black'].map(function(c) {
    var on = !!filt.colors[c];
    return '<button class="f-chip f-chip-color' + (on ? ' on' : '') + '" data-c="' + c + '" aria-pressed="' + on + '">' +
      '<span class="f-knight">' + KNIGHT[c] + '</span>' + COLOR_NAME[c] + '</button>';
  }).join('');
}
$('fColor').addEventListener('click', function(e) {
  var b = e.target.closest('.f-chip');
  if (!b) return;
  var c = b.getAttribute('data-c');
  if (filt.colors[c]) delete filt.colors[c]; else filt.colors[c] = true;
  filtersChanged();
});

/* дебют — список сыгранных дебютов с поиском, можно выбрать несколько */
function openingStats() {
  var map = {}, out = [];
  games.forEach(function(g) {
    if (!map[g.opening]) { map[g.opening] = {name: g.opening, n: 0}; out.push(map[g.opening]); }
    map[g.opening].n++;
  });
  return out.sort(function(a, b) { return (b.n - a.n) || a.name.localeCompare(b.name); });
}

function renderOpeningList() {
  var q = $('fOpening').querySelector('.f-search').value.trim().toLowerCase();
  var items = openingStats().filter(function(o) { return !q || o.name.toLowerCase().indexOf(q) >= 0; });
  $('fOpening').querySelector('.f-list').innerHTML = items.length ? items.map(function(o) {
    var on = !!filt.openings[o.name];
    return '<button class="f-opt' + (on ? ' on' : '') + '" role="option" aria-selected="' + on + '" data-o="' + esc(o.name) + '">' +
      '<span class="f-box">' + (on ? '✓' : '') + '</span><span class="f-opt-name" title="' + esc(o.name) + '">' + esc(o.name) + '</span>' +
      '<span class="f-opt-n">' + o.n + '</span></button>';
  }).join('') : '<div class="f-empty">Ничего не найдено</div>';
}

$('fOpening').querySelector('.f-search').addEventListener('input', renderOpeningList);
$('fOpening').addEventListener('click', function(e) {
  e.stopPropagation();
  if (e.target.closest('.f-btn')) { toggleDrop('fOpening'); return; }
  var opt = e.target.closest('.f-opt');
  if (opt) {
    var name = opt.getAttribute('data-o');
    if (filt.openings[name]) delete filt.openings[name]; else filt.openings[name] = true;
    filtersChanged();
    return;
  }
  if (e.target.closest('[data-act="clear"]')) { filt.openings = {}; filtersChanged(); }
});

/* показатели — от / до */
function renderMetricInputs() {
  $('fMetrics').querySelector('.f-metrics').innerHTML = F_METRICS.map(function(m) {
    var r = filt.ranges[m.key] || {min: null, max: null};
    function val(v) { return v === null ? '' : v; }
    return '<label for="fm-' + m.key + '-min" style="color:' + m.color + '">' + m.label + '</label>' +
      '<input class="f-num" id="fm-' + m.key + '-min" type="number" min="0" placeholder="от" data-k="' + m.key + '" data-b="min" value="' + val(r.min) + '">' +
      '<span class="dash">–</span>' +
      '<input class="f-num" type="number" min="0" placeholder="до" data-k="' + m.key + '" data-b="max" value="' + val(r.max) + '" aria-label="' + m.label + ' до">';
  }).join('');
}

$('fMetrics').addEventListener('input', function(e) {
  var inp = e.target.closest('.f-num');
  if (!inp) return;
  var k = inp.getAttribute('data-k'), b = inp.getAttribute('data-b');
  var v = inp.value === '' ? null : Number(inp.value);
  var r = filt.ranges[k] || {min: null, max: null};
  r[b] = isNaN(v) ? null : v;
  if (r.min === null && r.max === null) delete filt.ranges[k]; else filt.ranges[k] = r;
  // поля не перерисовываем, чтобы не сбивать курсор при вводе
  currentPage = 0;
  renderFilterButtons();
  renderGames();
});
$('fMetrics').addEventListener('click', function(e) {
  e.stopPropagation();
  if (e.target.closest('.f-btn')) { toggleDrop('fMetrics'); return; }
  if (e.target.closest('[data-act="clear"]')) { filt.ranges = {}; renderMetricInputs(); filtersChanged(); }
});

/* выпадающие панели: одна открыта за раз, закрываются кликом мимо и Esc */
function toggleDrop(id) {
  var el = $(id), open = !el.classList.contains('open');
  closeDrops();
  el.classList.toggle('open', open);
  el.querySelector('.f-btn').setAttribute('aria-expanded', String(open));
  if (open && id === 'fOpening') { renderOpeningList(); el.querySelector('.f-search').focus(); }
}
function closeDrops() {
  ['fOpening', 'fMetrics'].forEach(function(id) {
    $(id).classList.remove('open');
    $(id).querySelector('.f-btn').setAttribute('aria-expanded', 'false');
  });
}
document.addEventListener('click', closeDrops);
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeDrops(); });

$('fReset').addEventListener('click', function() {
  filt = {results: {}, colors: {}, openings: {}, ranges: {}};
  renderMetricInputs();
  filtersChanged();
});

function renderFilterButtons() {
  var names = Object.keys(filt.openings);
  var ob = $('fOpening').querySelector('.f-btn');
  ob.innerHTML = esc(names.length === 0 ? 'Дебют: все' : names.length === 1 ? names[0] : 'Дебюты: ' + names.length) + '<span class="caret">▾</span>';
  ob.title = names.join('\n');
  ob.classList.toggle('active', names.length > 0);

  var mk = Object.keys(filt.ranges).length;
  var mb = $('fMetrics').querySelector('.f-btn');
  mb.innerHTML = 'Показатели' + (mk ? ' · ' + mk : '') + '<span class="caret">▾</span>';
  mb.classList.toggle('active', mk > 0);

  var any = hasKeys(filt.results) || hasKeys(filt.colors) || names.length > 0 || mk > 0;
  $('filters').classList.toggle('any', any);
  var shown = filterGames(games).length;
  $('fCount').textContent = any ? 'Найдено ' + shown + ' из ' + games.length : '';
}

function renderFilterBar() {
  renderResultChips();
  renderColorChips();
  if ($('fOpening').classList.contains('open')) renderOpeningList();
  renderFilterButtons();
}

/* ---------- chart filter: общий для показателей и активности (отдельно от таблицы) ---------- */
var cfilt = {results: {}, colors: {}, openings: {}, ranges: {}};

function filterChart(list) {
  return list.filter(function(g) {
    if (hasKeys(cfilt.results) && !cfilt.results[g.result]) return false;
    if (hasKeys(cfilt.colors) && !cfilt.colors[g.color]) return false;
    if (hasKeys(cfilt.openings) && !cfilt.openings[g.opening]) return false;
    for (var k in cfilt.ranges) {
      var r = cfilt.ranges[k], v = g[k];
      if (typeof v !== 'number') return false;
      if (r.min !== null && v < r.min) return false;
      if (r.max !== null && v > r.max) return false;
    }
    return true;
  });
}

function cfActive() { return hasKeys(cfilt.results) || hasKeys(cfilt.colors) || hasKeys(cfilt.openings) || hasKeys(cfilt.ranges); }

function chartFilterChanged() {
  cgAll = filterChart(games);
  renderChartFilter();
  renderWindow();
  if (chartMode === 'activity') renderActivity();
}

function toggleKey(obj, k) { if (obj[k]) delete obj[k]; else obj[k] = true; }

function renderCfMenu() {
  var el = $('cf');
  el.querySelector('.cf-results').innerHTML = F_RESULTS.map(function(r) {
    var on = !!cfilt.results[r.key];
    return '<button class="f-chip' + (on ? ' on' : '') + '" data-r="' + r.key + '" style="--c:' + r.c + ';--bg-c:' + r.bg + '">' + r.label + '</button>';
  }).join('');
  el.querySelector('.cf-colors').innerHTML = ['white', 'black'].map(function(c) {
    var on = !!cfilt.colors[c];
    return '<button class="f-chip' + (on ? ' on' : '') + '" data-c="' + c + '"><span class="f-knight">' + KNIGHT[c] + '</span>' + COLOR_NAME[c] + '</button>';
  }).join('');
  var q = el.querySelector('.f-search').value.trim().toLowerCase();
  var items = openingStats().filter(function(o) { return !q || o.name.toLowerCase().indexOf(q) >= 0; });
  el.querySelector('.f-list').innerHTML = items.length ? items.map(function(o) {
    var on = !!cfilt.openings[o.name];
    return '<button class="f-opt' + (on ? ' on' : '') + '" data-o="' + esc(o.name) + '">' +
      '<span class="f-box">' + (on ? '✓' : '') + '</span><span class="f-opt-name" title="' + esc(o.name) + '">' + esc(o.name) + '</span>' +
      '<span class="f-opt-n">' + o.n + '</span></button>';
  }).join('') : '<div class="f-empty">Ничего не найдено</div>';
}

function renderCfInputs() {
  var box = $('cf').querySelector('.cf-metrics');
  box.innerHTML = F_METRICS.map(function(m) {
    var r = cfilt.ranges[m.key] || {min: null, max: null};
    function val(v) { return v === null ? '' : v; }
    return '<label style="color:' + m.color + '">' + m.label + '</label>' +
      '<input class="f-num" type="number" min="0" placeholder="от" data-k="' + m.key + '" data-b="min" value="' + val(r.min) + '" aria-label="' + m.label + ' от">' +
      '<span class="dash">–</span>' +
      '<input class="f-num" type="number" min="0" placeholder="до" data-k="' + m.key + '" data-b="max" value="' + val(r.max) + '" aria-label="' + m.label + ' до">';
  }).join('');
}
function setCfMore(open) {
  $('cf').classList.toggle('more', open);
  $('cf').querySelector('.cf-more').setAttribute('aria-expanded', String(open));
}
$('cf').querySelector('.cf-more').addEventListener('click', function(e) {
  e.stopPropagation();
  setCfMore(!$('cf').classList.contains('more'));
});
$('cf').querySelector('.cf-metrics').addEventListener('input', function(e) {
  var inp = e.target.closest('.f-num');
  if (!inp) return;
  var k = inp.getAttribute('data-k'), b = inp.getAttribute('data-b');
  var v = inp.value === '' ? null : Number(inp.value);
  var r = cfilt.ranges[k] || {min: null, max: null};
  r[b] = isNaN(v) ? null : v;
  if (r.min === null && r.max === null) delete cfilt.ranges[k]; else cfilt.ranges[k] = r;
  cgAll = filterChart(games);
  renderChartFilter(true);
  renderWindow();
  if (chartMode === 'activity') renderActivity();
});

function rangeLabel(k) {
  var m = F_METRICS.filter(function(x) { return x.key === k; })[0];
  var name = m.label.replace(', %', ''), pct = m.label.indexOf('%') >= 0 ? '%' : '';
  var r = cfilt.ranges[k];
  if (r.min !== null && r.max !== null) return name + ' ' + r.min + '–' + r.max + pct;
  return r.min !== null ? name + ' ≥ ' + r.min + pct : name + ' ≤ ' + r.max + pct;
}

// активные фильтры — метками с крестиком в строке заголовка
function renderChartFilter(keepMenu) {
  var pills = [];
  F_RESULTS.forEach(function(r) { if (cfilt.results[r.key]) pills.push({t: 'r', k: r.key, label: r.label}); });
  ['white', 'black'].forEach(function(c) { if (cfilt.colors[c]) pills.push({t: 'c', k: c, label: KNIGHT[c] + ' ' + COLOR_NAME[c]}); });
  Object.keys(cfilt.openings).forEach(function(o) { pills.push({t: 'o', k: o, label: o}); });
  Object.keys(cfilt.ranges).forEach(function(k) { pills.push({t: 'm', k: k, label: rangeLabel(k)}); });
  $('cfPills').innerHTML = pills.map(function(p) {
    return '<span class="cf-pill" title="' + esc(p.label) + '"><span class="cf-pill-t">' + esc(p.label) + '</span>' +
      '<button data-t="' + p.t + '" data-k="' + esc(p.k) + '" aria-label="Убрать фильтр">×</button></span>';
  }).join('');
  var btn = $('cf').querySelector('.f-btn');
  btn.classList.toggle('active', cfActive());
  btn.innerHTML = '⏷ Фильтр графика' + (cfActive() ? ' · ' + pills.length : '');
  if (!keepMenu && $('cf').classList.contains('open')) renderCfMenu();
}

$('cfPills').addEventListener('click', function(e) {
  var b = e.target.closest('button[data-t]');
  if (!b) return;
  e.stopPropagation();
  var map = {r: cfilt.results, c: cfilt.colors, o: cfilt.openings, m: cfilt.ranges}[b.getAttribute('data-t')];
  delete map[b.getAttribute('data-k')];
  renderCfInputs();
  chartFilterChanged();
});

$('cf').querySelector('.f-search').addEventListener('input', renderCfMenu);
$('cf').addEventListener('click', function(e) {
  e.stopPropagation();
  var t;
  if (e.target.closest('.f-btn')) {
    var open = !$('cf').classList.contains('open');
    closeDrops();
    $('cf').classList.toggle('open', open);
    $('cf').querySelector('.f-btn').setAttribute('aria-expanded', String(open));
    if (open) { renderCfMenu(); renderCfInputs(); setCfMore(hasKeys(cfilt.ranges)); $('cf').querySelector('.f-search').focus(); }
    return;
  }
  if ((t = e.target.closest('.f-chip[data-r]'))) { toggleKey(cfilt.results, t.getAttribute('data-r')); chartFilterChanged(); return; }
  if ((t = e.target.closest('.f-chip[data-c]'))) { toggleKey(cfilt.colors, t.getAttribute('data-c')); chartFilterChanged(); return; }
  if ((t = e.target.closest('.f-opt'))) { toggleKey(cfilt.openings, t.getAttribute('data-o')); chartFilterChanged(); return; }
  if (e.target.closest('[data-act="clear"]')) { cfilt = {results: {}, colors: {}, openings: {}, ranges: {}}; renderCfInputs(); chartFilterChanged(); }
});
document.addEventListener('click', function() { $('cf').classList.remove('open'); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') $('cf').classList.remove('open'); });

/* ---------- table (newest first) ---------- */
var currentPage = 0;

function detailItem(label, value, color) {
  return '<div class="detail-item"><div class="detail-label">' + label + '</div>' +
         '<div class="detail-value"' + (color ? ' style="color:' + color + '"' : '') + '>' + value + '</div></div>';
}

function irCell(ir) {
  if (typeof ir !== 'number') return '<td style="color:var(--fg-dim)">—</td>';
  var color = ir > 0 ? 'var(--green)' : ir < 0 ? 'var(--red)' : 'var(--fg-dim)';
  var text = ir > 0 ? '+' + ir : ir < 0 ? '−' + Math.abs(ir) : '0';
  return '<td style="color:' + color + ';font-weight:600">' + text + '</td>';
}

function renderGames() {
  var ordered = filterGames(games).slice(-TABLE_N).reverse();
  var total = ordered.length;
  var pages = Math.max(1, Math.ceil(total / PER_PAGE));
  currentPage = Math.max(0, Math.min(pages - 1, currentPage));
  var start = currentPage * PER_PAGE;
  var end = Math.min(start + PER_PAGE, total);

  var tbody = $('gameRows');
  tbody.innerHTML = '';
  if (!total) tbody.innerHTML = '<tr class="no-rows"><td colspan="7">' +
    (games.length ? 'Нет партий под выбранные фильтры' : 'Партий пока нет') + '</td></tr>';

  ordered.slice(start, end).forEach(function(g) {
    var R = RESULT[g.result];
    var row = document.createElement('tr');
    row.className = 'game-row r-' + g.result;
    row.tabIndex = 0;
    row.innerHTML =
      '<td>' + g.n + '</td>' +
      '<td class="td-knight" title="' + COLOR_NAME[g.color] + '">' + KNIGHT[g.color] + '</td>' +
      '<td>' + esc(g.date) + '</td>' +
      '<td>' + esc(g.opening) + '</td>' +
      '<td class="td-dim">' + esc(g.engine) + '</td>' +
      '<td><span class="badge" style="color:' + R.color + ';background:' + R.bg + '">' + R.short + '</span></td>' +
      irCell(g.ir);

    var detail = document.createElement('tr');
    detail.className = 'game-detail';
    detail.innerHTML = '<td colspan="7"><div class="detail-inner">' +
      detailItem('Ходы', g.moves) +
      detailItem('Точность', g.acc + '%') +
      detailItem('Дебют', g.debut + '%', '#60a5fa') +
      detailItem('Миттельшпиль', g.mid + '%', '#f59e0b') +
      detailItem('Эндшпиль', hasEnd(g) ? g.end + '%' : '—') +
      detailItem('Неточности', g.inacc, 'var(--yellow)') +
      detailItem('Ошибки', g.mistakes, '#fb923c') +
      detailItem('Зевки', g.blunders, 'var(--red)') +
      (g.id ? '<a class="detail-link" href="https://lichess.org/' + g.id + '" target="_blank" rel="noopener">Партия на Lichess ↗</a>' : '') +
      '</div></td>';

    function toggle() { row.classList.toggle('open'); }
    row.addEventListener('click', toggle);
    row.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });

    tbody.appendChild(row);
    tbody.appendChild(detail);
  });

  $('pageInfo').textContent = total ? (start + 1) + '–' + end + ' из ' + total : '0 из 0';
  $('prevPage').disabled = currentPage === 0;
  $('nextPage').disabled = currentPage >= pages - 1;
}

$('prevPage').addEventListener('click', function() { currentPage--; renderGames(); });
$('nextPage').addEventListener('click', function() { currentPage++; renderGames(); });

/* ---------- activity mode: партии по дням за период ---------- */
var PERIODS = [
  {key: 'week',    label: 'Неделя'},
  {key: '2weeks',  label: '2 недели'},
  {key: 'month',   label: 'Месяц'},
  {key: '3months', label: '3 месяца'}   // по неделям: по дням ~90 столбиков нечитаемы
];
var DOW = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

var chartMode = 'metrics';
var period = 'week';
try {
  if (localStorage.getItem('chartMode') === 'activity') chartMode = 'activity';
  var savedPeriod = localStorage.getItem('activityPeriod');
  if (PERIODS.some(function(p) { return p.key === savedPeriod; })) period = savedPeriod;
} catch (e) {}

function isoDay(d) {
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function ddmm(d) { return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2); }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function mondayOf(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
// игровой день: до 05:00 — ещё вчера (как в update.mjs)
function gameToday() { var t = new Date(Date.now() - 5 * 3600e3); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }

function activityBuckets() {
  var today = gameToday(), list = [], i, d;
  function day(d, top, bottom) {
    list.push({from: d, to: d, top: top, bottom: bottom, title: DOW[d.getDay()] + ' ' + ddmm(d)});
  }
  if (period === 'week' || period === '2weeks') {
    var start = addDays(mondayOf(today), period === 'week' ? 0 : -7);
    var len = period === 'week' ? 7 : 14;
    for (i = 0; i < len; i++) { d = addDays(start, i); day(d, DOW[d.getDay()], ddmm(d)); }
  } else if (period === 'month') {
    var first = new Date(today.getFullYear(), today.getMonth(), 1);
    var days = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
    for (i = 0; i < days; i++) { d = addDays(first, i); day(d, '', String(d.getDate())); }
  } else {
    var last = mondayOf(today);
    for (var m = mondayOf(new Date(today.getFullYear(), today.getMonth() - 2, 1)); m <= last; m = addDays(m, 7)) {
      list.push({from: m, to: addDays(m, 6), top: '', bottom: ddmm(m), title: 'Неделя ' + ddmm(m) + ' – ' + ddmm(addDays(m, 6))});
    }
  }
  var td = isoDay(today);
  list.forEach(function(b) {
    var f = isoDay(b.from), t = isoDay(b.to);
    b.games = cgAll.filter(function(g) { return g.day >= f && g.day <= t; });
    b.today = td >= f && td <= t;
    b.future = f > td;
  });
  return list;
}

var actBuckets = [];

function renderActivity() {
  if (showRecords) { actBuckets = []; renderRecords(); renderActivityStats(); return; }
  var list = actBuckets = activityBuckets(), n = list.length;
  var X0 = 40, W = 550, TOP = 20, BOT = 180, H = BOT - TOP;
  var colW = W / n;
  var dense = n > 20;
  var maxC = Math.max.apply(null, list.map(function(b) { return b.games.length; }));
  var need = Math.max(maxC, 4);
  var step = [1, 2, 5, 10, 20, 50].filter(function(st) { return Math.ceil(need / st) <= 5; })[0];
  var yMax = Math.ceil(need / step) * step;
  function colX(i) { return r2(X0 + i * colW); }
  function cx(i) { return r2(X0 + i * colW + colW / 2); }
  function y(v) { return r2(BOT - v / yMax * H); }

  var s = [];
  // фон колонок: сегодня — жёлтым
  list.forEach(function(b, i) {
    // фон каждого дня: чуть светлее фона блока, будущие — бледнее
    s.push('<rect x="' + colX(i) + '" y="-5" width="' + r2(colW) + '" height="200" fill="' + (b.future ? 'rgba(148,163,210,0.05)' : 'rgba(148,163,210,0.11)') + '"/>');
    if (b.today) {
      s.push('<rect x="' + colX(i) + '" y="-5" width="' + r2(colW) + '" height="200" fill="url(#gToday)"/>');
      s.push('<rect x="' + colX(i) + '" y="-5" width="' + r2(colW) + '" height="2" fill="#eab308" opacity="0.7"/>');
    }
  });
  // разделители колонок; границы недель — толще
  for (var i = 1; i < n; i++) {
    var weekEdge = (period === '2weeks' && i === 7) || (period === 'month' && list[i].from.getDay() === 1);
    s.push('<line x1="' + colX(i) + '" y1="-5" x2="' + colX(i) + '" y2="195" stroke="' + (weekEdge ? '#6b7280' : '#0f1119') + '" stroke-width="' + (weekEdge ? (period === '2weeks' ? 2 : 1) : (dense ? 0.8 : 1.5)) + '" stroke-opacity="' + (weekEdge ? 1 : 0.9) + '"/>');
  }
  // сетка + шкала количества партий
  for (var v = 0; v <= yMax; v += step) {
    s.push('<line x1="40" y1="' + y(v) + '" x2="590" y2="' + y(v) + '" stroke="#2a2d3a" stroke-width="0.5"/>');
    if (v > 0) s.push('<text x="34" y="' + (y(v) + 3.5) + '" text-anchor="end" font-size="9" fill="#9ca3af">' + v + '</text>');
  }
  // столбики: победы снизу, затем ничьи, поражения сверху
  var bw = Math.min(colW * 0.62, 34);
  list.forEach(function(b, i) {
    var cnt = {win: 0, draw: 0, lose: 0};
    b.games.forEach(function(g) { cnt[g.result]++; });
    var base = BOT;
    var gap = dense ? 0.6 : 1.5;
    [['win', '#22c55e'], ['draw', '#9ca3af'], ['lose', '#ef4444']].forEach(function(p) {
      if (!cnt[p[0]]) return;
      var h = cnt[p[0]] / yMax * H;
      s.push('<rect x="' + r2(cx(i) - bw / 2) + '" y="' + r2(base - h + gap / 2) + '" width="' + r2(bw) + '" height="' + r2(Math.max(h - gap, 1)) + '" rx="' + (dense ? 1.5 : 4) + '" fill="url(#gBar-' + p[0] + ')" stroke="' + p[1] + '" stroke-opacity="0.55" stroke-width="0.8"/>');
      base -= h;
    });
    if (b.games.length) {
      s.push('<text x="' + cx(i) + '" y="' + r2(base - 5) + '" text-anchor="middle" font-size="' + (dense ? 8 : 12) + '" font-weight="700" fill="#f3f4f6">' + b.games.length + '</text>');
    } else if (!b.future) {
      s.push('<circle cx="' + cx(i) + '" cy="' + BOT + '" r="' + (dense ? 1.2 : 2) + '" fill="#4b5063"/>');
    }
    // подписи: день недели + дата (или только число для месяца/недели для 3 месяцев)
    var lblColor = b.today ? '#eab308' : '#9ca3af';
    var op = b.future ? ' opacity="0.4"' : '';
    if (b.top) {
      s.push('<text x="' + cx(i) + '" y="196" text-anchor="middle" font-size="10" font-weight="600" fill="' + lblColor + '"' + op + '>' + b.top + '</text>');
      s.push('<text x="' + cx(i) + '" y="210" text-anchor="middle" font-size="9" fill="' + lblColor + '"' + op + '>' + b.bottom + '</text>');
    } else {
      s.push('<text x="' + cx(i) + '" y="198" text-anchor="middle" font-size="' + (dense ? 8 : 9) + '" fill="' + lblColor + '"' + op + '>' + b.bottom + '</text>');
    }
  });
  // области наведения
  list.forEach(function(b, i) {
    s.push('<rect class="hit" data-b="' + i + '" x="' + colX(i) + '" y="-5" width="' + r2(colW) + '" height="200" fill="rgba(0,0,0,0)"/>');
  });

  var defs = '<defs>' +
    '<linearGradient id="gToday" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eab308" stop-opacity="0.12"/><stop offset="1" stop-color="#eab308" stop-opacity="0.02"/></linearGradient>' +
    [['win', '#34d46e', '#15803d'], ['lose', '#f05252', '#b91c1c'], ['draw', '#a1a8b5', '#5b6170']].map(function(a) {
      return '<linearGradient id="gBar-' + a[0] + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + a[1] + '" stop-opacity="0.95"/><stop offset="1" stop-color="' + a[2] + '" stop-opacity="0.8"/></linearGradient>';
    }).join('') + '</defs>';
  $('chart').innerHTML = '<svg viewBox="10 -10 600 245" role="img" aria-label="Активность за период">' + defs + s.join('') + '</svg>';
  var pr = periodRange(0);
  $('actRange').textContent = pr.from.slice(8) + '.' + pr.from.slice(5, 7) + ' – ' + pr.to.slice(8) + '.' + pr.to.slice(5, 7);
  bindTooltip();
  renderActivityStats();
}

/* ---------- activity panel: сводка за период против такого же предыдущего ---------- */
function fromIso(x) { var p = x.split('-'); return new Date(+p[0], p[1] - 1, +p[2]); }
function daysBetween(a, b) { return Math.round((b - a) / 864e5); }

function periodRange(shift) {   // shift = 0 — текущий период, 1 — предыдущий
  var today = gameToday(), from, to;
  if (period === 'week' || period === '2weeks') {
    var len = period === 'week' ? 7 : 14;
    to = addDays(mondayOf(today), 6 - shift * len);
    from = addDays(to, -(len - 1));
  } else if (period === 'month') {
    from = new Date(today.getFullYear(), today.getMonth() - shift, 1);
    to = new Date(from.getFullYear(), from.getMonth() + 1, 0);
  } else {
    // 3 месяца — те же целые недели, что столбиками на графике (с понедельника недели, где 1-е число)
    var start = mondayOf(new Date(today.getFullYear(), today.getMonth() - 2, 1));
    var end = addDays(mondayOf(today), 6);
    var span = daysBetween(start, end) + 1;
    from = addDays(start, -shift * span);
    to = addDays(end, -shift * span);
  }
  var f = isoDay(from), t = isoDay(to);
  return {from: f, to: t, days: daysBetween(from, to) + 1, games: cgAll.filter(function(g) { return g.day >= f && g.day <= t; })};
}

var PREV_LABEL = {week: 'к пр. неделе', '2weeks': 'к пр. 2 нед.', month: 'к пр. месяцу', '3months': 'к пр. 3 мес.'};

function actTrend(diff, isPct) {
  if (diff === null) return '<span class="trend" style="visibility:hidden">▲</span>';
  var d = r1(diff);
  var color = d > 0 ? 'var(--up)' : d < 0 ? 'var(--red)' : 'var(--fg-mute)';
  var arrow = d > 0 ? '▲ +' : d < 0 ? '▼ −' : '■ ';
  return '<span class="trend" style="color:' + color + '">' + arrow + Math.abs(d) + (isPct ? '%' : '') +
         ' <span class="trend-n">' + PREV_LABEL[period] + '</span></span>';
}

// ELO за период: изменение = сумма изменений рейтинга в рейтинговых партиях периода
// (контроль времени — как у последней рейтинговой партии, как в карточке профиля)
function periodElo(r) {
  var all = window.RATING_GAMES || [];
  if (!all.length) return null;
  var perf = all[all.length - 1].perf;
  var list = all.filter(function(x) { return x.perf === perf && x.day; });
  var inPeriod = list.filter(function(x) { return x.day >= r.from && x.day <= r.to; });
  var upTo = list.filter(function(x) { return x.day <= r.to; });
  return {
    perf: perf,
    n: inPeriod.length,
    diff: inPeriod.reduce(function(sum, x) { return sum + x.diff; }, 0),
    end: upTo.length ? upTo[upTo.length - 1].after : null
  };
}

function renderActivityStats() {
  var cur = periodRange(0), prev = periodRange(1);
  function activeDays(r) { return r.games.map(function(g) { return g.day; }).filter(function(d, i, a) { return a.indexOf(d) === i; }).length; }
  function diff(a, b) { return a === null || b === null ? null : a - b; }

  var n = cur.games.length, pn = prev.games.length;
  var wr = winrate(cur.games), pwr = winrate(prev.games);
  var ad = activeDays(cur), pad = activeDays(prev);
  var acc = avg(cur.games, 'acc'), pacc = avg(prev.games, 'acc');

  var rows = [
    // сколько играл → как играл → результат (ELO — итог, отдельным блоком ниже)
    {label: 'Партий',        color: 'var(--yellow)',  value: String(n),                                   tr: actTrend(n - pn, false)},
    {label: 'Активн. дней', color: 'var(--c-debut)', value: ad + '<small>/' + cur.days + '</small>',     tr: actTrend(ad - pad, false)},
    {label: 'Точность',      color: 'var(--c-acc)',   value: acc === null ? '—' : acc.toFixed(1) + '<small>%</small>', tr: actTrend(diff(acc, pacc), true)},
    {label: 'Винрейт',       color: '#4ade80',        value: wr === null ? '—' : Math.round(wr) + '<small>%</small>', tr: actTrend(diff(wr === null ? null : Math.round(wr), pwr === null ? null : Math.round(pwr)), true)}
  ];
  $('actList').innerHTML = rows.map(function(r) {
    return '<div class="stat" style="--sc:' + r.color + '">' + statLine(r.label, r.color, r.value) + '<div class="stat-trend">' + r.tr + '</div></div>';
  }).join('');

  var e = periodElo(cur), eloVal, eloSub;
  if (!e) {
    eloVal = '?';
    eloSub = 'рейтинговых партий нет';
  } else {
    var c = e.diff > 0 ? 'var(--up)' : e.diff < 0 ? 'var(--red)' : 'var(--fg-num)';
    eloVal = '<span style="color:' + c + '">' + (e.diff > 0 ? '▲ +' : e.diff < 0 ? '▼ −' : '') + Math.abs(e.diff) + '</span>';
    eloSub = e.n
      ? (e.end !== null ? e.end + ' · ' : '') + (PERF_RU[e.perf] || e.perf) + ' · ' + e.n + ' ' + plural(e.n, 'партия', 'партии', 'партий')
      : 'за период не играл';
  }
  $('actElo').innerHTML = statLine('ELO', '#818cf8', eloVal) +
    '<div class="stat-trend"><span class="trend" style="color:var(--fg-mute);font-weight:400">' + eloSub + '</span></div>';
}

function activityTip(b) {
  var w = 0, l = 0, d = 0;
  b.games.forEach(function(g) { if (g.result === 'win') w++; else if (g.result === 'lose') l++; else d++; });
  $('tt-title').innerHTML = esc(b.title) + (b.today ? ' <span style="color:#eab308">· сегодня</span>' : '');
  if (b.future) { $('tt-body').innerHTML = '<div style="color:var(--fg-dim)">ещё впереди</div>'; return; }
  var n = b.games.length;
  var acc = avg(b.games, 'acc');
  $('tt-body').innerHTML =
    '<div>Партий: <span style="font-weight:600">' + n + '</span></div>' +
    (n ? '<div><span style="color:#22c55e">' + w + 'W</span> / <span style="color:#ef4444">' + l + 'L</span>' + (d ? ' / ' + d + 'D' : '') + '</div>' : '') +
    (acc !== null ? '<div style="color:#9ca3af">Средняя точность: <span style="color:#e4e4e7">' + acc.toFixed(1) + '%</span></div>' : '');
}

/* ---------- period dropdown («НЕДЕЛЯ ▾») ---------- */
function renderPeriodPick() {
  var cur = PERIODS.filter(function(p) { return p.key === period; })[0];
  $('periodPick').innerHTML =
    '<button class="win-toggle period-toggle" aria-haspopup="listbox" aria-expanded="false">' + cur.label + '<span class="caret">▾</span></button>' +
    '<div class="win-menu" role="listbox">' + PERIODS.map(function(p) {
      return '<button class="win-opt' + (p.key === period ? ' on' : '') + '" role="option" data-p="' + p.key + '">' + p.label + '</button>';
    }).join('') + '</div>';
}

function setPeriodMenu(open) {
  $('periodPick').classList.toggle('open', open);
  var t = $('periodPick').querySelector('.win-toggle');
  if (t) t.setAttribute('aria-expanded', String(open));
}

$('periodPick').addEventListener('click', function(e) {
  e.stopPropagation();
  var opt = e.target.closest('.win-opt');
  if (opt) {
    period = opt.getAttribute('data-p');
    try { localStorage.setItem('activityPeriod', period); } catch (err) {}

    renderPeriodPick();
    renderActivity();
    return;
  }
  if (e.target.closest('.win-toggle')) setPeriodMenu(!$('periodPick').classList.contains('open'));
