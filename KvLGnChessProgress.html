/* ---------- records: лучшая / худшая партия (показатели), лучший / худший день + рекорды (активность) ---------- */
var showRecords = false;
var recScope = 'period';   // 'period' — период слева, 'all' — за всё время
var PERIOD_SCOPE = {week: 'за неделю', '2weeks': 'за 2 недели', month: 'за месяц', '3months': 'за 3 месяца'};

function setRecords(on) {
  showRecords = on;
  $('chartBox').classList.toggle('records-on', on);
  $('recordsBtn').textContent = on ? 'График' : 'Рекорды';
  hideTooltip();
  if (chartMode === 'activity') renderActivity(); else { renderChart(); applySeries(); }
}

$('recordsBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  setRecords(!showRecords);
});

$('recScope').addEventListener('click', function(e) {
  e.stopPropagation();
  var b = e.target.closest('button[data-scope]');
  if (!b) return;
  recScope = b.getAttribute('data-scope');
  renderRecords();
});

function renderRecords() {
  var periodLabel = chartMode === 'activity' ? PERIOD_SCOPE[period] : winActualLabel();
  $('recScope').innerHTML =
    '<button data-scope="period" class="' + (recScope === 'period' ? 'on' : '') + '">' + periodLabel + '</button>' +
    '<button data-scope="all" class="' + (recScope === 'all' ? 'on' : '') + '">за всё время</button>';
  $('chart').innerHTML = chartMode === 'activity' ? activityRecordsHtml() : metricsRecordsHtml();
}

function emptyCard(best, head, text) {
  return '<div class="rec-card ' + (best ? 'best' : 'worst') + '"><div class="rec-head">' + head + '</div>' +
         '<div class="rec-empty">' + text + '</div></div>';
}

/* --- показатели: лучшая и худшая партия по точности --- */
function metricsRecordsHtml() {
  var list = recScope === 'all' ? cgAll : windowGames();
  if (!list.length) {
    return '<div class="rec-view"><div class="rec-grid">' +
      emptyCard(true, '▲ Лучшая партия', 'сыграй партию, чтобы появилась') +
      emptyCard(false, '▼ Худшая партия', 'сыграй партию, чтобы появилась') +
      '</div></div>';
  }
  var byAcc = list.slice().sort(function(a, b) { return (b.acc - a.acc) || (b.n - a.n); });
  var best = byAcc[0], worst = byAcc[byAcc.length - 1];
  return '<div class="rec-view"><div class="rec-grid">' +
    gameCard(best, true) +
    (list.length > 1 ? gameCard(worst, false) : emptyCard(false, '▼ Худшая партия', 'нужно хотя бы 2 партии')) +
    '</div></div>';
}

function gameCard(g, best) {
  var R = RESULT[g.result];
  function ph(v) { return typeof v === 'number' ? v + '%' : '—'; }
  return '<div class="rec-card ' + (best ? 'best' : 'worst') + '">' +
    '<div class="rec-head">' + (best ? '▲ Лучшая партия' : '▼ Худшая партия') + '</div>' +
    '<div class="rec-meta">#' + g.n + ' · ' + esc(g.date) + ' · <span style="color:' + R.color + '">' + R.label + '</span> · ' + esc(g.engine) + '</div>' +
    '<div class="rec-title" title="' + esc(g.opening) + '">' + esc(g.opening) + '</div>' +
    '<div class="rec-big">' + g.acc + '<small>%</small><span>точность</span></div>' +
    '<div class="rec-row">' +
      '<span style="color:#60a5fa">Дебют ' + ph(g.debut) + '</span>' +
      '<span style="color:#f59e0b">Миттельшпиль ' + ph(g.mid) + '</span>' +
      '<span style="color:#a78bfa">Эндшпиль ' + ph(g.end) + '</span>' +
    '</div>' +
    '<div class="rec-row dim">Зевки ' + g.blunders + ' · Ошибки ' + g.mistakes + ' · Неточности ' + g.inacc +
      ' · ' + g.moves + ' ' + plural(g.moves, 'ход', 'хода', 'ходов') + '</div>' +
    (g.id ? '<a class="rec-link" href="https://lichess.org/' + g.id + '" target="_blank" rel="noopener">Открыть на Lichess ↗</a>' : '') +
  '</div>';
}

/* --- активность: лучший / худший день + плитки рекордов --- */
function groupDays(list) {
  var map = {}, out = [];
  list.forEach(function(g) {
    if (!g.day) return;
    if (!map[g.day]) { map[g.day] = {day: g.day, games: [], w: 0, l: 0, d: 0}; out.push(map[g.day]); }
    var x = map[g.day];
    x.games.push(g);
    if (g.result === 'win') x.w++; else if (g.result === 'lose') x.l++; else x.d++;
  });
  out.forEach(function(x) { x.acc = avg(x.games, 'acc'); x.bl = avg(x.games, 'blunders'); });
  return out;
}

function dayLabel(iso) { var d = fromIso(iso); return DOW[d.getDay()] + ' ' + ddmm(d); }

function dayCard(x, best) {
  return '<div class="rec-card ' + (best ? 'best' : 'worst') + '">' +
    '<div class="rec-head">' + (best ? '▲ Лучший день' : '▼ Худший день') + '</div>' +
    '<div class="rec-meta">' + dayLabel(x.day) + '</div>' +
    '<div class="rec-big"><span class="w">' + x.w + 'W</span> / <span class="l">' + x.l + 'L</span>' +
      (x.d ? ' / ' + x.d + 'D' : '') + '</div>' +
    '<div class="rec-row">' +
      '<span>Партий ' + x.games.length + '</span>' +
      '<span style="color:#9ca3af">Точность ' + (x.acc === null ? '—' : x.acc.toFixed(1) + '%') + '</span>' +
      '<span style="color:#f87171">Зевков в среднем ' + (x.bl === null ? '—' : x.bl.toFixed(1)) + '</span>' +
    '</div>' +
  '</div>';
}

function tile(label, val, sub) {
  return '<div class="rec-tile"><div class="rec-tile-label">' + label + '</div>' +
         '<div class="rec-tile-val">' + val + '</div><div class="rec-tile-sub">' + sub + '</div></div>';
}

function activityRecordsHtml() {
  var list = recScope === 'all' ? cgAll : periodRange(0).games;
  var days = groupDays(list);
  // партий нет — карточки остаются на местах с «—», экран всегда одинаковый
  if (!days.length) {
    return '<div class="rec-view">' +
      '<div class="rec-grid">' +
        emptyCard(true, '▲ Лучший день', 'сыграй партию, чтобы появился') +
        emptyCard(false, '▼ Худший день', 'сыграй партию, чтобы появился') +
      '</div>' +
      '<div class="rec-section">🏆 Рекорды</div>' +
      '<div class="rec-tiles">' +
        ['Больше всего партий за день', 'Самая длинная серия', 'Самая активная неделя', 'Лучшая неделя по винрейту']
          .map(function(label) { return tile(label, '—', 'пока нет партий'); }).join('') +
      '</div>' +
    '</div>';
  }

  // лучший: больше (W − L), затем выше точность; худший: больше (L − W), затем ниже точность
  var byBest = days.slice().sort(function(a, b) { return ((b.w - b.l) - (a.w - a.l)) || ((b.acc || 0) - (a.acc || 0)); });
  var byWorst = days.slice().sort(function(a, b) { return ((b.l - b.w) - (a.l - a.w)) || ((a.acc || 0) - (b.acc || 0)); });
  var best = byBest[0], worst = byWorst[0];

  // больше всего партий за день
  var busiest = days.slice().sort(function(a, b) { return b.games.length - a.games.length; })[0];

  // самая длинная серия дней подряд (внутри выбранного отрезка)
  var sorted = days.map(function(x) { return x.day; }).sort();
  var run = 1, bestRun = 1, runStart = sorted[0], bestFrom = sorted[0], bestTo = sorted[0];
  for (var i = 1; i < sorted.length; i++) {
    if (daysBetween(fromIso(sorted[i - 1]), fromIso(sorted[i])) === 1) run++;
    else { run = 1; runStart = sorted[i]; }
    if (run > bestRun) { bestRun = run; bestFrom = runStart; bestTo = sorted[i]; }
  }

  // недели (пн–вс)
  var weeks = {}, wl = [];
  list.forEach(function(g) {
    if (!g.day) return;
    var k = isoDay(mondayOf(fromIso(g.day)));
    if (!weeks[k]) { weeks[k] = {from: k, games: []}; wl.push(weeks[k]); }
    weeks[k].games.push(g);
  });
  function weekRange(k) { var m = fromIso(k); return ddmm(m) + ' – ' + ddmm(addDays(m, 6)); }
  var activeWeek = wl.slice().sort(function(a, b) { return b.games.length - a.games.length; })[0];
  var MIN_WEEK = 3;   // винрейт недели из 1–2 партий ничего не говорит
  var wrWeeks = wl.filter(function(w) { return w.games.length >= MIN_WEEK; })
    .sort(function(a, b) { return winrate(b.games) - winrate(a.games); });

  var sameDay = best.day === worst.day;
  return '<div class="rec-view">' +
    '<div class="rec-grid">' +
      dayCard(best, true) +
      (sameDay ? emptyCard(false, '▼ Худший день', 'нужно хотя бы 2 игровых дня') : dayCard(worst, false)) +
    '</div>' +
    // рекорды — нейтральный блок, не продолжение колонок «лучший / худший»
    '<div class="rec-section">🏆 Рекорды</div>' +
    '<div class="rec-tiles">' +
      tile('Больше всего партий за день', busiest.games.length, dayLabel(busiest.day)) +
      tile('Самая длинная серия', bestRun + ' ' + plural(bestRun, 'день', 'дня', 'дней'),
           bestFrom === bestTo ? dayLabel(bestFrom) : ddmm(fromIso(bestFrom)) + ' – ' + ddmm(fromIso(bestTo))) +
      tile('Самая активная неделя', activeWeek.games.length + ' ' + plural(activeWeek.games.length, 'партия', 'партии', 'партий'), weekRange(activeWeek.from)) +
      (wrWeeks.length
        ? tile('Лучшая неделя по винрейту', Math.round(winrate(wrWeeks[0].games)) + '%', weekRange(wrWeeks[0].from) + ' · ' + wrWeeks[0].games.length + ' ' + plural(wrWeeks[0].games.length, 'партия', 'партии', 'партий'))
        : tile('Лучшая неделя по винрейту', '—', 'нужно ' + MIN_WEEK + '+ партии за неделю')) +
    '</div>' +
  '</div>';
}

/* ---------- switch: показатели ⇄ активность ---------- */
function setMode(m) {
  chartMode = m;
  try { localStorage.setItem('chartMode', m); } catch (e) {}
  $('chartBox').classList.toggle('mode-activity', m === 'activity');
  $('activityBtn').textContent = m === 'activity' ? 'Показатели' : 'Активность';
  // режим «Рекорды» сохраняется при переключении показатели ⇄ активность
  renderTitle();
  hideTooltip();
  if (m === 'activity') { renderPeriodPick(); renderActivity(); }
  else { renderChart(); applySeries(); }
}
$('activityBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  setMode(chartMode === 'activity' ? 'metrics' : 'activity');
});

/* ---------- карточка задач (puzzles.js из update.bat) ---------- */
function renderPuzzleCard() {
  var P = window.PUZZLES;
  var head = '<div class="pz-head"><span>🧩 Задачи</span><span class="pz-go">›</span></div>';
  if (!P || P.rating === null) {
    $('pzCard').innerHTML = head + '<div class="pz-main"><span class="pz-rating">—</span></div><div class="pz-sub">запусти update.bat</div>';
    return;
  }
  // изменение рейтинга за сегодня — только если сегодня решал задачи, иначе без приписки
  var hist = P.history || [];
  var today = isoDay(gameToday());
  var trendTxt = '';
  if (P.attempts.some(function(a) { return a.day === today; })) {
    var before = hist.filter(function(h) { return h.day < today; }).pop();
    if (before) {
      var d = P.rating - before.rating;
      var color = d > 0 ? 'var(--up)' : d < 0 ? 'var(--red)' : 'var(--fg-mute)';
      trendTxt = '<span class="trend" style="color:' + color + '" title="Изменение рейтинга задач за сегодня (было ' + before.rating + ')">' +
        (d > 0 ? '▲ +' : d < 0 ? '▼ −' : '■ ') + Math.abs(d) + ' <span class="trend-n">сегодня</span></span>';
    }
  }
  // мини-график рейтинга по снимкам
  var pts = hist.slice(-30), spark = '';
  if (pts.length > 1) {
    var min = Math.min.apply(null, pts.map(function(h) { return h.rating; }));
    var max = Math.max.apply(null, pts.map(function(h) { return h.rating; }));
    var span = Math.max(max - min, 20);
    var xy = pts.map(function(h, i) {
      return r2(2 + i * 196 / (pts.length - 1)) + ',' + r2(22 - (h.rating - min) / span * 18);
    });
    var last = xy[xy.length - 1].split(',');
    spark = '<svg class="pz-spark" viewBox="0 0 200 26" preserveAspectRatio="none" aria-hidden="true">' +
      '<polyline points="' + xy.join(' ') + '" fill="none" stroke="#a78bfa" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.5" fill="#a78bfa"/></svg>';
  }
  var wins = P.attempts.filter(function(a) { return a.win; }).length;
  // микс против дебютных тренировок: перфоманс = средний рейтинг задач ± 400 × (решено − нет) / задач
  function perf(list) {
    if (!list.length) return null;
    var w = list.filter(function(a) { return a.win; }).length;
    return Math.round(list.reduce(function(sum, a) { return sum + a.r; }, 0) / list.length + 400 * (2 * w - list.length) / list.length);
  }
  // слева — микс всегда; справа карусель: 3 последние тренировки (дебюты / темы), сдвиг каждые 4 с, пауза при наведении
  var wkMon = mondayOf(gameToday());
  var weekLabel = 'Неделя', weekTitle = 'Задач за текущую неделю';
  function inWeek(m) {
    var f = isoDay(m), t = isoDay(addDays(m, 6));
    return P.attempts.filter(function(a) { return a.day >= f && a.day <= t; }).length;
  }
  var weekN = inWeek(wkMon);
  if (!weekN && P.attempts.length) {
    wkMon = mondayOf(fromIso(P.attempts[P.attempts.length - 1].day));   // последняя неделя с задачами
    weekN = inWeek(wkMon);
    weekLabel = ddmm(wkMon) + '–' + ddmm(addDays(wkMon, 6));
    weekTitle = 'На этой неделе задач нет — показана последняя неделя с задачами';
  }
  var recent = [], seenKey = {};
  for (var i = P.attempts.length - 1; i >= 0 && recent.length < 3; i--) {
    var key = pzKey(P.attempts[i]);
    if (key !== 'mix' && !seenKey[key]) { seenKey[key] = true; recent.push(P.attempts[i]); }
  }
  var slides = recent.map(function(last) {
    var key = pzKey(last);
    var list = P.attempts.filter(function(a) { return pzKey(a) === key; });
    var name = pzLabel(last, P.themeNames || {});
    return '<div class="pz-slide" title="' + esc(name) + ': ' + list.length + ' ' + plural(list.length, 'задача', 'задачи', 'задач') +
      ', последний раз ' + last.date + '"><span class="pz-sl-name">' + esc(name) + '</span>' +
      '<b class="pz-ok">' + list.filter(function(a) { return a.win; }).length + '✓</b>' +
      '<b class="pz-bad">' + list.filter(function(a) { return !a.win; }).length + '✗</b></div>';
  });
  var carousel = '<div class="pz-split">' +
    '<span class="pz-mix" title="' + weekTitle + '">' + weekLabel + ' <b>' + weekN + '</b></span>' +
    (slides.length
      ? '<div class="pz-car"><div class="pz-track">' + slides.join('') + (slides.length > 1 ? slides[0] : '') + '</div></div>' +
        (slides.length > 1 ? '<div class="pz-dots">' + slides.map(function(_, k) { return '<i' + (k === 0 ? ' class="on"' : '') + '></i>'; }).join('') + '</div>' : '')
      : '') +
    '</div>';
  $('pzCard').innerHTML = head +
    '<div class="pz-main"><span class="pz-rating">' + P.rating + '</span>' + trendTxt + '</div>' +
    spark + carousel +
    '<div class="pz-sub">' + P.attempts.length + ' ' + plural(P.attempts.length, 'задача', 'задачи', 'задач') +
      (P.attempts.length ? ' · ' + Math.round(wins / P.attempts.length * 100) + '% решено' : '') + '</div>';
  startCarousel(slides.length);
}

// общий ключ и подпись режима (карточка, карусель, панель подробностей)
function pzKey(a) { return a.mode === 'open' || a.mode === 'theme' ? a.mode + '|' + a.tr : 'mix'; }
function pzLabel(a, names) {
  if (a.mode === 'open') return a.tr.split(': ').pop();
  if (a.mode === 'theme') return names[a.tr] || PZ_NAMES[a.tr] || a.tr;
  return 'Микс';
}

var pzTimer = null, pzIdx = 0, pzPaused = false;
function startCarousel(n) {
  clearInterval(pzTimer);
  pzIdx = 0;
  if (n < 2) return;
  pzTimer = setInterval(function() {
    if (pzPaused) return;
    var track = $('pzCard').querySelector('.pz-track');
    if (!track) return;
    pzIdx++;
    track.style.transition = 'transform 0.5s ease';
    track.style.transform = 'translateX(' + (-100 * pzIdx) + '%)';
    var dots = $('pzCard').querySelectorAll('.pz-dots i');
    dots.forEach(function(d, k) { d.classList.toggle('on', k === pzIdx % n); });
    if (pzIdx === n) {   // дошли до копии первого слайда — незаметно возвращаемся в начало
      setTimeout(function() { track.style.transition = 'none'; track.style.transform = 'translateX(0)'; pzIdx = 0; }, 520);
    }
  }, 4000);
}
$('pzCard').addEventListener('mouseenter', function() { pzPaused = true; });
$('pzCard').addEventListener('mouseleave', function() { pzPaused = false; });

/* ---------- подробности по задачам: выдвигаются справа от карточки ---------- */
// служебные метки Lichess — не тактические темы
var PZ_SKIP = {middlegame: 1, endgame: 1, opening: 1, short: 1, long: 1, veryLong: 1, oneMove: 1,
  advantage: 1, crushing: 1, equality: 1, master: 1, masterVsMaster: 1, superGM: 1, mate: 1};
var PZ_NAMES = {mateIn1: 'Мат в 1 ход', mateIn2: 'Мат в 2 хода', mateIn3: 'Мат в 3 хода', mateIn4: 'Мат в 4 хода', mateIn5: 'Мат в 5+ ходов'};
var PZ_MIN_THEME = 5;   // тема в рейтинге, если решено хотя бы столько задач

function pzPerf(list) {
  if (!list.length) return null;
  var w = list.filter(function(a) { return a.win; }).length;
  return Math.round(list.reduce(function(sum, a) { return sum + a.r; }, 0) / list.length + 400 * (2 * w - list.length) / list.length);
}

function pzRow(name, list, cls) {
  var w = list.filter(function(a) { return a.win; }).length;
  return '<div class="pzd-row' + (cls ? ' ' + cls : '') + '"><span class="pzd-name" title="' + esc(name) + '">' + esc(name) + '</span>' +
    '<b>' + pzPerf(list) + '</b><span class="pzd-n">' + list.length + ' · ' + Math.round(w / list.length * 100) + '%</span></div>';
}

function renderPuzzleDetail() {
  var P = window.PUZZLES;
  if (!P || !P.attempts || !P.attempts.length) {
    $('pzDetail').innerHTML = '<div class="pzd-empty">Задач пока нет — запусти update.bat</div>';
    return;
  }
  var names = P.themeNames || {};

  // режимы: микс + каждая дебютная тренировка
  var groups = {mix: []}, order = ['mix'], labels = {};
  P.attempts.forEach(function(a) {
    var k = pzKey(a);
    if (!groups[k]) { groups[k] = []; order.push(k); labels[k] = pzLabel(a, names); }
    groups[k].push(a);
  });
  order = ['mix'].concat(order.slice(1).sort(function(a, b) { return groups[b].length - groups[a].length; }));
  var modes = order.filter(function(k) { return groups[k].length; }).map(function(k) {
    return pzRow(k === 'mix' ? 'Микс' : labels[k], groups[k]);
  });

  // темы: перфоманс Lichess (с первой попытки, 90 дней); если сводки нет — по истории задач
  var ranked;
  if (P.themeStats && Object.keys(P.themeStats).length) {
    ranked = Object.keys(P.themeStats).filter(function(t) { return !PZ_SKIP[t] && P.themeStats[t].nb >= PZ_MIN_THEME; })
      .map(function(t) {
        var st = P.themeStats[t];
        return {name: names[t] || PZ_NAMES[t] || t, perf: st.perf, n: st.nb, pct: Math.round(st.first / st.nb * 100)};
      });
  } else {
    var th = {};
    P.attempts.forEach(function(a) {
      (a.themes || []).forEach(function(t) { if (!PZ_SKIP[t]) (th[t] = th[t] || []).push(a); });
    });
    ranked = Object.keys(th).filter(function(t) { return th[t].length >= PZ_MIN_THEME; }).map(function(t) {
      var w = th[t].filter(function(a) { return a.win; }).length;
      return {name: names[t] || PZ_NAMES[t] || t, perf: pzPerf(th[t]), n: th[t].length, pct: Math.round(w / th[t].length * 100)};
    });
  }
  ranked.sort(function(a, b) { return b.perf - a.perf; });
  var full = $('pzDetail').classList.contains('expanded');
  var half = Math.ceil(ranked.length / 2);
  var top = full ? ranked.slice(0, half) : ranked.slice(0, 3);
  var bottom = (full ? ranked.slice(half) : ranked.slice(-3)).reverse().filter(function(x) { return top.indexOf(x) < 0; });
  var more = modes.length > 3 || ranked.length > 6;
  function themeRow(x, cls) {
    return '<div class="pzd-row ' + cls + '"><span class="pzd-name" title="' + esc(x.name) + '">' + esc(x.name) + '</span>' +
      '<b>' + x.perf + '</b><span class="pzd-n">' + x.n + ' · ' + x.pct + '%</span></div>';
  }

  function col(title, note, rows, empty) {
    return '<div class="pzd-col"><div class="pzd-title" title="' + note + '">' + title + '</div>' + (rows.length ? rows.join('') : '<div class="pzd-empty">' + empty + '</div>') + '</div>';
  }
  $('pzDetail').innerHTML =
    '<button class="pzd-close" aria-label="Закрыть">×</button>' +
    col('Режимы', 'Перфоманс по истории задач (решения со второй попытки тоже засчитаны)',
      full ? modes : modes.slice(0, 3), '—') +
    col('<span style="color:var(--green)">▲</span> Сильные темы', 'Перфоманс Lichess: только решения с первой попытки, за 90 дней', top.map(function(x) { return themeRow(x, 'good'); }), 'мало данных') +
    col('<span style="color:var(--red)">▼</span> Слабые темы', 'Перфоманс Lichess: только решения с первой попытки, за 90 дней', bottom.map(function(x) { return themeRow(x, 'bad'); }), 'нужно ' + PZ_MIN_THEME + '+ задач в теме') +
    (more ? '<button class="pzd-toggle">' + (full ? 'Свернуть ▴' : 'Показать все: ' + (modes.length - 1) + ' ' +
      plural(modes.length - 1, 'дебют', 'дебюта', 'дебютов') + ', ' + ranked.length + ' ' + plural(ranked.length, 'тема', 'темы', 'тем') + ' ▾') + '</button>' : '') +
    '<a class="pzd-link" href="https://lichess.org/training/themes" target="_blank" rel="noopener">Темы на Lichess ↗</a>';
}

function togglePuzzleDetail(open) {
  var row = $('sideRow');
  if (open === undefined) open = !row.classList.contains('open');
  if (open) { renderPuzzleDetail(); if ($('sideRow').classList.contains('op-open')) toggleOpeningDetail(false); if ($('sideRow').classList.contains('vd-open')) toggleVerdict(false); }
  if (!open) { $('pzDetail').classList.remove('expanded'); row.classList.remove('expanded'); }
  row.classList.toggle('open', open);
  $('pzCard').setAttribute('aria-expanded', String(open));
  $('pzDetail').setAttribute('aria-hidden', String(!open));
}
$('pzCard').addEventListener('click', function() { togglePuzzleDetail(); });
$('pzCard').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePuzzleDetail(); }
});
$('pzDetail').addEventListener('click', function(e) {
  if (e.target.closest('.pzd-close')) togglePuzzleDetail(false);
  if (e.target.closest('.pzd-toggle')) {
    var d = $('pzDetail');
    d.classList.toggle('expanded');
    $('sideRow').classList.toggle('expanded', d.classList.contains('expanded'));
    renderPuzzleDetail();
  }
});

/* ---------- дебюты: изучаю / следующие / в планах (openings.js) ---------- */
function opMatch(o, name) {
  return (o.match || []).some(function(m) { return (name || '').toLowerCase().indexOf(m.toLowerCase()) >= 0; });
}
// партии этим цветом в этом дебюте + задачи из этого дебюта
function opStats(o) {
  var gl = games.filter(function(g) { return g.color === o.color && opMatch(o, g.opening); });
  var w = gl.filter(function(g) { return g.result === 'win'; }).length;
  var l = gl.filter(function(g) { return g.result === 'lose'; }).length;
  var pz = ((window.PUZZLES || {}).attempts || []).filter(function(a) { return opMatch(o, a.op); });
  return {games: gl, w: w, l: l, d: gl.length - w - l, debut: avg(gl, 'debut'),
          pz: pz.length, pzOk: pz.filter(function(a) { return a.win; }).length};
}
function opName(o) { return esc(o.name) + ' <span class="op-kn">' + KNIGHT[o.color] + '</span>'; }
function opGamesLine(st) {
  if (!st.games.length) return 'партий пока нет';
  return st.games.length + ' ' + plural(st.games.length, 'партия', 'партии', 'партий') + ' · ' +
    Math.round(st.w / st.games.length * 100) + '% побед';
}

function renderOpeningCard() {
  var O = window.OPENINGS;
  var head = '<div class="op-head"><span>📖 Дебюты</span><span class="op-go">›</span></div>';
  if (!O || !O.current || !O.current.length) {
    $('opCard').innerHTML = head + '<div class="op-main">—</div><div class="op-sub">заполни progress/data/openings.js</div>';
    return;
  }
  var cur = O.current[0], st = opStats(cur);
  $('opCard').innerHTML = head +
    '<div class="op-main" title="Изучаю сейчас">' + opName(cur) + '</div>' +
    '<div class="op-line">' + opGamesLine(st) + '</div>' +
    '<div class="op-line op-next">' + ((O.next || []).length
      ? 'Далее: ' + O.next.map(function(o) { return opName(o); }).join(' · ')
      : 'Далее: —') + '</div>' +
    '<div class="op-sub">В планах: ' + (O.planned || []).length + ((O.done || []).length ? ' · изучено: ' + O.done.length : '') + '</div>';
}

function studyLinks(o) {
  return (o.studies || []).map(function(s) {
    return '<a href="https://lichess.org/study/' + s.id + '" target="_blank" rel="noopener" title="Студия ' + esc(s.master) +
      (s.parts > 1 ? ' — часть 1 из ' + s.parts : '') + '">' + esc(s.master) + ' ↗</a>';
  }).join(' ');
}

function renderOpeningDetail() {
  var O = window.OPENINGS || {};
  function current(o) {
    var st = opStats(o);
    return '<div class="opd-item">' +
      '<div class="opd-name">' + opName(o) + '</div>' +
      '<div class="opd-row">' + (st.games.length
        ? st.games.length + ' ' + plural(st.games.length, 'партия', 'партии', 'партий') + ' · <span class="w">' + st.w + 'W</span> <span class="l">' + st.l + 'L</span>' +
          (st.d ? ' ' + st.d + 'D' : '') + (st.debut !== null ? ' · дебют ' + Math.round(st.debut) + '%' : '')
        : 'партий пока нет') + '</div>' +
      '<div class="opd-row">' + (st.pz ? 'Задачи ' + st.pz + ' · <span class="w">' + st.pzOk + '✓</span> <span class="l">' + (st.pz - st.pzOk) + '✗</span>' : 'задач по дебюту нет') + '</div>' +
      '<div class="opd-row opd-links">Студии: ' + studyLinks(o) + '</div>' +
    '</div>';
  }
  // следующие и планы — компактные метки, подробности в подсказке
  function chip(o) {
    var st = opStats(o);
    var tip = o.name + ' (' + (o.color === 'white' ? 'белыми' : 'чёрными') + ')\nМастера: ' +
      (o.studies || []).map(function(x) { return x.master; }).join(', ') +
      (st.games.length ? '\nПартий: ' + st.games.length : '') + (st.pz ? '\nЗадач: ' + st.pz : '');
    var first = (o.studies || [])[0];
    return '<a class="op-chip" title="' + esc(tip).replace(/\n/g, '&#10;') + '"' +
      (first ? ' href="https://lichess.org/study/' + first.id + '" target="_blank" rel="noopener"' : '') + '>' + opName(o) + '</a>';
  }
  $('opDetail').innerHTML =
    '<button class="pzd-close op-close" aria-label="Закрыть">×</button>' +
    '<div class="opd-col"><div class="pzd-title">Изучаю</div>' + (O.current || []).map(current).join('') + '</div>' +
    '<div class="opd-col">' +
      '<div class="pzd-title">Следующие</div><div class="op-chips">' + ((O.next || []).length ? O.next.map(chip).join('') : '<span class="pzd-empty">—</span>') + '</div>' +
      '<div class="pzd-title" style="margin-top:8px">В планах</div><div class="op-chips">' + ((O.planned || []).length ? O.planned.map(chip).join('') : '<span class="pzd-empty">—</span>') + '</div>' +
    '</div>';
}

function toggleOpeningDetail(open) {
  var row = $('sideRow');
  if (open === undefined) open = !row.classList.contains('op-open');
  if (open) { togglePuzzleDetail(false); if ($('sideRow').classList.contains('vd-open')) toggleVerdict(false); renderOpeningDetail(); }
  row.classList.toggle('op-open', open);
  $('opCard').setAttribute('aria-expanded', String(open));
  $('opDetail').setAttribute('aria-hidden', String(!open));
}
$('opCard').addEventListener('click', function() { toggleOpeningDetail(); });
$('opCard').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleOpeningDetail(); }
});
$('opDetail').addEventListener('click', function(e) {
  if (e.target.closest('.op-close')) toggleOpeningDetail(false);
});
// панель дебютов закрывается только кликом по карточке или ×, как задачи и итоги (раньше — при уходе курсора)

/* ---------- итоги: автоматические выводы по всей статистике ---------- */
// каждое правило добавляет пункт {t: good | bad | tip, w: важность, text, link?}
function buildVerdicts() {
  var V = [];
  // text — коротко (в строку панели), more — подробности во всплывающей подсказке
  function add(t, w, text, link, more) { V.push({t: t, w: w, text: text, link: link, more: more}); }
  function r(v) { return Math.round(v); }
  function sameKey(list, key) { return list.filter(function(g) { return typeof g[key] === 'number'; }); }

  /* --- партии --- */
  var n = games.length;
  if (n) {
    var last = games.slice(-10), l5 = games.slice(-5), p5 = games.length >= 10 ? games.slice(-10, -5) : [];

    // точность: последние 5 против предыдущих 5
    if (p5.length === 5) {
      var da = avg(l5, 'acc') - avg(p5, 'acc');
      if (da >= 5) add('good', 60 + da, 'Точность растёт: +' + r(da) + '% (' + r(avg(l5, 'acc')) + '%)', null, 'Средняя точность последних 5 партий против предыдущих 5');
      else if (da <= -5) add('bad', 60 - da, 'Точность падает: −' + r(-da) + '% (' + r(avg(l5, 'acc')) + '%)', null, 'Средняя точность последних 5 партий против предыдущих 5');
    }

    // фазы партии: самая слабая и самая сильная
    var PH = [['debut', 'Дебют'], ['mid', 'Миттельшпиль'], ['end', 'Эндшпиль']];
    var ph = PH.map(function(p) { return {k: p[0], name: p[1], v: avg(last, p[0])}; })
      .filter(function(x) { return x.v !== null; }).sort(function(a, b) { return a.v - b.v; });
    if (ph.length >= 2) {
      var weak = ph[0], strong = ph[ph.length - 1];
      if (strong.v - weak.v >= 10) {
        add('bad', 70 + (strong.v - weak.v) / 2, 'Слабая фаза — ' + weak.name.toLowerCase() + ': ' + r(weak.v) + '%', null, weak.name + ' ' + r(weak.v) + '%, а ' + strong.name.toLowerCase() + ' ' + r(strong.v) + '% (последние 10 партий)');
        var tipFor = {
          debut: ['Повтори дебютные линии в студиях', 'Перед игрой пройди главные линии в студиях мастеров'],
          mid: ['Ищи угрозу после каждого хода соперника', 'Миттельшпиль: после каждого хода соперника ищи его угрозу и свои незащищённые фигуры'],
          end: ['Разбирай свои эндшпили с движком', 'Эндшпиль: разбирай свои эндшпили с движком и реши задачи на тему «Эндшпиль»']
        };
        add('tip', 70, tipFor[weak.k][0], null, tipFor[weak.k][1]);
      }
      if (strong.v >= 85) add('good', 50 + (strong.v - 85), 'Сильная фаза — ' + strong.name.toLowerCase() + ': ' + r(strong.v) + '%', null, 'Средняя точность в фазе за последние 10 партий');
    }

    // зевки: уровень, динамика и влияние на миттельшпиль
    var bl = avg(last, 'blunders');
    if (p5.length === 5) {
      var db = avg(l5, 'blunders') - avg(p5, 'blunders');
      if (db <= -1) add('good', 65 - db * 3, 'Зевков меньше: ' + avg(l5, 'blunders').toFixed(1) + ' (было ' + avg(p5, 'blunders').toFixed(1) + ')', null, 'Зевков за партию: последние 5 против предыдущих 5');
      else if (db >= 1) add('bad', 65 + db * 3, 'Зевков больше: ' + avg(l5, 'blunders').toFixed(1) + ' (было ' + avg(p5, 'blunders').toFixed(1) + ')', null, 'Зевков за партию: последние 5 против предыдущих 5');
    }
    var clean = sameKey(last.filter(function(g) { return g.blunders <= 2; }), 'mid');
    var dirty = sameKey(last.filter(function(g) { return g.blunders > 2; }), 'mid');
    if (clean.length >= 2 && dirty.length >= 2) {
      var cm = avg(clean, 'mid'), dm = avg(dirty, 'mid');
      if (cm - dm >= 20) add('bad', 80, 'Зевки ломают миттельшпиль: ' + r(dm) + '% / ' + r(cm) + '%', null, 'Миттельшпиль ' + r(dm) + '% в партиях с 3+ зевками и ' + r(cm) + '% в партиях с 0–2 зевками');
    }
    if (bl !== null && bl >= 3) add('tip', 78, 'Проверяй перед ходом, что висит', null, 'В среднем ' + bl.toFixed(1) + ' зевка за партию — перед каждым ходом проверяй свои незащищённые фигуры');
    else if (bl !== null && bl <= 1.5 && last.length >= 5) add('good', 55, 'Мало зевков: ' + bl.toFixed(1) + ' за партию', null, 'Среднее за последние 10 партий');

    // поражения до эндшпиля
    var losses = last.filter(function(g) { return g.result === 'lose'; });
    var early = losses.filter(function(g) { return typeof g.end !== 'number'; });
    if (losses.length >= 2 && early.length / losses.length >= 0.5) {
      add('bad', 55, early.length + ' из ' + losses.length + ' поражений — до эндшпиля', null, 'Партия проиграна ещё в миттельшпиле (последние 10 партий)');
    }

    // серия результатов
    var run = 0, res = games[n - 1].result;
    for (var i = n - 1; i >= 0 && games[i].result === res; i--) run++;
    if (res === 'win' && run >= 3) add('good', 75 + run, 'Серия побед: ' + run + ' подряд');
    if (res === 'lose' && run >= 3) {
      add('bad', 75 + run, run + ' ' + plural(run, 'поражение', 'поражения', 'поражений') + ' подряд');
      add('tip', 74, 'Сделай паузу и разбери поражения', null, 'После серии поражений сделай паузу и разбери последние партии с движком');
    }

    // цель этапа
    var G = PROFILE.goal;
    if (G) {
      var gl = games.filter(function(g) { return g.engine === G.engine && g.color === G.color; }).slice(-G.of);
      var gw = gl.filter(function(g) { return g.result === 'win'; }).length;
      if (gl.length >= G.of && gw >= G.need) add('good', 95, 'Цель этапа выполнена: ' + gw + ' из ' + G.of, null, gw + ' из ' + G.of + ' побед против ' + G.engine + ' — можно переходить к следующему этапу');
      else add('tip', 88, 'Цель этапа: ' + gw + ' из ' + gl.length + ', нужно ' + G.need + ' из ' + G.of, null, 'Побед в последних ' + G.of + ' партиях против ' + G.engine + ' (' + (G.color === 'white' ? 'белыми' : 'чёрными') + ')');
    }

    // дебюты в партиях: семейства с 2+ партиями
    var fam = {};
    games.forEach(function(g) { var k = g.opening.split(':')[0]; (fam[k] = fam[k] || []).push(g); });
    Object.keys(fam).forEach(function(k) {
      var fl = fam[k];
      if (fl.length < 2) return;
      var wr = winrate(fl);
      if (wr <= 34) add('bad', 50 + fl.length, k + ': ' + fl.filter(function(g) { return g.result === 'win'; }).length + ' из ' + fl.length + ' побед', null, 'Проблемный дебют — мало побед');
      else if (wr >= 75) add('good', 45 + fl.length, k + ': ' + r(wr) + '% побед', null, fl.length + ' ' + plural(fl.length, 'партия', 'партии', 'партий') + ' в этом дебюте');
    });
  }

  /* --- активность --- */
  var st = streaks();
  if (st.current >= 3) add('good', 58 + st.current, st.current + ' ' + plural(st.current, 'день', 'дня', 'дней') + ' подряд за доской', null, 'Серия дней с партиями');
  if (n) {
    var idle = daysBetween(fromIso(games[n - 1].day), gameToday());
    if (idle >= 3) add('tip', 82, 'Не играл ' + idle + ' ' + plural(idle, 'день', 'дня', 'дней'), null, 'Сыграй хотя бы одну партию, чтобы не терять форму');
    else {
      // регулярность: дни с партиями за последние 7 дней
      var d7 = isoDay(addDays(gameToday(), -6));
      var act = games.filter(function(g) { return g.day >= d7; }).map(function(g) { return g.day; })
        .filter(function(d, i, a) { return a.indexOf(d) === i; }).length;
      add('tip', 64, 'Играй регулярно: 2–3 партии каждый день', null,
        'Лучше несколько партий каждый день, чем много за один вечер. Сейчас дней с партиями: ' + act + ' из 7');
    }
  }

  /* --- задачи --- */
  var P = window.PUZZLES;
  if (P && P.rating !== null) {
    var hist = P.history || [];
    var weekAgo = isoDay(addDays(gameToday(), -7));
    var base = hist.filter(function(h) { return h.day <= weekAgo; }).pop() || hist[0];
    if (base && hist.length > 1) {
      var dr = P.rating - base.rating;
      var since = base.day <= weekAgo ? 'за неделю' : 'с ' + base.date;
      if (dr >= 20) add('good', 60 + dr / 5, 'Рейтинг задач +' + dr + ' ' + since, null, 'Сейчас ' + P.rating);
      else if (dr <= -20) add('bad', 60 - dr / 5, 'Рейтинг задач −' + (-dr) + ' ' + since, null, 'Сейчас ' + P.rating);
    }
    // темы: сравнение с общим перфомансом Lichess
    var gp = P.global && P.global.perf, ts = P.themeStats || {}, names = P.themeNames || {};
    if (gp) {
      var th = Object.keys(ts).filter(function(k) { return !PZ_SKIP[k] && ts[k].nb >= 5; })
        .map(function(k) { return {k: k, name: names[k] || PZ_NAMES[k] || k, p: ts[k].perf, nb: ts[k].nb}; });
      var weakT = th.filter(function(x) { return x.p <= gp - 50; }).sort(function(a, b) { return a.p - b.p; });
      var strongT = th.filter(function(x) { return x.p >= gp + 80; }).sort(function(a, b) { return b.p - a.p; });
      weakT.slice(0, 2).forEach(function(x) {
        add('bad', 55 + (gp - x.p) / 5, 'Слабая тема: «' + x.name + '» ' + x.p, null, 'Перфоманс в теме ' + x.p + ', твой средний ' + gp + ' (' + x.nb + ' задач)');
      });
      if (weakT.length) add('tip', 72, '20 задач: «' + weakT[0].name + '»', 'https://lichess.org/training/' + weakT[0].k, 'Самая слабая тема — потренируй её на Lichess');
      strongT.slice(0, 2).forEach(function(x) {
        add('good', 45 + (x.p - gp) / 10, 'Сильная тема: «' + x.name + '» ' + x.p, null, 'Перфоманс в теме ' + x.p + ', твой средний ' + gp);
      });
    }
    // дебютные тренировки в задачах
    var tr = {};
    P.attempts.forEach(function(a) { if (a.mode === 'open') (tr[a.tr] = tr[a.tr] || []).push(a); });
    Object.keys(tr).forEach(function(k) {
      var l = tr[k], pct = r(l.filter(function(a) { return a.win; }).length / l.length * 100), nm = k.split(': ').pop();
      if (l.length >= 6 && pct < 50) {
        add('bad', 58, 'Задачи «' + nm + '»: ' + pct + '% решено', null, 'Тренировка задач по дебюту: решено меньше половины');
        add('tip', 66, 'Повтори задачи «' + nm + '»', 'https://lichess.org/training/openings', 'Это твой дебют — тактика в нём важнее всего');
      } else if (l.length >= 6 && pct >= 70) add('good', 48, 'Задачи «' + nm + '»: ' + pct + '% решено', null, 'Тренировка задач по дебюту');
    });
    // объём задач: эта неделя против прошлой
    var mon = mondayOf(gameToday());
    function cnt(m) {
      var f = isoDay(m), t = isoDay(addDays(m, 6));
      return P.attempts.filter(function(a) { return a.day >= f && a.day <= t; }).length;
    }
    var cw = cnt(mon), pw = cnt(addDays(mon, -7));
    if (pw >= 10 && cw < pw / 2 && gameToday().getDay() >= 4) add('tip', 60, 'Задач меньше: ' + cw + ' (было ' + pw + ')', null, 'Эта неделя против прошлой');
  }

  /* --- рейтинг партий --- */
  var RG = window.RATING_GAMES || [];
  if (RG.length >= 3) {
    var rl = RG.slice(-5), rs = rl.reduce(function(s, x) { return s + x.diff; }, 0);
    if (rs >= 20) add('good', 70, 'Рейтинг партий +' + rs, null, 'За последние ' + rl.length + ' рейтинговых игр');
    else if (rs <= -20) add('bad', 70, 'Рейтинг партий −' + (-rs), null, 'За последние ' + rl.length + ' рейтинговых игр');
  }

  V.sort(function(a, b) { return b.w - a.w; });
  return V;
}

var vdTimer = null, vdIdx = 0, vdPaused = false;
function startVdCarousel(n) {
  clearInterval(vdTimer);
  vdIdx = 0;
  if (n < 2) return;
  vdTimer = setInterval(function() {
    if (vdPaused || $('sideRow').classList.contains('vd-open')) return;
    var sl = $('vdCard').querySelectorAll('.vd-slide'), dots = $('vdCard').querySelectorAll('.vd-dots i');
    if (!sl.length) return;
    sl[vdIdx].classList.remove('on'); sl[vdIdx].classList.add('out');
    var prev = sl[vdIdx];
    setTimeout(function() { prev.classList.remove('out'); }, 450);
    vdIdx = (vdIdx + 1) % n;
    sl[vdIdx].classList.add('on');
    dots.forEach(function(d, k) { d.classList.toggle('on', k === vdIdx); });
  }, 4500);
}

  });

  /* --- действия на Lichess --- */
  function ext(title, sub, keys, url) { add('Lichess', '↗', title, sub, keys, function() { window.open(url, '_blank'); }); }
  if (PROFILE.goal) ext('Сыграть с ' + PROFILE.goal.engine, 'откроется окно игры с компьютером — выбери уровень ' + PROFILE.goal.engine.replace(/\D+/g, '') + ' и ' + (PROFILE.goal.color === 'white' ? 'белые' : 'чёрные'), 'играть сыграть stockfish бот компьютер', 'https://lichess.org/#ai');
  ext('Задачи: микс', 'тренировка на Lichess', 'задачи микс тренировка', 'https://lichess.org/training/mix');
  if (P2 && P2.themeStats && P2.global) {
    var weakest = Object.keys(P2.themeStats).filter(function(k) { return !PZ_SKIP[k] && P2.themeStats[k].nb >= 5; })
      .sort(function(a, b) { return P2.themeStats[a].perf - P2.themeStats[b].perf; })[0];
    if (weakest) ext('Задачи по слабой теме: ' + ((P2.themeNames || {})[weakest] || weakest), 'перфоманс ' + P2.themeStats[weakest].perf + ' — самая слабая тема', 'задачи слабая тема тренировать', 'https://lichess.org/training/' + weakest);
  }
  var OO = window.OPENINGS || {};
  (OO.current || []).concat(OO.next || []).forEach(function(o) {
    (o.match || []).slice(0, 1).forEach(function(m) {
      ext('Задачи по дебюту: ' + o.name, 'задачи из партий этого дебюта', 'задачи дебют ' + o.name + ' ' + m, 'https://lichess.org/training/' + m.replace(/[^A-Za-z ]/g, '').trim().replace(/ +/g, '_'));
    });
  });
  if (nG) ext('Анализ последней партии', '#' + games[nG - 1].n + ' · ' + games[nG - 1].opening, 'анализ последняя партия разбор', 'https://lichess.org/' + games[nG - 1].id);
  ext('Мой профиль на Lichess', 'lichess.org/@/KvLGn', 'профиль аккаунт', 'https://lichess.org/@/KvLGn');

  /* --- сервисные --- */
  add('Сервис', '⟳', 'Как обновить данные', 'запусти progress/update.bat · обновлено: ' + (window.GAMES_UPDATED || '—'), 'обновить данные update bat', function() { gsFlash($('footer')); });
  add('Сервис', '↑', 'Наверх', 'к началу страницы', 'наверх начало вверх', function() { window.scrollTo({top: 0, behavior: 'smooth'}); });
  add('Сервис', '↓', 'К таблице партий', 'список партий и фильтры', 'таблица вниз партии', function() { gsFlash($('filters')); });

  // итоги по вкладкам
  buildVerdicts().forEach(function(v) {
    add('Итоги', v.t === 'bad' ? '▼' : v.t === 'good' ? '▲' : '💡', v.text, v.t === 'bad' ? 'проседает' : v.t === 'good' ? 'хорошо' : 'совет', '', function() {
      gsCloseSide(); vdTab = v.t; toggleVerdict(true); gsFlash($('sideRow'));
    });
  });

  // партии (новые сначала)
  games.slice().reverse().forEach(function(g) {
    var R = RESULT[g.result];
    add('Партии', KNIGHT[g.color], '#' + g.n + ' · ' + g.opening, g.date + ' · ' + R.label + ' · ' + g.acc + '% · ' + g.engine,
      '#' + g.n + ' ' + g.n + ' ' + g.date + ' ' + R.label + ' ' + R.short + ' ' + COLOR_NAME[g.color] + ' ' + (g.eco || ''), function() { gsOpenGame(g); });
  });

  // дебюты: из плана + сыгранные
  var O = window.OPENINGS || {};
  [].concat((O.current || []).map(function(o) { return [o, 'изучаю']; }), (O.next || []).map(function(o) { return [o, 'следующий']; }),
            (O.planned || []).map(function(o) { return [o, 'в планах']; }), (O.done || []).map(function(o) { return [o, 'изучен']; }))
    .forEach(function(p) {
      var o = p[0], st = opStats(o);
      add('Дебюты', KNIGHT[o.color], o.name, p[1] + ' · ' + (st.games.length ? st.games.length + ' партий' : 'партий нет') + (st.pz ? ' · ' + st.pz + ' задач' : ''),
        (o.match || []).join(' ') + ' ' + (o.studies || []).map(function(x) { return x.master; }).join(' '), function() { gsCloseSide(); toggleOpeningDetail(true); gsFlash($('sideRow')); });
    });
  var played = {};
  games.forEach(function(g) { played[g.opening] = (played[g.opening] || 0) + 1; });
  Object.keys(played).forEach(function(name) {
    add('Дебюты', '♟', name, played[name] + ' ' + plural(played[name], 'партия', 'партии', 'партий') + ' · показать в таблице', '', function() { gsTableOpening(name); });
  });

  // темы задач
  var P = window.PUZZLES;
  if (P && P.themeStats) {
    Object.keys(P.themeStats).filter(function(k) { return !PZ_SKIP[k]; }).forEach(function(k) {
      var s = P.themeStats[k], name = (P.themeNames || {})[k] || PZ_NAMES[k] || k;
      add('Темы задач', '🧩', name, s.nb + ' задач · перфоманс ' + s.perf + ' · тренировать на Lichess', k, function() { window.open('https://lichess.org/training/' + k, '_blank'); });
    });
  }
  return items;
}

var gsItems = [], gsSel = 0, gsShown = [];
function gsRender() {
  var q = gsNorm($('gsInput').value.trim());
  var words = q.split(/\s+/).filter(Boolean);
  var res = words.length ? gsItems.filter(function(it) { return words.every(function(w) { return it.keys.indexOf(w) >= 0; }); })
                         : gsItems.filter(function(it) { return it.group === 'Разделы' || it.group === 'Ответы'; });
  // не больше 6 в группе, чтобы список был обозримым
  var per = {}, LIMIT = words.length ? 6 : 20;
  gsShown = res.filter(function(it) { per[it.group] = (per[it.group] || 0) + 1; return per[it.group] <= LIMIT; });
  gsSel = Math.min(gsSel, Math.max(gsShown.length - 1, 0));
  var html = '', lastGroup = '';
  gsShown.forEach(function(it, i) {
    if (it.group !== lastGroup) {
      html += '<div class="gs-group">' + it.group + (per[it.group] > LIMIT ? ' <span>ещё ' + (per[it.group] - LIMIT) + ' — уточни запрос</span>' : '') + '</div>';
      lastGroup = it.group;
    }
    html += '<button class="gs-item' + (i === gsSel ? ' on' : '') + '" data-i="' + i + '"><span class="gs-ic">' + it.icon + '</span>' +
      '<span class="gs-tx"><span class="gs-title">' + esc(it.title) + '</span><span class="gs-sub">' + esc(it.sub) + '</span></span></button>';
  });
  $('gsList').innerHTML = html || '<div class="gs-empty">Ничего не найдено</div>';
  var cur = $('gsList').querySelector('.gs-item.on');
  if (cur) cur.scrollIntoView({block: 'nearest'});
}
function gsOpen() {
  gsItems = gsIndex();
  $('gs').classList.add('open');
  gsRender();
}
function gsClose() { $('gs').classList.remove('open'); }
function gsRun(i) {
  var it = gsShown[i];
  if (!it) return;
  gsClose();
  $('gsInput').blur();
  it.run();
}

$('gsInput').addEventListener('focus', gsOpen);
$('gsInput').addEventListener('input', function() { gsSel = 0; gsRender(); });
$('gsInput').addEventListener('keydown', function(e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); gsSel = Math.min(gsSel + 1, gsShown.length - 1); gsRender(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); gsSel = Math.max(gsSel - 1, 0); gsRender(); }
  else if (e.key === 'Enter') { e.preventDefault(); gsRun(gsSel); }
  else if (e.key === 'Escape') { gsClose(); $('gsInput').blur(); }
});
$('gs').addEventListener('mousedown', function(e) {
  var b = e.target.closest('.gs-item');
  if (b) { e.preventDefault(); gsRun(+b.getAttribute('data-i')); }
});
$('gs').addEventListener('click', function(e) { e.stopPropagation(); });
document.addEventListener('click', gsClose);
// Ctrl+K или «/» — к поиску
document.addEventListener('keydown', function(e) {
  var typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if ((e.key === 'k' || e.key === 'K' || e.key === 'л' || e.key === 'Л') && (e.ctrlKey || e.metaKey) || (e.key === '/' && !typing)) {
    e.preventDefault();
    $('gsInput').focus();
    $('gsInput').select();
  }
});

/* ---------- go ---------- */
renderSummary();
renderPuzzleCard();
renderOpeningCard();
renderVerdictCard();
renderTitle();
renderWindow();
renderChartFilter();
renderMetricInputs();
renderFilterBar();
renderGames();
if (chartMode === 'activity') setMode('activity');
</script>
