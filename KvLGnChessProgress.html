function applyHush() {
  ['head', 'chart', 'table'].forEach(function(k) { if (hush[k] && !hushPrev[k]) snapHush(k); });
  ['head', 'chart', 'table'].forEach(function(k) { document.body.classList.toggle('hush-' + k, hush[k]); });
  document.body.classList.toggle('hush-all', hushAll());
  $('eyeBtn').classList.toggle('shut', hush.mode);
  renderFooter();
  $('avatar').parentNode.classList.toggle('can-all', !hush.mode && hushAny());
  // скрытый режим не объясняет, что скрыто: подсказок «скрыто / недоступно» нет — недоступное просто без подсказки
  $('eyeBtn').title = hush.mode ? '' : 'Скрытый режим';
  $('avatar').title = hush.mode ? '' : 'Скрытый режим';
  $('eyeAll').title = hush.mode ? '' : 'Показать все скрытые части'; $('eyeAll').setAttribute('aria-label', $('eyeAll').title);
  $('eyeBtn').setAttribute('aria-label', $('eyeBtn').title);
  document.querySelectorAll('.sect-eye').forEach(function(b) {
    var on = hush[b.getAttribute('data-sec')];
    b.classList.toggle('shut', on);
    b.style.visibility = hush.mode ? 'hidden' : '';   // в скрытом режиме глаз частей невидим, но место держит — кнопки рядом не съезжают   // только в скрытом режиме (глаз у аватарки) глаз частей нет; скрыть все части по очереди — не скрытый режим
    b.title = (on ? 'Показать ' : 'Скрыть ') + SECT_NAME[b.getAttribute('data-sec')];
    b.setAttribute('aria-label', b.title);
  });
  $('helpBtn').disabled = hushAny();
  $('helpBtn').title = hushAny() ? '' : 'Готовые вопросы для нейросети или человека: клик по пункту — копия текста';
  $('menuBtn').disabled = hushAll();   // всё скрыто — меню недоступно
  $('menuBtn').title = hushAll() ? '' : 'Меню (Ctrl+K)';
  if (hushAll()) mnClose();
  else if ($('mn').classList.contains('open')) { mnBuild(); mnRender(); }   // меню без скрытых частей
  if (hush.head) gsCloseSide();
  if (hush.chart) {
    hideTooltip();   // подсказка могла открыться за 0,25 с анимации глаза — колонки уже нет, сама она бы не закрылась
    if (showRecords) setRecords(false);
    $('cf').classList.remove('open');
    selCols = {}; cmpMode = null; cmpSet = {};
    selDays = {}; aCmpMode = null; aCmpSet = {};
    pinnedSeries = null; markPinned();
    if (actRes) { actRes = null; document.querySelectorAll('.res-toggle').forEach(function(el) { el.classList.remove('pinned', 'dim'); }); }
  }
  if (hush.table) closeDrops();
  renderResultChips(); renderColorChips(); renderFilterButtons(); renderChartFilter(true);   // в скрытой части выбранные фильтры не видны, при показе — возвращаются
  var T = !hush.table && hushPrev.table && hushSnap.table;
  if (T) currentPage = T.page;
  renderGames();
  if (T) {
    $('gameRows').querySelectorAll('tr.game-row').forEach(function(r) { if (T.open.indexOf(r.firstChild.textContent) >= 0) r.classList.add('open'); });
    delete hushSnap.table;
  }
  if (!hush.chart && hushPrev.chart) restoreHush('chart');
  // скрытый режим или скрытый график (свой глаз): «Анализ» недоступен; открытый анализ сменяется показателями
  var anOff = hush.mode || hush.chart;
  $('analysisBtn').disabled = anOff;
  $('analysisBtn').title = anOff ? '' : chartMode === 'analysis' ? 'Вернуться к показателям' : 'Разбор партий на доске: ходы, зевки, график перевеса';
  // при выходе из скрытого режима анализ возвращается как был (партия, ход, линза, мастер — в an); запоминается и между перезагрузками
  if (anOff && chartMode === 'analysis') { anHushBack = true; setMode('metrics'); }
  else if (!anOff && anHushBack) { anHushBack = false; setMode('analysis'); }
  try { if (anHushBack) localStorage.setItem('anHushBack', '1'); else localStorage.removeItem('anHushBack'); } catch (e) {}
  placeChartBtns();   // глаз графика мог появиться / пропасть
  renderAnBadge();
  renderTitle();
  renderWindow();
  if (chartMode === 'activity') renderActivity();
  else if (chartMode === 'analysis') renderAnalysis();
  renderWrBox();
  renderPuzzleCard();
  renderOpeningCard();
  renderVerdictCard();
  if (!hush.head && hushPrev.head) restoreHush('head');
  hushPrev = {head: hush.head, chart: hush.chart, table: hush.table};
}
var SECT_NAME = {head: 'шапку', chart: 'график', table: 'партии'};
var anHushBack = false;   // анализ был открыт, когда включили скрытый режим — вернуть его при выходе
try { anHushBack = localStorage.getItem('anHushBack') === '1'; } catch (e) {}
function saveHush() { try { localStorage.setItem('hush', JSON.stringify(hush)); } catch (err) {} }
var EYE_SVG = $('eyeBtn').innerHTML;
$('eyeAll').innerHTML = EYE_SVG;
$('eyeAll').addEventListener('click', function(e) {
  e.stopPropagation();
  hush = {head: false, chart: false, table: false, mode: false};
  saveHush();
  setEyeOut(false);
  applyHush();
});
document.querySelectorAll('.sect-eye').forEach(function(b) {
  b.innerHTML = EYE_SVG;
  b.addEventListener('click', function(e) {
    e.stopPropagation();
    var k = b.getAttribute('data-sec');
    b.classList.toggle('shut', !hush[k]);
    setTimeout(function() { hush[k] = !hush[k]; saveHush(); applyHush(); }, 250);
  });
});
// кнопки справа над графиком: глаз у края (CSS), левее «Активность», ещё левее «Анализ» — ширина кнопок зависит от шрифта, пересчитываем
function placeChartBtns() {
  var eye = $('eyeChart'), act = $('activityBtn'), an = $('analysisBtn');
  // показать кнопки, когда они на месте и шрифт загружен (с ним меняется их ширина) — см. .btns-ready
  var ready = function() { if (!document.fonts || document.fonts.status === 'loaded') act.parentNode.classList.add('btns-ready'); };
  if (getComputedStyle(act).position !== 'absolute') { act.style.right = an.style.right = ''; ready(); return; }   // телефон: кнопки идут строкой
  var W = act.parentNode.clientWidth;
  act.style.right = (eye.offsetParent ? W - eye.offsetLeft + 8 : 14) + 'px';   // в скрытом режиме глаза нет — «Активность» у края
  an.style.right = (W - act.offsetLeft + 8) + 'px';
  ready();
}
window.addEventListener('resize', placeChartBtns);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeChartBtns);
function setEyeOut(on) { $('avatar').parentNode.classList.toggle('eye-out', on); }
$('avatar').addEventListener('click', function(e) {
  e.stopPropagation();
  setEyeOut(!$('avatar').parentNode.classList.contains('eye-out'));
});
$('eyeBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  var btn = this;
  var all = !hush.mode;                   // включить скрытый режим (скрыть всё) / выйти из него (показать всё)
  btn.classList.toggle('shut', all);     // глаз закрывается / открывается
  setTimeout(function() {
    hush = {head: all, chart: all, table: all, mode: all};
    saveHush();
    setEyeOut(false);                    // и уезжает обратно за аватарку
    applyHush();
  }, 350);
});
document.addEventListener('click', function(e) {
  if (!e.composedPath().some(function(el) { return el === $('eyeBtn') || el === $('eyeAll') || el === $('avatar'); })) setEyeOut(false);
});

/* ---------- плавающая стрелка: в шапке ↓ в самый низ (правый нижний угол), ниже — ↑ наверх (правый верхний угол) ---------- */
function renderScrollBtn() {
  var b = $('scrollBtn'), top = window.scrollY < 200;
  b.textContent = top ? '↓' : '↑';
  b.classList.toggle('up', !top);
  b.title = top ? 'К последним партиям' : 'Наверх';
  b.setAttribute('aria-label', b.title);
}
$('scrollBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  if (window.scrollY < 200) window.scrollTo({top: $('tableTitle').getBoundingClientRect().top + window.scrollY - 24, behavior: 'smooth'});
  else window.scrollTo({top: 0, behavior: 'smooth'});
});
window.addEventListener('scroll', renderScrollBtn, {passive: true});
renderScrollBtn();

/* ---------- go ---------- */
(function renderPlanAlert() {
  var el = $('planAlert'), C = PLAN_CHECK;
  if (C.ok && !C.warnings.length) return;
  var bad = !C.ok;
  el.className = 'plan-alert ' + (bad ? 'err' : 'warn');
  el.innerHTML = '<b>' + (bad ? '⚠ data/plan.js с ошибкой' + (PLAN_FALLBACK ? ' — сайт работает на последней рабочей версии (' + esc(PLAN_FALLBACK.at) + ')' : ' — этапы и дебюты не показаны') : 'data/plan.js: предупреждения') + '</b>' +
    '<ul>' + C.errors.concat(C.warnings).map(function(t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
    (bad ? '<span>Исправь файл или верни прошлую версию: GitHub → data/plan.js → History.</span>' : '') +
    '<button class="plan-alert-x" aria-label="Скрыть">×</button>';
  el.hidden = false;
  el.querySelector('.plan-alert-x').addEventListener('click', function() { el.hidden = true; });
})();
filt = filtLoad('tblFilt.v1', filt); cfilt = filtLoad('chartFilt.v1', cfilt);   // фильтры с прошлого раза
cgAll = filterChart(games);
renderCfInputs(); renderCfDates(); renderTableDates();
renderSummary();
renderPuzzleCard();
renderOpeningCard();
renderVerdictCard();
renderTitle();
renderWindow();
renderChartFilter();
renderMetricInputs();
renderFilterBar();
renderTblOpSeg();   // переключатель «Мой план | Lichess | Все» в заголовке колонки «Дебют»
renderGames();
if (chartMode !== 'metrics') setMode(chartMode);
applyHush();
placeChartBtns();
// отрисовка удалась: план рабочий — запомнить его копию в браузере, снять флаг страховки
if (PLAN_CHECK.ok && !PLAN_FORCED) { try { localStorage.setItem('planGood', JSON.stringify({plan: PLAN, at: new Date().toLocaleString('ru-RU'), ts: Date.now()})); } catch (e) {} }
try { sessionStorage.removeItem('planForce'); } catch (e) {}
})();
} catch (e) {
  var planForced = null;
  try { planForced = sessionStorage.getItem('planForce'); } catch (x) {}
  if (planForced === null && window.PLAN) {
    try { sessionStorage.setItem('planForce', String((e && e.message) || e)); location.reload(); } catch (x) { throw e; }
  } else throw e;
}
</script>
