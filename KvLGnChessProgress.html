/* ---------- activity mode: партии по дням за период ---------- */
var PERIODS = [
  {key: 'week',    label: 'Неделя'},
  {key: '2weeks',  label: '2 недели'},
  {key: 'month',   label: 'Месяц'},
  {key: '3months', label: '3 месяца'}   // по неделям: по дням ~90 столбиков нечитаемы
];
var DOW = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

var chartMode = 'metrics';
var period = 'week';
try {
  var savedMode = localStorage.getItem('chartMode');
  if (savedMode === 'activity' || savedMode === 'analysis') chartMode = savedMode;   // 'metrics' | 'activity' | 'analysis'
  var savedPeriod = localStorage.getItem('activityPeriod');
  if (PERIODS.some(function(p) { return p.key === savedPeriod; })) period = savedPeriod;
} catch (e) {}

function isoDay(d) {
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function ddmm(d) { return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2); }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function mondayOf(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
// «сегодня» — календарный день по Москве, от полуночи (как даты партий и задач в update.mjs; до 02.10.2026 день начинался в 05:00)
function gameToday() {
  try { var p = new Intl.DateTimeFormat('en-CA', {timeZone: 'Europe/Moscow', year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date()).split('-'); return new Date(+p[0], p[1] - 1, +p[2]); }
  catch (e) { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
}

/* ---------- листание периода стрелками: 0 — текущий, -1 — предыдущий и т. д. ---------- */
var periodOffset = 0;
// опорный день выбранного периода (для текущего — сегодня)
function periodAnchor() {
  var t = gameToday(), o = periodOffset;
  if (!o) return t;
  if (period === 'week') return addDays(t, 7 * o);
  if (period === '2weeks') return addDays(t, 14 * o);
  if (period === 'month') return new Date(t.getFullYear(), t.getMonth() + o, 1);
  // 3 месяца: окна идут встык — опорный день = день перед началом более позднего окна
  var an = t;
  for (var k = 0; k < -o; k++) an = addDays(mondayOf(new Date(an.getFullYear(), an.getMonth() - 2, 1)), -1);
  return an;
}
function shiftPeriod(d) {
  periodOffset = Math.min(0, periodOffset + d);
  selDays = {}; aCmpMode = null; aCmpSet = {};
  renderActivity();
}

/* ---------- легенда активности: клик выделяет результат (победы / поражения / ничьи), остальное притухает ---------- */
var actRes = null;   // null — ничего не выделено; иначе {win: true, ...}
function toggleRes(k) { if (!hush.chart) setRes(k, true); }   // легенда: каждый клик добавляет / убирает
function setRes(k, add) {
  if (add) {
    actRes = actRes || {};
    if (actRes[k]) delete actRes[k]; else actRes[k] = true;
  } else {
    actRes = actRes && actRes[k] && Object.keys(actRes).length === 1 ? null : (function() { var o = {}; o[k] = true; return o; })();
  }
  if (actRes && !hasKeys(actRes)) actRes = null;
  document.querySelectorAll('.res-toggle').forEach(function(el) {
    var on = !!(actRes && actRes[el.getAttribute('data-res')]);
    el.classList.toggle('pinned', on);
    el.classList.toggle('dim', !!actRes && !on);
  });
  renderActivity();
}
document.querySelectorAll('.res-toggle').forEach(function(el) {
  el.addEventListener('click', function(e) { e.stopPropagation(); toggleRes(el.getAttribute('data-res')); });
  el.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleRes(el.getAttribute('data-res')); } });
});

function activityBuckets() {
  var today = periodAnchor(), list = [], i, d;
  function day(d, top, bottom) {
    list.push({from: d, to: d, top: top, bottom: bottom, title: DOW[d.getDay()] + ' ' + ddmm(d)});
  }
  if (period === 'week' || period === '2weeks') {
    var start = addDays(mondayOf(today), period === 'week' ? 0 : -7);
    var len = period === 'week' ? 7 : 14;
    for (i = 0; i < len; i++) { d = addDays(start, i); day(d, DOW[d.getDay()], ddmm(d)); }
  } else if (period === 'month') {
    var first = new Date(today.getFullYear(), today.getMonth(), 1);
    var days = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
    for (i = 0; i < days; i++) { d = addDays(first, i); day(d, '', String(d.getDate())); }
  } else {
    var last = mondayOf(today);
    for (var m = mondayOf(new Date(today.getFullYear(), today.getMonth() - 2, 1)); m <= last; m = addDays(m, 7)) {
      list.push({from: m, to: addDays(m, 6), top: '', bottom: ddmm(m), title: 'Неделя ' + ddmm(m) + ' – ' + ddmm(addDays(m, 6))});
    }
  }
  var td = isoDay(gameToday());   // «сегодня» и «будущее» — по настоящей дате
  list.forEach(function(b) {
    var f = isoDay(b.from), t = isoDay(b.to);
    b.games = hush.chart ? [] : cgAll.filter(function(g) { return g.day >= f && g.day <= t; });
    b.today = td >= f && td <= t;
    b.future = f > td;
  });
  return list;
}

var actBuckets = [];

function renderActivity() {
  if (showRecords) { actBuckets = activityBuckets(); renderRecords(); renderActivityStats(); renderPeriodPick(); return; }
  var list = actBuckets = activityBuckets(), n = list.length;
  renderCmpBtn();
  var aView = aCmpMode === 'view' && actSelCount() && aCmpCount();
  $('chartBox').classList.toggle('cmp-on', !!aView);
  if (aView) { $('chart').innerHTML = actCmpHtml(); cmpFit(); renderPeriodPick(); renderActivityStats(); return; }
  var X0 = 40, W = 550, TOP = 20, BOT = 180, H = BOT - TOP;
  var colW = W / n;
  var dense = n > 20;
  var maxC = Math.max.apply(null, list.map(function(b) { return b.games.length; }));
  // столбик не выше ~70% колонки: сверху всегда остаётся место, чтобы кликнуть по дню, а не по столбику
  var need = Math.max(Math.round(maxC / 0.7), 4);   // столбик ≈ до 70% высоты
  var step = [1, 2, 5, 10, 20, 50].filter(function(st) { return Math.ceil(need / st) <= 5; })[0];
  var yMax = Math.ceil(need / step) * step;
  function colX(i) { return r2(X0 + i * colW); }
  function cx(i) { return r2(X0 + i * colW + colW / 2); }
  function y(v) { return r2(BOT - v / yMax * H); }

  var s = [];
  // фон колонок: сегодня — жёлтым
  list.forEach(function(b, i) {
    // фон каждого дня: чуть светлее фона блока, будущие — бледнее
    s.push('<rect x="' + colX(i) + '" y="-5" width="' + r2(colW) + '" height="200" fill="' + (b.future ? 'rgba(148,163,210,0.05)' : 'rgba(148,163,210,0.11)') + '"/>');
    if (b.today) {
      s.push('<rect x="' + colX(i) + '" y="-5" width="' + r2(colW) + '" height="200" fill="url(#gToday)"/>');
      s.push('<rect x="' + colX(i) + '" y="-5" width="' + r2(colW) + '" height="2" fill="#eab308" opacity="0.7"/>');
    }
  });
  // разделители колонок; границы недель — толще
  for (var i = 1; i < n; i++) {
    var weekEdge = (period === '2weeks' && i === 7) || (period === 'month' && list[i].from.getDay() === 1);
    s.push('<line x1="' + colX(i) + '" y1="-5" x2="' + colX(i) + '" y2="195" stroke="' + (weekEdge ? '#6b7280' : '#0f1119') + '" stroke-width="' + (weekEdge ? (period === '2weeks' ? 2 : 1) : (dense ? 0.8 : 1.5)) + '" stroke-opacity="' + (weekEdge ? 1 : 0.9) + '"/>');
  }
  // сетка + шкала количества партий
  for (var v = 0; v <= yMax; v += step) {
    s.push('<line x1="40" y1="' + y(v) + '" x2="590" y2="' + y(v) + '" stroke="#2a2d3a" stroke-width="0.5"/>');
    if (v > 0) s.push('<text x="34" y="' + (y(v) + 3.5) + '" text-anchor="end" font-size="9" fill="#9ca3af">' + v + '</text>');
  }
  // столбики: победы снизу, затем ничьи, поражения сверху
  var bw = Math.min(colW * 0.62, 34);
  var segs = [];   // части столбиков — кликабельны поверх областей дней
  list.forEach(function(b, i) {
    var cnt = {win: 0, draw: 0, lose: 0};
    b.games.forEach(function(g) { cnt[g.result]++; });
    var base = BOT;
    var gap = dense ? 0.6 : 1.5;
    [['win', '#22c55e'], ['draw', '#9ca3af'], ['lose', '#ef4444']].forEach(function(p) {
      if (!cnt[p[0]]) return;
      var h = cnt[p[0]] / yMax * H;
      s.push('<rect x="' + r2(cx(i) - bw / 2) + '" y="' + r2(base - h + gap / 2) + '" width="' + r2(bw) + '" height="' + r2(Math.max(h - gap, 1)) + '" rx="' + (dense ? 1.5 : 4) + '" fill="url(#gBar-' + p[0] + ')" stroke="' + p[1] + '" stroke-opacity="0.55" stroke-width="0.8"' +
        (actRes && !actRes[p[0]] ? ' opacity="0.15"' : '') + '/>');
      segs.push({i: i, res: p[0], x: r2(cx(i) - bw / 2), y: r2(base - h), w: r2(bw), h: r2(h)});
      base -= h;
    });
    if (b.games.length) {
      s.push('<text x="' + cx(i) + '" y="' + r2(base - 5) + '" text-anchor="middle" font-size="' + (dense ? 8 : 12) + '" font-weight="700" fill="#f3f4f6">' + b.games.length + '</text>');
    } else if (!b.future) {
      s.push('<circle cx="' + cx(i) + '" cy="' + BOT + '" r="' + (dense ? 1.2 : 2) + '" fill="#4b5063"/>');
    }
    // подписи: день недели + дата (или только число для месяца/недели для 3 месяцев)
    var lblColor = b.today ? '#eab308' : '#9ca3af';
    var op = b.future ? ' opacity="0.4"' : '';
    if (b.top) {
      s.push('<text x="' + cx(i) + '" y="200" text-anchor="middle" font-size="10" font-weight="600" fill="' + lblColor + '"' + op + '>' + b.top + '</text>');
      s.push('<text x="' + cx(i) + '" y="214" text-anchor="middle" font-size="9" fill="' + lblColor + '"' + op + '>' + b.bottom + '</text>');
    } else {
      s.push('<text x="' + cx(i) + '" y="202" text-anchor="middle" font-size="' + (dense ? 8 : 9) + '" fill="' + lblColor + '"' + op + '>' + b.bottom + '</text>');
    }
  });
  if (!actSelCount() && hasKeys(linkGames)) list.forEach(function(b, i) {
    if (b.games.some(function(g) { return linkGames[g.id]; }))
      s.push('<rect x="' + (colX(i) + 0.75) + '" y="-4.25" width="' + r2(colW - 1.5) + '" height="226" fill="none" stroke="#e4e4e7" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4,3" rx="2"/>');
  });
  if (actSelCount()) list.forEach(function(b, i) {
    if (aCmpMode && aCmpSet[i]) { s.push('<rect x="' + (colX(i) + 0.75) + '" y="-4.25" width="' + r2(colW - 1.5) + '" height="226" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-opacity="0.8" stroke-width="1.2" rx="2"/>'); return; }
    if (selDays[i]) s.push('<rect x="' + (colX(i) + 0.75) + '" y="-4.25" width="' + r2(colW - 1.5) + '" height="226" fill="rgba(255,255,255,0.04)" stroke="#e4e4e7" stroke-opacity="0.55" stroke-width="1.2" rx="2"/>');
    else s.push('<rect x="' + colX(i) + '" y="-5" width="' + r2(colW) + '" height="227" fill="#0d0f17" opacity="0.62"/>');
  });
  // области наведения
  list.forEach(function(b, i) {
    s.push('<rect class="hit" data-b="' + i + '" x="' + colX(i) + '" y="-5" width="' + r2(colW) + '" height="227" fill="rgba(0,0,0,0)"/>');
  });
  segs.forEach(function(g) {
    s.push('<rect class="hit seg" data-b="' + g.i + '" data-res="' + g.res + '" x="' + g.x + '" y="' + g.y + '" width="' + g.w + '" height="' + g.h + '" fill="rgba(0,0,0,0)"/>');
  });

  var defs = '<defs>' +
    '<linearGradient id="gToday" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eab308" stop-opacity="0.12"/><stop offset="1" stop-color="#eab308" stop-opacity="0.02"/></linearGradient>' +
    [['win', '#34d46e', '#15803d'], ['lose', '#f05252', '#b91c1c'], ['draw', '#a1a8b5', '#5b6170']].map(function(a) {
      return '<linearGradient id="gBar-' + a[0] + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + a[1] + '" stop-opacity="0.95"/><stop offset="1" stop-color="' + a[2] + '" stop-opacity="0.8"/></linearGradient>';
    }).join('') + '</defs>';
  $('chart').innerHTML = '<svg viewBox="10 -10 600 245" role="img" aria-label="Активность за период">' + defs + s.join('') + '</svg>';
  renderPeriodPick();
  var pr = periodRange(0);
  $('actRange').textContent = pr.from.slice(8) + '.' + pr.from.slice(5, 7) + ' – ' + pr.to.slice(8) + '.' + pr.to.slice(5, 7);
  $('prNext').disabled = periodOffset >= 0;
  $('actRange').classList.toggle('past', periodOffset < 0);
  $('actRange').title = periodOffset < 0 ? 'Нажми, чтобы вернуться к текущему периоду' : '';
  bindTooltip();
  renderActivityStats();
}

/* ---------- activity panel: сводка за период против такого же предыдущего ---------- */
function fromIso(x) { var p = x.split('-'); return new Date(+p[0], p[1] - 1, +p[2]); }
function daysBetween(a, b) { return Math.round((b - a) / 864e5); }

function periodRange(shift) {   // shift = 0 — выбранный период, 1 — предыдущий перед ним
  var today = periodAnchor(), from, to;
  if (period === 'week' || period === '2weeks') {
    var len = period === 'week' ? 7 : 14;
    to = addDays(mondayOf(today), 6 - shift * len);
    from = addDays(to, -(len - 1));
  } else if (period === 'month') {
    from = new Date(today.getFullYear(), today.getMonth() - shift, 1);
    to = new Date(from.getFullYear(), from.getMonth() + 1, 0);
  } else {
    // 3 месяца — те же целые недели, что столбиками на графике (с понедельника недели, где 1-е число)
    var start = mondayOf(new Date(today.getFullYear(), today.getMonth() - 2, 1));
    var end = addDays(mondayOf(today), 6);
    var span = daysBetween(start, end) + 1;
    from = addDays(start, -shift * span);
    to = addDays(end, -shift * span);
  }
  var f = isoDay(from), t = isoDay(to);
  return {from: f, to: t, days: daysBetween(from, to) + 1, games: cgAll.filter(function(g) { return g.day >= f && g.day <= t; })};
}

var PREV_LABEL = {week: 'к пр. неделе', '2weeks': 'к пр. 2 нед.', month: 'к пр. месяцу', '3months': 'к пр. 3 мес.'};

function actTrend(diff, isPct) {
  if (diff === null) return '<span class="trend" style="visibility:hidden">▲</span>';
  var d = r1(diff);
  var color = d > 0 ? 'var(--up)' : d < 0 ? 'var(--red)' : 'var(--fg-mute)';
  var arrow = d > 0 ? '▲ +' : d < 0 ? '▼ −' : '■ ';
  return '<span class="trend" style="color:' + color + '">' + arrow + Math.abs(d) + (isPct ? '%' : '') +
         ' <span class="trend-n">' + PREV_LABEL[period] + '</span></span>';
}

// ELO за период: изменение = сумма изменений рейтинга в рейтинговых партиях периода
// (контроль времени — как у последней рейтинговой партии, как в карточке профиля)
function periodElo(r) {
  var all = window.RATING_GAMES || [];
  if (!all.length) return null;
  var perf = all[all.length - 1].perf;
  var list = all.filter(function(x) { return x.perf === perf && x.day; });
  var inPeriod = list.filter(function(x) { return x.day >= r.from && x.day <= r.to; });
  var upTo = list.filter(function(x) { return x.day <= r.to; });
  return {
    perf: perf,
    n: inPeriod.length,
    diff: inPeriod.reduce(function(sum, x) { return sum + x.diff; }, 0),
    end: upTo.length ? upTo[upTo.length - 1].after : null
  };
}

/* ---------- выбор дней на графике активности: клик — один день (неделя для «3 месяцев»), Ctrl+клик — несколько ---------- */
var selDays = {};   // индекс столбика → true
// в режиме рекордов столбиков нет — выбор не действует
function actSelCount() { return Object.keys(selDays).length; }
function clearActSelection() { if (actSelCount() || aCmpMode) { selDays = {}; aCmpMode = null; aCmpSet = {}; renderActivity(); } }

/* ---------- сравнение дней (график активности): выбранные дни против отмеченных ---------- */
var aCmpMode = null, aCmpSet = {};   // индексы столбиков
function aCmpCount() { return Object.keys(aCmpSet).length; }
function toggleACmp(i) {
  if (selDays[i]) return;
  if (aCmpSet[i]) delete aCmpSet[i]; else aCmpSet[i] = true;
  renderActivity();
}
function bucketLabel(bs) {
  if (bs.length === 1) return bs[0].title;
  return bs.length + ' ' + (period === '3months' ? plural(bs.length, 'неделя', 'недели', 'недель') : plural(bs.length, 'день', 'дня', 'дней'));
}
function actCmpSide(bs, cls, title) {
  var gs = byRes([].concat.apply([], bs.map(function(b) { return b.games; })));
  return '<div class="cmp-side ' + cls + '"><div class="cmp-side-h">' + title + '</div>' +
    '<div class="cmp-side-t">' + esc(bucketLabel(bs)) + '</div>' +
    '<div class="cmp-side-m">' + (bs.length > 1 ? bs.map(function(b) { return b.bottom; }).join(', ') + ' · ' : '') + wlHtml(gs) + '</div></div>';
}
function actCmpHtml() {
  var A = actBuckets.filter(function(b, i) { return selDays[i]; }), B = actBuckets.filter(function(b, i) { return aCmpSet[i]; });
  function gs(bs) { return byRes([].concat.apply([], bs.map(function(b) { return b.games; }))); }
  var ga = gs(A), gb = gs(B);
  function days(bs, list) { return list.map(function(g) { return g.day; }).filter(function(d, k, a) { return a.indexOf(d) === k; }).length; }
  var rows = [
    {label: 'Партий', color: 'var(--yellow)', a: ga.length, b: gb.length, neutral: true, int: true},
    {label: 'Активн. дней', color: 'var(--c-debut)', a: days(A, ga), b: days(B, gb), neutral: true, int: true},
    {label: 'Винрейт', color: '#4ade80', a: winrate(ga), b: winrate(gb), pct: true},
    {label: 'Точность', color: '#c8c9cd', a: avg(ga, 'acc'), b: avg(gb, 'acc'), pct: true},
    {label: 'Дебют', color: '#60a5fa', a: avg(ga, 'debut'), b: avg(gb, 'debut'), pct: true},
    {label: 'Миттельшпиль', color: '#f59e0b', a: avg(ga, 'mid'), b: avg(gb, 'mid'), pct: true},
    {label: 'Эндшпиль', color: '#a78bfa', a: avg(ga, 'end'), b: avg(gb, 'end'), pct: true},
    {label: 'Зевки', color: '#f87171', a: avg(ga, 'blunders'), b: avg(gb, 'blunders'), lower: true}
  ];
  var html = rows.map(function(r) {
    var a = r.a, b = r.b;
    function fmt(v) { return v === null ? '—' : r.pct ? v.toFixed(1) + '<small>%</small>' : r.int ? String(v) : (Math.round(v * 10) / 10); }
    var d = a === null || b === null ? null : a - b, dTxt = '', cls = '';
    if (d !== null) {
      var good = r.neutral ? null : r.lower ? d < 0 : d > 0;
      cls = Math.abs(d) < 0.05 || good === null ? '' : good ? 'up' : 'down';
      dTxt = (d > 0 ? '+' : d < 0 ? '−' : '') + (Math.round(Math.abs(d) * 10) / 10) + (r.pct ? '%' : '');
    }
    var max = r.pct ? 100 : Math.max(a || 0, b || 0, 1);
    function bar(v, c, side) { return '<span class="cmp-bar' + (side ? ' ' + side : '') + '"><i style="width:' + (v === null ? 0 : Math.min(100, v / max * 100)) + '%;background:' + c + '"></i></span>'; }
    var isBl = r.label === 'Зевки';
    return '<div class="cmp-row' + (isBl ? ' cmp-bl-toggle' + (cmpBlOpen ? ' open' : '') : '') + '"' + (isBl ? ' title="Клик — зевки по типам"' : '') + '><span class="cmp-lbl" style="color:' + r.color + '">' + (isBl ? cmpBlLabel(r.label) : r.label) + '</span>' +
      '<span class="cmp-a">' + fmt(a) + '</span>' + bar(a, '#e4e4e7', 'l') +
      '<span class="cmp-d ' + cls + '">' + (dTxt || '—') + '</span>' +
      bar(b, '#34d399') + '<span class="cmp-b">' + fmt(b) + '</span></div>' + (isBl ? cmpBlRows(ga, gb) : '');
  }).join('');
  return '<div class="cmp-view">' +
    '<div class="cmp-head">' + actCmpSide(A, 'a', 'Выбрано') + '<div class="cmp-vs">vs</div>' + actCmpSide(B, 'b', 'Сравнение') + '</div>' +
    '<div class="cmp-rows">' + html + '</div></div>';
}
function selectBucket(i, add) {
  if (add) { if (selDays[i]) delete selDays[i]; else selDays[i] = true; }
  else if (actSelCount() === 1 && selDays[i]) selDays = {};
  else { selDays = {}; selDays[i] = true; }
  renderActivity();
}

// выделенный в легенде результат (победы / поражения / ничьи) — сводка только по нему
// подпись и цвет строки результата: без выделения — «Винрейт», иначе названия выбранных результатов
var RES_NAMES = {win: 'Победы', lose: 'Поражения', draw: 'Ничьи'};
var RES_COLORS = {win: '#4ade80', lose: '#f87171', draw: '#9ca3af'};
function resRowMeta() {
  if (!actRes || Object.keys(actRes).length === 3) return {label: 'Винрейт', color: '#4ade80', share: false};
  var ks = ['win', 'lose', 'draw'].filter(function(k) { return actRes[k]; });
  // два результата = «без» третьего: короче и не вылезает из панели
  var NOT = {win: 'Без побед', lose: 'Без поражений', draw: 'Без ничьих'};
  var missing = ['win', 'lose', 'draw'].filter(function(k) { return !actRes[k]; });
  var label = ks.length === 1 ? RES_NAMES[ks[0]] : NOT[missing[0]];
  return {label: label, color: ks.length === 1 ? RES_COLORS[ks[0]] : '#c4b5fd', share: true};
}
// «2W / 5L» (и D, если были ничьи) — под винрейтом
function actTrendShort(d, pct) { return actTrend(d, pct).replace(/ <span class="trend-n">[^<]*<\/span>/, ''); }
function wlHtml(list) {
  var w = 0, l = 0, d = 0;
  list.forEach(function(g) { if (g.result === 'win') w++; else if (g.result === 'lose') l++; else d++; });
  return '<span class="wl">' + w + '<span class="green">W</span> / ' + l + '<span class="red">L</span>' + (d ? ' / ' + d + 'D' : '') + '</span>';
}
function resShare(all) { return all.length ? byRes(all).length / all.length * 100 : null; }
function byRes(list) { return actRes ? list.filter(function(g) { return actRes[g.result]; }) : list; }

function renderActivityStats() {
  if (hush.chart) {
    var none0 = '<span class="trend" style="visibility:hidden">▲</span>';
    $('actList').innerHTML = [['Партий', 'var(--yellow)'], ['Активн. дней', 'var(--c-debut)'], ['Точность', 'var(--c-acc)'], ['Винрейт', 'var(--green)']].map(function(r) {
      return '<div class="stat" style="--sc:' + r[1] + '">' + statLine(r[0], r[1], '—') + '<div class="stat-trend">' + none0 + '</div></div>';
    }).join('');
    $('actElo').innerHTML = statLine('ELO', '#818cf8', '—') + '<div class="stat-trend">' + none0 + '</div>';
    return;
  }
  // выбраны столбики — сводка только по ним, без сравнения с прошлым периодом
  if (actSelCount()) {
    var picked = actBuckets.filter(function(b, i) { return selDays[i]; });
    var gsAll = [].concat.apply([], picked.map(function(b) { return b.games; }));
    var gs = byRes(gsAll);
    var rm = resRowMeta();
    var days = picked.reduce(function(sum, b) { return sum + daysBetween(b.from, b.to) + 1; }, 0);
    var act = gs.map(function(g) { return g.day; }).filter(function(d, k, a) { return a.indexOf(d) === k; }).length;
    var sacc = avg(gs, 'acc'), swr = winrate(gs);
    var none = '<span class="trend" style="visibility:hidden">▲</span>';
    var srows = [
      {label: 'Партий', color: 'var(--yellow)', value: String(gs.length)},
      {label: 'Активн. дней', color: 'var(--c-debut)', value: act + '<small>/' + days + '</small>'},
      {label: 'Точность', color: 'var(--c-acc)', value: sacc === null ? '—' : sacc.toFixed(1) + '<small>%</small>'},
      (function() { var v = rm.share ? resShare(gsAll) : swr;
        return {label: rm.label, color: rm.color, value: rm.share ? '' : v === null ? '—' : Math.round(v) + '<small>%</small>'}; })()
    ];
    $('actList').innerHTML = srows.map(function(r, k) {
      var under = k === 3 && !rm.share ? wlHtml(gs) : none;
      return '<div class="stat" style="--sc:' + r.color + '">' + statLine(r.label, r.color, r.value) + '<div class="stat-trend">' + under + '</div></div>';
    }).join('');
    var from = isoDay(picked[0].from), to = isoDay(picked[picked.length - 1].to);
    var pe = periodElo({from: from, to: to});
    $('actElo').innerHTML = statLine('ELO', '#818cf8', !pe ? '?' : (pe.diff > 0 ? '+' : pe.diff < 0 ? '−' : '') + Math.abs(pe.diff)) +
      '<div class="stat-trend"><span class="trend" style="color:var(--fg-mute);font-weight:400">' + (!pe ? 'рейтинговых партий нет' : 'за выбранные дни') + '</span></div>';
    return;
  }
  var cur = periodRange(0), prev = periodRange(1);
  var curAll = cur.games, prevAll = prev.games, rm = resRowMeta();
  cur.games = byRes(cur.games); prev.games = byRes(prev.games);
  function activeDays(r) { return r.games.map(function(g) { return g.day; }).filter(function(d, i, a) { return a.indexOf(d) === i; }).length; }
  function diff(a, b) { return a === null || b === null ? null : a - b; }

  var n = cur.games.length, pn = prev.games.length;
  var wr = winrate(cur.games), pwr = winrate(prev.games);
  var ad = activeDays(cur), pad = activeDays(prev);
  var acc = avg(cur.games, 'acc'), pacc = avg(prev.games, 'acc');

  var rows = [
    // сколько играл → как играл → результат (ELO — итог, отдельным блоком ниже)
    {label: 'Партий',        color: 'var(--yellow)',  value: String(n),                                   tr: actTrend(n - pn, false)},
    {label: 'Активн. дней', color: 'var(--c-debut)', value: ad + '<small>/' + cur.days + '</small>',     tr: actTrend(ad - pad, false)},
    {label: 'Точность',      color: 'var(--c-acc)',   value: acc === null ? '—' : acc.toFixed(1) + '<small>%</small>', tr: actTrend(diff(acc, pacc), true)},
    (function() {
      // при выделенном результате — доля выбранного среди всех партий периода и её изменение
      var v = rm.share ? resShare(curAll) : wr, pv = rm.share ? resShare(prevAll) : pwr;
      // выбран результат — строка просто подписывает, что выбрано (числа — в строках выше)
      if (rm.share) return {label: rm.label, color: rm.color, value: '', tr: '<span class="trend" style="visibility:hidden">▲</span>'};
      return {label: rm.label, color: rm.color, value: v === null ? '—' : Math.round(v) + '<small>%</small>',
              // W/L + прирост без подписи «к пр. …» — иначе не влезает в одну строку
              tr: wlHtml(cur.games) + ' ' + actTrendShort(diff(v === null ? null : Math.round(v), pv === null ? null : Math.round(pv)), true)};
    })()
  ];
  $('actList').innerHTML = rows.map(function(r) {
    return '<div class="stat" style="--sc:' + r.color + '">' + statLine(r.label, r.color, r.value) + '<div class="stat-trend">' + r.tr + '</div></div>';
  }).join('');

  var e = periodElo(cur), eloVal, eloSub;
  if (!e) {
    eloVal = '?';
    eloSub = 'рейтинговых партий нет';
  } else {
    var c = e.diff > 0 ? 'var(--up)' : e.diff < 0 ? 'var(--red)' : 'var(--fg-num)';
    eloVal = '<span style="color:' + c + '">' + (e.diff > 0 ? '▲ +' : e.diff < 0 ? '▼ −' : '') + Math.abs(e.diff) + '</span>';
    eloSub = e.n
      ? (e.end !== null ? e.end + ' · ' : '') + (PERF_RU[e.perf] || e.perf) + ' · ' + e.n + ' ' + plural(e.n, 'партия', 'партии', 'партий')
      : 'за период не играл';
  }
  $('actElo').innerHTML = statLine('ELO', '#818cf8', eloVal) +
    '<div class="stat-trend"><span class="trend" style="color:var(--fg-mute);font-weight:400">' + eloSub + '</span></div>';
}

function activityTip(b) {
  var w = 0, l = 0, d = 0;
  b.games.forEach(function(g) { if (g.result === 'win') w++; else if (g.result === 'lose') l++; else d++; });
  $('tt-title').innerHTML = esc(b.title) + (b.today ? ' <span style="color:#eab308">· сегодня</span>' : '');
  if (b.future) { $('tt-body').innerHTML = '<div style="color:var(--fg-dim)">ещё впереди</div>'; return; }
  var n = b.games.length;
  var acc = avg(b.games, 'acc');
  $('tt-body').innerHTML =
    '<div>Партий: <span style="font-weight:600">' + n + '</span></div>' +
    (n ? '<div><span style="color:#22c55e">' + w + 'W</span> / <span style="color:#ef4444">' + l + 'L</span>' + (d ? ' / ' + d + 'D' : '') + '</div>' : '') +
    (acc !== null ? '<div style="color:#9ca3af">Средняя точность: <span style="color:#e4e4e7">' + acc.toFixed(1) + '%</span></div>' : '');
}

$('prPrev').addEventListener('click', function(e) { e.stopPropagation(); shiftPeriod(-1); });
$('prNext').addEventListener('click', function(e) { e.stopPropagation(); shiftPeriod(1); });
$('actRange').addEventListener('click', function(e) { if (periodOffset < 0) { e.stopPropagation(); periodOffset = 0; selDays = {}; renderActivity(); } });

/* ---------- period dropdown («НЕДЕЛЯ ▾») ---------- */
function renderPeriodPick() {
  var cur = PERIODS.filter(function(p) { return p.key === period; })[0];
  $('periodPick').innerHTML =
    '<button class="win-toggle period-toggle" aria-haspopup="listbox" aria-expanded="false">' + cur.label + '<span class="caret">▾</span></button>' +
    (actSelCount() ? '<span class="act-sel" title="Сводка по выбранным столбикам. Клик — один, Ctrl+клик — добавить/убрать, Esc или ✕ — сбросить"><span class="sel-n">' + actSelCount() + '</span>/' + actBuckets.length + '</span><button class="sel-clear" title="Сбросить выбор (Esc)">✕</button>' : '') +
    '<div class="win-menu" role="listbox">' + PERIODS.map(function(p) {
      return '<button class="win-opt' + (p.key === period ? ' on' : '') + '" role="option" data-p="' + p.key + '">' + p.label + '</button>';
    }).join('') + '</div>';
}

function setPeriodMenu(open) {
  $('periodPick').classList.toggle('open', open);
  var t = $('periodPick').querySelector('.win-toggle');
  if (t) t.setAttribute('aria-expanded', String(open));
}

$('periodPick').addEventListener('click', function(e) {
  e.stopPropagation();
  if (e.target.closest('.sel-clear')) { clearActSelection(); return; }
  var opt = e.target.closest('.win-opt');
  if (opt) {
    period = opt.getAttribute('data-p');
    selDays = {}; aCmpMode = null; aCmpSet = {};
    periodOffset = 0;
    try { localStorage.setItem('activityPeriod', period); } catch (err) {}
    setPeriodMenu(false);
    renderPeriodPick();
    renderActivity();
    return;
  }
  if (e.target.closest('.win-toggle')) setPeriodMenu(!$('periodPick').classList.contains('open'));
});
document.addEventListener('click', function() { setPeriodMenu(false); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') setPeriodMenu(false); });

/* ---------- records: лучшая / худшая партия (показатели), лучший / худший день + рекорды (активность) ---------- */
var showRecords = false;
var recScope = 'period';   // 'period' — период слева, 'all' — за всё время
var PERIOD_SCOPE = {week: 'за неделю', '2weeks': 'за 2 недели', month: 'за месяц', '3months': 'за 3 месяца'};

function setRecords(on) {
  showRecords = on;
  $('chartBox').classList.toggle('records-on', on);
  $('recordsBtn').textContent = on ? 'График' : 'Рекорды';
  hideTooltip();
  renderStats();   // кнопка «i» у зевков: в «Рекордах» без подсказки
  if (chartMode === 'activity') renderActivity(); else { renderChart(); applySeries(); }
}

$('recordsBtn').addEventListener('click', function(e) {

  if (hush.chart) return;

});

$('recScope').addEventListener('click', function(e) {

function renderRecords() {
  var periodLabel = chartMode === 'activity'
    ? (actSelCount() ? 'выбрано дней: ' + actSelCount() : PERIOD_SCOPE[period]) + ''   // выделенный результат видно по кнопкам внизу — в подписи не повторяем
    : winActualLabel();

    '<button data-scope="period" class="' + (recScope === 'period' ? 'on' : '') + '">' + periodLabel + '</button>' +

  $('chart').innerHTML = chartMode === 'activity' ? activityRecordsHtml() : metricsRecordsHtml();

function emptyCard(best, head, text) {
  return '<div class="rec-card ' + (best ? 'best' : 'worst') + '"><div class="rec-head">' + head + '</div>' +
         '<div class="rec-empty">' + text + '</div></div>';
}

/* --- показатели: лучшая и худшая партия по точности --- */
// показатель, по которому ищутся лучшая / худшая партия: выделенный слева (клик),
// иначе первый видимый в легенде по порядку точность → дебют → миттельшпиль → эндшпиль → зевки
var REC_METRICS = [
  {k: 'acc', label: 'точность', pct: true, color: '#c8c9cd'}, {k: 'debut', label: 'дебют', pct: true, color: '#60a5fa'},
  {k: 'mid', label: 'миттельшпиль', pct: true, color: '#f59e0b'}, {k: 'end', label: 'эндшпиль', pct: true, color: '#a78bfa'},
  {k: 'blunders', label: 'зевков', pct: false, color: '#f87171', lowerBetter: true}
];
function recMetric() {
  var byKey = function(k) { return REC_METRICS.filter(function(m) { return m.k === k; })[0]; };
  if (pinnedSeries && !hiddenSeries[pinnedSeries]) return byKey(pinnedSeries);
  return REC_METRICS.filter(function(m) { return !hiddenSeries[m.k]; })[0] || REC_METRICS[0];
}
function metricsRecordsHtml() {
  // выбранные колонки графика — рекорды только среди них (кроме «за всё время»)
  var list = recScope === 'all' ? cgAll : statsGames();
  var M = recMetric();
  list = list.filter(function(g) { return typeof g[M.k] === 'number'; });   // например, без эндшпиля — не участвуют
  if (!list.length) {
    return '<div class="rec-view"><div class="rec-grid">' +
      emptyCard(true, '▲ Лучшая партия', 'нет партий с показателем «' + M.label + '»') +
      emptyCard(false, '▼ Худшая партия', 'нет партий с показателем «' + M.label + '»') +
      '</div></div>';
  }
  var sorted = list.slice().sort(function(a, b) { return (M.lowerBetter ? a[M.k] - b[M.k] : b[M.k] - a[M.k]) || (b.n - a.n); });
  var best = sorted[0], worst = sorted[sorted.length - 1];
  return '<div class="rec-view"><div class="rec-grid">' +
    gameCard(best, true, M) +
    (list.length > 1 ? gameCard(worst, false, M) : emptyCard(false, '▼ Худшая партия', 'нужно хотя бы 2 партии')) +
    '</div></div>';
}
function gameCard(g, best, M) {
  var R = RESULT[g.result];
  M = M || REC_METRICS[0];
  function ph(v) { return typeof v === 'number' ? v + '%' : '—'; }
  // в строке фаз — только видимые в легенде и не главный показатель
  var phases = [['debut', 'Дебют', '#60a5fa'], ['mid', 'Миттельшпиль', '#f59e0b'], ['end', 'Эндшпиль', '#a78bfa'], ['acc', 'Точность', '#9ca3af']]
    .filter(function(p) { return !hiddenSeries[p[0]] && p[0] !== M.k; })
    .map(function(p) { return '<span style="color:' + p[2] + '">' + p[1] + ' ' + ph(g[p[0]]) + '</span>'; }).join('');
  return '<div class="rec-card ' + (best ? 'best' : 'worst') + '">' +
    '<div class="rec-head">' + (best ? '▲ Лучшая партия' : '▼ Худшая партия') + '</div>' +
    '<div class="rec-meta">#' + g.n + ' · ' + esc(g.date) + ' · <span style="color:' + R.color + '">' + R.label + '</span> · ' + esc(g.engine) + '</div>' +
    '<div class="rec-title" title="' + esc(g.opening) + '">' + esc(g.opening) + '</div>' +
    '<div class="rec-big" style="color:' + M.color + '">' + g[M.k] + (M.pct ? '<small>%</small>' : '') + '<span>' + M.label + '</span></div>' +
    (phases ? '<div class="rec-row">' + phases + '</div>' : '') +
    '<div class="rec-row dim">' + (hiddenSeries.blunders || M.k === 'blunders' ? '' : 'Зевки ' + g.blunders + ' · ') + 'Ошибки ' + g.mistakes + ' · Неточности ' + g.inacc +
      ' · ' + g.moves + ' ' + plural(g.moves, 'ход', 'хода', 'ходов') + '</div>' +
    (g.id ? '<a class="rec-link" href="https://lichess.org/' + g.id + '" target="_blank" rel="noopener">Открыть на Lichess ↗</a>' : '') +
  '</div>';
}

/* --- активность: лучший / худший день + плитки рекордов --- */
function groupDays(list) {
  var map = {}, out = [];
  list.forEach(function(g) {
    if (!g.day) return;
    if (!map[g.day]) { map[g.day] = {day: g.day, games: [], w: 0, l: 0, d: 0}; out.push(map[g.day]); }
    var x = map[g.day];
    x.games.push(g);
    if (g.result === 'win') x.w++; else if (g.result === 'lose') x.l++; else x.d++;
  });
  out.forEach(function(x) { x.acc = avg(x.games, 'acc'); x.bl = avg(x.games, 'blunders'); });
  return out;
}

function dayLabel(iso) { var d = fromIso(iso); return DOW[d.getDay()] + ' ' + ddmm(d); }

function dayCard(x, best, byAcc) {   // byAcc — выделен один результат (только победы / поражения): день выбран по точности, крупно — точность
  return '<div class="rec-card ' + (best ? 'best' : 'worst') + '">' +
    '<div class="rec-head">' + (best ? '▲ Лучший день' : '▼ Худший день') + (byAcc ? ' по точности' : '') + '</div>' +
    '<div class="rec-meta">' + dayLabel(x.day) + '</div>' +
    (byAcc ? '<div class="rec-big"><span class="' + (best ? 'w' : 'l') + '">' + (x.acc === null ? '—' : x.acc.toFixed(1) + '%') + '</span></div>'
      : '<div class="rec-big"><span class="w">' + x.w + 'W</span> / <span class="l">' + x.l + 'L</span>' + (x.d ? ' / ' + x.d + 'D' : '') + '</div>') +
    '<div class="rec-row">' +
      '<span>Партий ' + x.games.length + '</span>' +
      (byAcc ? '' : '<span style="color:#9ca3af">Точность ' + (x.acc === null ? '—' : x.acc.toFixed(1) + '%') + '</span>') +
      '<span style="color:#f87171">Зевков в среднем ' + (x.bl === null ? '—' : x.bl.toFixed(1)) + '</span>' +
    '</div>' +
  '</div>';
}

function tile(label, val, sub) {
  return '<div class="rec-tile"><div class="rec-tile-label">' + label + '</div>' +
         '<div class="rec-tile-val">' + val + '</div><div class="rec-tile-sub">' + sub + '</div></div>';
}

function activityRecordsHtml() {
  // выбранные дни (кроме «за всё время») и выделенный результат (всегда)
  var list = recScope === 'all' ? cgAll : actSelCount()
    ? [].concat.apply([], actBuckets.filter(function(b, i) { return selDays[i]; }).map(function(b) { return b.games; }))
    : periodRange(0).games;
  list = byRes(list);
  var days = groupDays(list);
  // выделен один результат (только победы / поражения / ничьи) — сравнивать по W/L и винрейту бессмысленно (всегда 100% / 0%): считаем по точности
  var oneRes = actRes && Object.keys(actRes).length === 1 ? Object.keys(actRes)[0] : null;
  var RES_DAYS = {win: 'с победами', lose: 'с поражениями', draw: 'с ничьими'};
  // партий нет — карточки остаются на местах с «—», экран всегда одинаковый (подписи — те же, что при фильтре)
  if (!days.length) {
    var none = oneRes ? {win: 'побед', lose: 'поражений', draw: 'ничьих'}[oneRes] + ' пока нет' : 'пока нет партий', acc = oneRes ? ' по точности' : '';
    return '<div class="rec-view">' +
      '<div class="rec-grid">' +
        emptyCard(true, '▲ Лучший день' + acc, oneRes ? none : 'сыграй партию, чтобы появился') +
        emptyCard(false, '▼ Худший день' + acc, oneRes ? none : 'сыграй партию, чтобы появился') +
      '</div>' +
      '<div class="rec-section">🏆 Рекорды</div>' +
      '<div class="rec-tiles">' +
        ['Больше всего партий за день', oneRes ? 'Серия дней ' + RES_DAYS[oneRes] : 'Самая длинная серия', 'Самая активная неделя', oneRes ? 'Лучшая неделя по точности' : 'Лучшая неделя по винрейту']
          .map(function(label) { return tile(label, '—', none); }).join('') +
      '</div>' +
    '</div>';
  }

  // лучший: больше (W − L), затем выше точность; худший: больше (L − W), затем ниже точность (oneRes — только точность)
  var byBest = days.slice().sort(function(a, b) { return oneRes ? (b.acc || 0) - (a.acc || 0) : ((b.w - b.l) - (a.w - a.l)) || ((b.acc || 0) - (a.acc || 0)); });
  var byWorst = days.slice().sort(function(a, b) { return oneRes ? (a.acc || 0) - (b.acc || 0) : ((b.l - b.w) - (a.l - a.w)) || ((a.acc || 0) - (b.acc || 0)); });
  var best = byBest[0], worst = byWorst[0];

  // больше всего партий за день
  var busiest = days.slice().sort(function(a, b) { return b.games.length - a.games.length; })[0];

  // самая длинная серия дней подряд (внутри выбранного отрезка)
  var sorted = days.map(function(x) { return x.day; }).sort();
  var run = 1, bestRun = 1, runStart = sorted[0], bestFrom = sorted[0], bestTo = sorted[0];
  for (var i = 1; i < sorted.length; i++) {
    if (daysBetween(fromIso(sorted[i - 1]), fromIso(sorted[i])) === 1) run++;
    else { run = 1; runStart = sorted[i]; }
    if (run > bestRun) { bestRun = run; bestFrom = runStart; bestTo = sorted[i]; }
  }

  // недели (пн–вс)
  var weeks = {}, wl = [];
  list.forEach(function(g) {
    if (!g.day) return;
    var k = isoDay(mondayOf(fromIso(g.day)));
    if (!weeks[k]) { weeks[k] = {from: k, games: []}; wl.push(weeks[k]); }
    weeks[k].games.push(g);
  });
  function weekRange(k) { var m = fromIso(k); return ddmm(m) + ' – ' + ddmm(addDays(m, 6)); }
  var activeWeek = wl.slice().sort(function(a, b) { return b.games.length - a.games.length; })[0];
  var MIN_WEEK = 3;   // винрейт недели из 1–2 партий ничего не говорит
  var wkVal = function(w) { return oneRes ? avg(w.games, 'acc') || 0 : winrate(w.games); };
  var wrWeeks = wl.filter(function(w) { return w.games.length >= MIN_WEEK; })
    .sort(function(a, b) { return wkVal(b) - wkVal(a); });
  var wkLabel = oneRes ? 'Лучшая неделя по точности' : 'Лучшая неделя по винрейту';

  var sameDay = best.day === worst.day;
  return '<div class="rec-view">' +
    '<div class="rec-grid">' +
      dayCard(best, true, !!oneRes) +
      (sameDay ? emptyCard(false, '▼ Худший день' + (oneRes ? ' по точности' : ''), 'нужно хотя бы 2 игровых дня') : dayCard(worst, false, !!oneRes)) +
    '</div>' +
    // рекорды — нейтральный блок, не продолжение колонок «лучший / худший»
    '<div class="rec-section">🏆 Рекорды</div>' +
    '<div class="rec-tiles">' +
      tile('Больше всего партий за день', busiest.games.length, dayLabel(busiest.day)) +
      tile(oneRes ? 'Серия дней ' + RES_DAYS[oneRes] : 'Самая длинная серия', bestRun + ' ' + plural(bestRun, 'день', 'дня', 'дней'),
           bestFrom === bestTo ? dayLabel(bestFrom) : ddmm(fromIso(bestFrom)) + ' – ' + ddmm(fromIso(bestTo))) +
      tile('Самая активная неделя', activeWeek.games.length + ' ' + plural(activeWeek.games.length, 'партия', 'партии', 'партий'), weekRange(activeWeek.from)) +
      (wrWeeks.length
        ? tile(wkLabel, oneRes ? avg(wrWeeks[0].games, 'acc').toFixed(1) + '%' : Math.round(winrate(wrWeeks[0].games)) + '%', weekRange(wrWeeks[0].from) + ' · ' + wrWeeks[0].games.length + ' ' + plural(wrWeeks[0].games.length, 'партия', 'партии', 'партий'))
        : tile(wkLabel, '—', 'нужно ' + MIN_WEEK + '+ партии за неделю')) +
    '</div>' +
  '</div>';
}

/* ---------- switch: показатели ⇄ активность ⇄ анализ ---------- */
// кнопки «Анализ» и «Активность» включают свой режим; в нём кнопка становится зелёной «Показатели» — обратно
var linkGames = {};   // партии, выбранные в «Показателях», — в «Активности» их дни обведены пунктиром
function setMode(m) {
  if (m === 'metrics' && chartMode === 'activity') {
    var picked = actBuckets.filter(function(b, i) { return selDays[i]; });
    var ranges = picked.map(function(b) { return {from: isoDay(b.from), to: isoDay(b.to)}; });
    var any = ranges.length && cgAll.some(function(g) { return ranges.some(function(r) { return g.day >= r.from && g.day <= r.to; }); });
    dayView = any ? {ranges: ranges, label: picked.length === 1 ? picked[0].title : picked.length + ' ' + plural(picked.length, period === '3months' ? 'неделя' : 'день', period === '3months' ? 'недели' : 'дня', period === '3months' ? 'недель' : 'дней')} : null;
    if (dayView) { selCols = {}; cmpMode = null; cmpSet = {}; }   // выбор партий сбрасывается, только если пришли с выбранными днями
  }
  if (m === 'activity' && chartMode !== 'activity') {
    linkGames = {};
    Object.keys(selCols).forEach(function(id) { linkGames[id] = true; });
  }
  chartMode = m;
  try { localStorage.setItem('chartMode', m); } catch (e) {}
  $('chartBox').classList.remove('cmp-on');
  $('chartBox').classList.toggle('mode-activity', m === 'activity');
  $('chartBox').classList.toggle('mode-analysis', m === 'analysis');
  // кнопка включённого режима — зелёная «Показатели» (обратно), другая — своё название
  $('activityBtn').textContent = m === 'activity' ? 'Показатели' : 'Активность';
  $('analysisBtn').querySelector('.an-btn-t').textContent = m === 'analysis' ? 'Показатели' : 'Анализ';
  if (!hush.mode && !hush.chart) $('analysisBtn').title = m === 'analysis' ? 'Вернуться к показателям' : 'Разбор партий на доске: ходы, зевки, график перевеса';
  if (typeof placeChartBtns === 'function') placeChartBtns();
  if (typeof renderAnBadge === 'function') renderAnBadge();
  // режим «Рекорды» сохраняется при переключении показатели ⇄ активность
  renderTitle();
  hideTooltip();
  if (m === 'activity') { renderPeriodPick(); renderActivity(); }
  else if (m === 'analysis') renderAnalysis();
  else renderWindow();   // средние, подпись окна и график — режим дня мог включиться
}
$('analysisBtn').addEventListener('click', function(e) {

});
$('wrPrev').addEventListener('click', function(e) { e.stopPropagation(); shiftWin(1); });
$('wrNext').addEventListener('click', function(e) { e.stopPropagation(); shiftWin(-1); });
$('winRangeTxt').addEventListener('click', function(e) { e.stopPropagation(); if (winPage) shiftWin(-winPage); });
$('dayClose').addEventListener('click', function(e) { e.stopPropagation(); exitDayView(); });
$('activityBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  setMode(chartMode === 'activity' ? 'metrics' : 'activity');
});

/* ---------- анализ партий: партии · ходы · моменты · доска · график перевеса ---------- */
// Позиции считает chess.js (lib/chess.js — грузится при первом открытии режима), фигуры — assets/pieces (cburnett, как на Lichess).
// Состояние: партия, полуход на доске (0 — начальная позиция, k — после k-го полухода) и «линза» — что искать в партии.
// Линза (выпадающий список у «Ходов», AN_LENSES) даёт МОМЕНТЫ партии: зевки, маты, взятия… Моменты выделены цветом
// в записи ходов, перечислены в колонке «Моменты» и точками на графике перевеса. Позиция момента — перед его ходом, со стрелками.
// Новая линза = функция (g, P) → [момент] + строка в AN_LENSES; отрисовка, клики, клавиши и график подхватят её сами.
//   момент: {p — полуход хода, at — полуход позиции «перед» (обычно p − 1), color, tint: 'good' | 'bad' | null,
//            san, short — подпись в колонке, title — заголовок карточки (HTML), before / after — пояснение перед ходом / после,
//            arrows — стрелки на доске в позиции at,
//            rank — важность (меньше — важнее, нет — 0): линза без указанного хода открывается на самом важном, при равной — на раннем (anFirst)}
// master — чьи ходы во вкладке «Мастера»: 'auto' — первый мастер студий дебюта партии по плану, 'all' — вся база, 'дебют/мастер' — выбранный
var an = {gid: null, ply: null, lens: 'bl', master: 'auto', peek: false};   // ply = null — при отрисовке встать на первый момент
// место разбора (anPlace.v1): ход в каждой паре «партия + линза» (at: {"id|линза": ход}) — помнится, пока не нажата ⟳ у списка партий
// (anPlaceReset: забыть все, кроме выбранной партии). gid — последняя открытая партия: после перезагрузки открывается она, пока не сыграна новая
// (last — новейшая партия на момент сохранения; появилась новая — открывается она). peek — пришёл переходом из другого раздела (anOpen):
// показан важный момент / указанный ход, место не сохраняется до первого своего хода (anGo), выбора партии в списке или смены линзы
var AN_PLACE_KEY = 'anPlace.v1', anPlace = {};
function anNewest() { for (var i = games.length - 1; i >= 0; i--) if (games[i].mv) return games[i].id; return ''; }
function anPlaceOf(gid) { var p = anPlace[gid + '|' + an.lens]; return typeof p === 'number' ? p : null; }
function anPlaceWrite() { try { localStorage.setItem(AN_PLACE_KEY, JSON.stringify({last: anNewest(), gid: an.gid, at: anPlace})); } catch (e) {} }
function anPlaceSave() {
  if (!an.gid || typeof an.ply !== 'number') return;
  if (!an.peek) anPlace[an.gid + '|' + an.lens] = an.ply;
  anPlaceWrite();
}
function anPlaceOthers() { for (var k in anPlace) if (k.split('|')[0] !== an.gid) return true; return false; }   // есть что сбрасывать кнопкой ⟳
function anPlaceReset() {
  for (var k in anPlace) if (k.split('|')[0] !== an.gid) delete anPlace[k];
  anPlaceWrite();
}
try {
  var anSaved = localStorage.getItem('anLens'); if (anSaved) an.lens = anSaved; an.master = localStorage.getItem('anMaster.v2') || 'auto';
  var ap = JSON.parse(localStorage.getItem(AN_PLACE_KEY) || 'null');
  if (ap && ap.at && typeof ap.at === 'object') {
    anPlace = ap.at;
    if (ap.last === anNewest()) { an.gid = ap.gid; an.ply = anPlaceOf(ap.gid); }
  }
} catch (e) {}
var AN_COLORS = {light: '#dee3e6', dark: '#8ca2ad',                             // клетки (доска Lichess «blue»)
                 coordOnLight: '#4a6272', coordOnDark: '#f1f5f9',               // координаты a–h / 1–8 на светлой / тёмной клетке
                 last: 'rgba(155,199,0,0.41)',                                  // последний ход
                 lastBad: 'rgba(239,68,68,0.45)', lastGood: 'rgba(74,222,128,0.4)', // он же, если это плохой / хороший момент
                 played: '#f87171', best: '#4ade80',                            // стрелки: сыграно (плохо) / лучше или хорошо
                 even: '#9ca3af'};                                              // нейтрально (размен)
var AN_PIECES = 'assets/pieces/';                                                // wK.svg, bN.svg, …
var AN_VALUE = {p: 1, n: 3, b: 3, r: 5, q: 9, k: 0};
var PIECE_ACC = {p: 'пешку', n: 'коня', b: 'слона', r: 'ладью', q: 'ферзя'};

// chess.js подгружается один раз; пока грузится — ждущие вызовы копятся в очереди

var anPos = {id: null};
function anPositions(g) {

// строка карточки «подпись · значение» (значение — готовый HTML)
function anRow(label, html) { return '<div class="an-row"><span>' + label + '</span><span>' + html + '</span></div>'; }

// «Перевес»: история перевеса по оценке движка (ev — после каждого полухода, с моей стороны, в десятых пешки, ±100 — решено / мат).
// Моменты: перевес стал +3 → пик → перевес просел (первый мой зевок после пика или резкое падение) · провал до −3 → дно → отыгрыш.

var AN_ADV = 30;   // +3 / −3 пешки — «решающий» перевес (как в «Схеме»: Реализация / Защита)
function anAdvMoments(g, P) {

      if (drop) push(drop, 'drop', AN_COLORS.played, 'bad', 'перевес просел', b ? 'Перевес просел — твой зевок: ' + esc(blLabel(b)) : 'Перевес просел (−2 и больше за ход)');

// мат в N: серии из mateSeries (общая с фильтром «Мат в N»): доведён — позиция начала серии, упущен — позиция хода, который его упустил

      var evA = g.ev ? g.ev[lost] : null;   // перевес после хода, на котором мат пропал: выигрыш сохранён или нет

        title: '♛ <em>Мат в ' + M.N + (M.short ? ' — упущен ✗' : ' — длинный') + '</em>', before: rows, after: rows,

      : d < 0 ? {c: AN_COLORS.played, t: 'bad', s: 'невыгодно −' + (-d), x: 'Невыгодно: после ответа соперника −' + (-d)}

    out.push({p: p, at: p - 1, color: kind.c, tint: kind.t, san: m.san, short: kind.s,

// выбор мастера во вкладке «Мастера»: «Все мастера» (база Lichess) или мастер из студий дебюта этой партии
function anMasterPick(g) {

}
// моменты текущей линзы: ход и короткая подпись; клик — позиция перед ходом
// info — карточка текущей позиции: у «Все ходы» моментов нет, и колонка показывает её вместо списка («Позиция»)
function anMomentsCol(moments, info) {
  var L = anLens(), fr = anFresh(anGame()), bang = fr && fr[L.k] ? anBang('Новая партия (последние сутки)') : '';
  if (L.k === 'all') return '<div class="an-mom-in"><div class="an-head">Позиция</div><div class="an-ms an-pos">' + info + '</div></div>';
  return '<div class="an-mom-in"><div class="an-head">Моменты <span>' + moments.length + '</span></div><div class="an-ms">' +
    (moments.length ? moments.map(function(m, i) {
      return '<button class="an-m' + (an.ply === m.at || an.ply === m.p ? ' on' : '') + '" data-i="' + i + '" style="--c:' + m.color + '" title="' + esc(m.short) + '">' +
        '<span class="an-m-top"><i></i>' + anMoveNo(m.p) + esc(m.san) + '</span><span class="an-m-s">' + esc(m.short) + '</span>' + bang + '</button>';
    }).join('') : '<div class="an-empty">' + (L.k === 'all' ? 'Все ходы — в записи' : 'В этой партии нет') + '</div>') + '</div></div>';
}

/* --- отрисовка --- */
// весь режим: список, ходы, моменты, доска, график (смена партии, линзы, фильтра графика, скрытия)
// моменты, отмеченные точками на графике и листаемые ↑ ↓ (у «Мастеров» — только отходы, совпадения без точек)
function anMarked(moments) { return moments.filter(function(m) { return m.dot !== false; }); }
// с какого момента открыть линзу, когда ход не указан: самый важный (rank), при равной важности — самый ранний; отмеченные точками — в первую очередь
function anFirst(moments) {
  var list = anMarked(moments).length ? anMarked(moments) : moments, best = null;
  list.forEach(function(m) { if (!best || (m.rank || 0) < (best.rank || 0)) best = m; });
  return best;
}
function renderAnalysis() {
  var box = $('anBox');
  if (chartMode !== 'analysis') return;
  box.classList.toggle('an-wide', !!anLens().wide);   // «Мастера»: без колонки «Моменты», запись ходов — на её месте
  if (hush.chart) {   // график скрыт своим глазом (в скрытом режиме у аватарки «Анализ» недоступен — см. applyHush)

    return;
  }
  if (!window.Chess) { box.innerHTML = '<div class="an-lock" style="grid-column: 1 / -1">Загружаю доску…</div>'; anNeedChess(renderAnalysis); return; }
  var list = anList(), g = anGame();
  if (!g || list.indexOf(g) < 0) { g = list[0] || null; if (g) anSetGame(g); }
  if (!g) { box.innerHTML = '<div class="an-list">' + anListHtml(list, null) + '</div><div class="an-lock">Партий для разбора нет</div>'; return; }
  var P = anPositions(g), moments = anMoments(g, P), marked = anMarked(moments);
  if (an.ply === null) { var first = anFirst(moments); an.ply = first ? first.at : 0; }
  var dots = marked.map(function(m) { return {p: m.p, color: m.color, title: anMoveNo(m.p) + m.san + ' — ' + m.short}; });
  box.innerHTML = '<div class="an-list">' + anListHtml(list, g) + '</div><div class="an-moves"></div><div class="an-mom"></div><div class="an-board"></div>' +
    '<div class="an-graph">' + (evalGraph(g, 'an', dots) || '<div class="an-empty">Графика перевеса нет — у партии нет компьютерного анализа</div>') + '</div>';
  anUpdate();
  // выбранная партия — в видимой части списка
  var sel = box.querySelector('.an-g.on'), sc = box.querySelector('.an-list-in');
  if (sel && (sel.offsetTop < sc.scrollTop || sel.offsetTop > sc.scrollTop + sc.clientHeight - 60)) sc.scrollTop = sel.offsetTop - 8;
}
// смена полухода: ходы, моменты, доска и отметка на графике (список партий не перерисовывается — прокрутка остаётся)
function anScrollTo(sc, el) { if (sc && el) sc.scrollTop = Math.max(0, el.offsetTop - sc.offsetTop - sc.clientHeight / 2 + 12); }
// защита от прокрутки страницы — только окнам «Анализа», у которых сейчас есть прокрутка (список партий, ходы, моменты; CSS .sc-lock)
function anScrollLock() {
  $('anBox').querySelectorAll('.an-list-in, .an-mvs, .an-ms').forEach(function(el) { el.classList.toggle('sc-lock', el.scrollHeight > el.clientHeight + 1); });
}
window.addEventListener('resize', anScrollLock);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(anScrollLock);   // шрифт меняет высоту строк
function anUpdate() {
  var g = anGame(), box = $('anBox'), col = box.querySelector('.an-moves');
  if (!g || !col) return;
  var P = anPositions(g), moments = anMoments(g, P);
  an.ply = Math.max(0, Math.min(P.n, an.ply));
  anPlaceSave();
  var v = anView(P, an.ply, moments);
  col.innerHTML = anMovesCol(g, P, v, moments);
  var mom = box.querySelector('.an-mom');
  mom.innerHTML = anMomentsCol(moments, anInfoHtml(g, P, v));
  box.querySelector('.an-board').innerHTML = anBoardSvg(P.boards[an.ply], {flip: g.color === 'black', last: v.last, arrows: v.arrows});
  anScrollTo(col.querySelector('.an-mvs'), col.querySelector('.an-mv.on, .an-mv.next'));
  anScrollTo(mom.querySelector('.an-ms'), mom.querySelector('.an-m.on'));
  anScrollLock();
  // отметка текущего хода на графике перевеса
  var svg = box.querySelector('.an-graph svg');
  if (svg && g.ev) {
    var ln = svg.querySelector('.an-ply');
    if (!ln) {
      ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('class', 'an-ply'); ln.setAttribute('y1', 0); ln.setAttribute('y2', 120);
      ln.setAttribute('stroke', '#22d3ee'); ln.setAttribute('stroke-width', 2); ln.setAttribute('vector-effect', 'non-scaling-stroke');
      svg.appendChild(ln);
    }
    var x = an.ply / (g.ev.length - 1) * 1000;
    ln.setAttribute('x1', x); ln.setAttribute('x2', x);
  }
}

/* --- действия --- */
function anGo(ply) { if (anGame()) { an.ply = ply; an.peek = false; anUpdate(); } }   // свой ход — с этого места разбор сохраняется
// ↑ ↓ — к предыдущему / следующему моменту линзы (без моментов — на ход назад / вперёд)
function anStep(dir) {
  var g = anGame();
  if (!g) return;
  var ps = anMarked(anMoments(g, anPositions(g))).map(function(m) { return m.at; });
  if (!ps.length) { anGo(an.ply + dir); return; }
  var t = dir > 0 ? ps.filter(function(p) { return p > an.ply; })[0] : ps.filter(function(p) { return p < an.ply; }).pop();
  if (t !== undefined) anGo(t);
}
function anSetLens(k) {
  an.lens = k; an.peek = false;
  try { localStorage.setItem('anLens', k); } catch (e) {}
  var g = anGame();
  if (g && window.Chess) {   // в этой линзе партию уже разбирал — туда, иначе на самый важный момент
    var saved = anPlaceOf(g.id), first = saved === null && anFirst(anMoments(g, anPositions(g)));
    if (saved !== null) an.ply = saved; else if (first) an.ply = first.at;
  }
  renderAnalysis();
}
function anSetMaster(k) {
  an.master = k;
  try { localStorage.setItem('anMaster.v2', k); } catch (e) {}
  renderAnalysis();
}
// открыть партию в анализе (клик по зевку в отчёте о матче); если её прячет фильтр графика — фильтр снимается
function anOpen(g, ply, lens) {
  if (cgAll.indexOf(g) < 0) { cfilt = {results: {}, colors: {}, openings: {}, ranges: {}, modes: {}}; renderCfInputs(); chartFilterChanged(); }
  if (lens) { an.lens = lens; try { localStorage.setItem('anLens', lens); } catch (e) {} }
  anSetGame(g);
  // переход из другого раздела — указанный ход или самый важный момент, не место разбора; место не трогаем, пока не сделан свой ход
  an.ply = typeof ply === 'number' ? ply : null; an.peek = true;
  var was = chartMode === 'analysis';
  gsChart('analysis', false);
  if (was) renderAnalysis();
}
$('anBox').addEventListener('click', function(e) {
  if (e.target.closest('.an-ph')) { if (anResetArmed || anPlaceOthers()) { anResetArmed = !anResetArmed; anHeadRefresh(); } return; }
  if (e.target.closest('.an-reset')) { anPlaceReset(); anResetArmed = false; anHeadRefresh(); return; }
  var o = e.target.closest('.an-opseg [data-opn]');
  if (o) {   // названия дебютов в списке партий: мой план / Lichess
    anOpNames = o.getAttribute('data-opn');
    try { localStorage.setItem('anOpNames', anOpNames); } catch (err) {}
    var keep = $('anBox').querySelector('.an-list-in'), top = keep ? keep.scrollTop : 0;
    renderAnalysis();
    if ($('anBox').querySelector('.an-list-in')) $('anBox').querySelector('.an-list-in').scrollTop = top;
    return;
  }
  var t = e.target.closest('.an-pick .win-toggle, [data-lens], [data-master], .an-g, .an-m, .an-mv, .an-mc, [data-nav], .an-graph svg');
  if (!t) return;
  if (t.classList.contains('win-toggle')) { e.stopPropagation(); t.parentNode.classList.toggle('open'); return; }   // выпадающий список линз
  if (t.hasAttribute('data-lens')) { e.stopPropagation(); anSetLens(t.getAttribute('data-lens')); return; }
  if (t.hasAttribute('data-master')) { e.stopPropagation(); anSetMaster(t.getAttribute('data-master')); return; }
  var g = anGame();
  if (t.classList.contains('an-g')) {
    var ng = games.filter(function(x) { return x.id === t.getAttribute('data-id'); })[0];
    if (ng && ng.id !== an.gid) { anSetGame(ng); renderAnalysis(); }
  } else if (t.classList.contains('an-m')) anGo(anMomCache.list[+t.getAttribute('data-i')].at);
  else if (t.classList.contains('an-mv') || t.classList.contains('an-mc')) anGo(+t.getAttribute('data-p'));
  else if (t.hasAttribute('data-nav')) {
    var k = t.getAttribute('data-nav');
    anGo(k === 'first' ? 0 : k === 'last' ? Infinity : an.ply + (k === 'next' ? 1 : -1));
  } else if (g && g.ev) {   // график перевеса: клик рядом с точкой момента — этот момент, иначе позиция на этом ходу
    var r = t.getBoundingClientRect(), n = g.ev.length - 1;
    var p = Math.max(0, Math.min(n, Math.round((e.clientX - r.left) / r.width * n)));
    var near = null, tol = Math.max(1, Math.round(n * 0.015));
    anMarked(anMoments(g, anPositions(g))).forEach(function(m) { if (Math.abs(m.p - p) <= tol && (!near || Math.abs(m.p - p) < Math.abs(near.p - p))) near = m; });
    anGo(near ? near.at : p);
  }
});
document.addEventListener('click', function() { document.querySelectorAll('.an-pick.open').forEach(function(el) { el.classList.remove('open'); }); });
// клавиатура, пока блок анализа на экране: ← → ходы, Home / End, ↑ ↓ моменты
document.addEventListener('keydown', function(e) {
  if (chartMode !== 'analysis' || hush.chart || !anGame() || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || $('aiMenu').classList.contains('open')) return;
  var r = $('chartBox').getBoundingClientRect();
  if (r.bottom < 60 || r.top > window.innerHeight - 60) return;
  var k = e.key;
  if (k === 'ArrowLeft') anGo(an.ply - 1);
  else if (k === 'ArrowRight') anGo(an.ply + 1);
  else if (k === 'Home') anGo(0);
  else if (k === 'End') anGo(Infinity);
  else if (k === 'ArrowUp') anStep(-1);
  else if (k === 'ArrowDown') anStep(1);
  else if (k === 'Escape') document.querySelectorAll('.an-pick.open').forEach(function(el) { el.classList.remove('open'); });
  else return;
  e.preventDefault();
});

/* ---------- карточка задач (puzzles.js из update.bat) ---------- */
function renderPuzzleCard() {
  var P = window.PUZZLES;
  var head = '<div class="pz-head"><span>🧩 Задачи</span><span class="pz-go" title="Подробнее">i</span></div>';
  if (hush.head) { $('pzCard').innerHTML = head + '<div class="hush-na">нет данных</div><div></div>'; startCarousel(0); return; }
  if (!P || P.rating === null) {
    $('pzCard').innerHTML = head + '<div class="pz-main"><span class="pz-rating">—</span></div><div class="pz-sub">запусти update.bat</div>';
    return;
  }
  // изменение рейтинга за сегодня — только если сегодня решал задачи, иначе без приписки
  var hist = P.history || [];
  var today = isoDay(gameToday());
  var trendTxt = '';
  if (P.attempts.some(function(a) { return a.day === today; })) {
    var before = hist.filter(function(h) { return h.day < today; }).pop();
    if (before) {
      var d = P.rating - before.rating;
      var color = d > 0 ? 'var(--up)' : d < 0 ? 'var(--red)' : 'var(--fg-mute)';
      trendTxt = '<span class="trend" style="color:' + color + '" title="Изменение рейтинга задач за сегодня (было ' + before.rating + ')">' +
        (d > 0 ? '▲ +' : d < 0 ? '▼ −' : '■ ') + Math.abs(d) + ' <span class="trend-n">сегодня</span></span>';
    }
  }
  // мини-график рейтинга по снимкам
  var pts = hist.slice(-30), spark = '';
  if (pts.length > 1) {
    var min = Math.min.apply(null, pts.map(function(h) { return h.rating; }));
    var max = Math.max.apply(null, pts.map(function(h) { return h.rating; }));
    var span = Math.max(max - min, 20);
    var xy = pts.map(function(h, i) {
      return r2(2 + i * 196 / (pts.length - 1)) + ',' + r2(22 - (h.rating - min) / span * 18);
    });
    var last = xy[xy.length - 1].split(',');
    spark = '<svg class="pz-spark" viewBox="0 0 200 26" preserveAspectRatio="none" aria-hidden="true">' +
      '<polyline points="' + xy.join(' ') + '" fill="none" stroke="#a78bfa" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.5" fill="#a78bfa"/></svg>';
  }
  var wins = P.attempts.filter(function(a) { return a.win; }).length;
  // микс против дебютных тренировок: перфоманс = средний рейтинг задач ± 400 × (решено − нет) / задач
  function perf(list) {
    if (!list.length) return null;
    var w = list.filter(function(a) { return a.win; }).length;
    return Math.round(list.reduce(function(sum, a) { return sum + a.r; }, 0) / list.length + 400 * (2 * w - list.length) / list.length);
  }
  // слева — микс всегда; справа карусель: 3 последние тренировки (дебюты / темы), сдвиг каждые 4 с, пауза при наведении
  var wkMon = mondayOf(gameToday());
  var weekLabel = 'Неделя', weekTitle = 'Задач за текущую неделю';
  function inWeek(m) {
    var f = isoDay(m), t = isoDay(addDays(m, 6));
    return P.attempts.filter(function(a) { return a.day >= f && a.day <= t; }).length;
  }
  var weekN = inWeek(wkMon);   // на этой неделе задач нет — честный 0 (подталкивает), прошлую неделю не подставляем
  if (!weekN) weekTitle = 'На этой неделе задачи ещё не решались';
  var recent = [], seenKey = {};
  for (var i = P.attempts.length - 1; i >= 0 && recent.length < 3; i--) {
    var key = pzKey(P.attempts[i]);
    if (key !== 'mix' && !seenKey[key]) { seenKey[key] = true; recent.push(P.attempts[i]); }
  }
  var slides = recent.map(function(last) {
    var key = pzKey(last);
    var list = P.attempts.filter(function(a) { return pzKey(a) === key; });
    var name = pzLabel(last, P.themeNames || {});
    return '<div class="pz-slide" title="' + esc(name) + ': ' + list.length + ' ' + plural(list.length, 'задача', 'задачи', 'задач') +
      ', последний раз ' + last.date + '"><span class="pz-sl-name">' + esc(name) + '</span>' +
      '<b class="pz-ok">' + list.filter(function(a) { return a.win; }).length + '✓</b>' +
      '<b class="pz-bad">' + list.filter(function(a) { return !a.win; }).length + '✗</b></div>';
  });
  var carousel = '<div class="pz-split">' +
    '<span class="pz-mix" title="' + weekTitle + '">' + weekLabel + ' <b>' + weekN + '</b></span>' +
    (slides.length
      ? '<div class="pz-car"><div class="pz-track">' + slides.join('') + (slides.length > 1 ? slides[0] : '') + '</div></div>' +
        (slides.length > 1 ? '<div class="pz-dots">' + slides.map(function(_, k) { return '<i' + (k === 0 ? ' class="on"' : '') + '></i>'; }).join('') + '</div>' : '')
      : '') +
    '</div>';
  $('pzCard').innerHTML = head +
    '<div class="pz-main"><span class="pz-rating">' + P.rating + '</span>' + trendTxt + '</div>' +
    spark + carousel +
    '<div class="pz-sub">' + P.attempts.length + ' ' + plural(P.attempts.length, 'задача', 'задачи', 'задач') +
      (P.attempts.length ? ' · ' + Math.round(wins / P.attempts.length * 100) + '% решено' : '') + '</div>';
  startCarousel(slides.length);
}

// общий ключ и подпись режима (карточка, карусель, панель подробностей)
function pzKey(a) { return a.mode === 'open' || a.mode === 'theme' ? a.mode + '|' + a.tr : 'mix'; }
function pzLabel(a, names) {
  if (a.mode === 'open') return a.tr.split(': ').pop();
  if (a.mode === 'theme') return names[a.tr] || PZ_NAMES[a.tr] || a.tr;
  return 'Микс';
}

var pzTimer = null, pzIdx = 0, pzPaused = false;
function startCarousel(n) {
  clearInterval(pzTimer);
  pzIdx = 0;
  if (n < 2) return;
  pzTimer = setInterval(function() {
    if (pzPaused) return;
    var track = $('pzCard').querySelector('.pz-track');
    if (!track) return;
    pzIdx++;
    track.style.transition = 'transform 0.5s ease';
    track.style.transform = 'translateX(' + (-100 * pzIdx) + '%)';
    var dots = $('pzCard').querySelectorAll('.pz-dots i');
    dots.forEach(function(d, k) { d.classList.toggle('on', k === pzIdx % n); });
    if (pzIdx === n) {   // дошли до копии первого слайда — незаметно возвращаемся в начало
      setTimeout(function() { track.style.transition = 'none'; track.style.transform = 'translateX(0)'; pzIdx = 0; }, 520);
    }
  }, 4000);
}
$('pzCard').addEventListener('mouseenter', function() { pzPaused = true; });
$('pzCard').addEventListener('mouseleave', function() { pzPaused = false; });

    add('tip', 66, '20 задач «Мат в 2»', 'https://lichess.org/training/mateIn2', plural(mLost.length, 'Упущен ', 'Упущено ', 'Упущено ') + mLost.length + ' ' + plural(mLost.length, 'короткий мат', 'коротких мата', 'коротких матов') + ' — набей глаз на матовые картины', 'Зевки и ошибки', 'Маты');
  }

  // Дебют · Партии: семейства с 3+ партиями из последних 10
  var fam = {};
  L10.forEach(function(g) { var k = g.opening.split(':')[0]; (fam[k] = fam[k] || []).push(g); });
  Object.keys(fam).forEach(function(k) {
    var fl = fam[k];
    if (fl.length < 3) return;
    var wr = winrate(fl);
    if (wr <= 34) add('bad', 50 + fl.length, k + ': ' + fl.filter(function(g) { return g.result === 'win'; }).length + ' из ' + fl.length + ' побед', null, 'Мало побед в этом дебюте · последние 10 партий', 'Дебют', 'Партии', function() { gsTableOpening(fl[0].opening); });
    else if (wr >= 75) add('good', 45 + fl.length, k + ': ' + r(wr) + '% побед', null, gN(fl.length) + ' в этом дебюте · последние 10', 'Дебют', 'Партии', function() { gsTableOpening(fl[0].opening); });
  });
  // Дебют · Мастера: докуда держишься линии (последние 5 против предыдущих 5) и где чаще отходишь
  function depth(g) { var rows = msCompare(g, anMasterPicked(g)), d = rows.filter(function(c) { return c.st !== 'top'; })[0]; return rows.length ? {to: Math.ceil(((d ? d.p : rows[rows.length - 1].p + 2) - 1) / 2), dev: d, g: g} : null; }
  var dl = L5.filter(function(g) { return g.ms; }).map(depth).filter(Boolean), dp = P5.filter(function(g) { return g.ms; }).map(depth).filter(Boolean);
  if (dl.length >= 3) {

    var prevTo = dp.length >= 3 ? dp.reduce(function(s, x) { return s + x.to; }, 0) / dp.length : null;

    var devs = {};
    dl.forEach(function(x) { if (x.dev) { var k = x.dev.p + '|' + x.dev.san + '|' + x.dev.top; devs[k] = (devs[k] || 0) + 1; } });
    var topDev = Object.keys(devs).sort(function(a, b) { return devs[b] - devs[a]; })[0];
    if (avgTo <= 4 && topDev) {
      var dd = topDev.split('|'), mvN = Math.ceil(+dd[0] / 2), gDev = dl.filter(function(x) { return x.dev && x.dev.p === +dd[0] && x.dev.san === dd[1]; }).pop().g;
      add('bad', 58, 'Рано отходишь от линии: ' + mvN + '-й ход, ' + dd[1] + ' вместо ' + dd[2], null, 'В среднем держишься до ' + r(avgTo) + '-го хода · последние 5 партий' + (devs[topDev] > 1 ? ' · этот отход ' + devs[topDev] + ' раза' : ''), 'Дебют', 'Мастера', function() { anOpen(gDev, +dd[0] - 1, 'ms'); });
      add('tip', 62, 'Повтори позицию до ' + mvN + '-го хода: там играют ' + dd[2], null, 'Открой «Анализ» → «Мастера» на этой партии и посмотри, что играл мастер', 'Дебют', 'Мастера', function() { anOpen(gDev, +dd[0] - 1, 'ms'); });
    }
  }

  }
  var twoColors = CUR.stage && CUR.stage.colors.length > 1;
  if (twoColors) ['white', 'black'].forEach(function(c) { gameRules(games.filter(function(g) { return g.color === c; }), c === 'white' ? 'Белыми: ' : 'Чёрными: '); });
  else gameRules(games, '');
  // Партии · Цвет (последние 10 каждым цветом, оба цвета от 3 партий)
  (function() {

    if (W.length < 3 || B.length < 3) return;
    var ww = winrate(W), bw = winrate(B), sw = ww >= bw;

    add('bad', 52, 'Слабее ' + (sw ? 'чёрными' : 'белыми') + ': ' + r(Math.min(ww, bw)) + '% побед', null, 'Последние партии каждым цветом: белыми ' + r(ww) + '%, чёрными ' + r(bw) + '%', 'Партии', 'Результат');
  })();
  var n = games.length;

  /* --- прогресс: цель этапа --- */

  if (lastDone && daysBetween(fromIso(lastDone.day), gameToday()) <= 7)
    add('good', 97, 'Этап ' + (lastDone.idx + 1) + ' выполнен ' + lastDone.date + '!', null, lastDone.name + ' — дальше: ' + stageTitle(), 'Прогресс', 'Цель');
  if (!CUR.stage && PLAN.stages.length) add('tip', 96, 'План выполнен — добавь этап', null, 'Все этапы из data/plan.js пройдены — допиши следующий (см. AI-PROMPT.md)', 'Прогресс', 'Цель');
  else CUR.colors.forEach(function(c) {
    var who = twoColors ? (c.color === 'white' ? 'Белыми' : 'Чёрными') : 'Цель этапа';
    var cur = c.blocks.filter(function(b) { return !b.ok; })[0] || c.blocks[c.blocks.length - 1];
    if (c.done) { add('good', 90, who + ': цель выполнена ' + c.doneGame.date, null, 'Правило этапа выполнено ' + COLOR_WORD[c.color] + ' против Stockfish ' + CUR.stage.engine, 'Прогресс', 'Цель'); return; }
    add('tip', 88, who + ': ' + colorLine(c) + ' · ещё минимум ' + gN(gamesToGoal(c)), null, 'Нужно ' + RULE.blocks + ' пятёрки подряд ' + COLOR_WORD[c.color] + ' против Stockfish ' + CUR.stage.engine + '. Сейчас: ' + blockWhy(cur), 'Прогресс', 'Цель');
    // подряд хороших партий для цели (победа или «честное» поражение) — с конца
    var good = 0;
    for (var i = c.rel.length - 1; i >= 0 && (c.rel[i].result === 'win' || honestLoss(c.rel[i])); i--) good++;
    if (good >= 3) add('good', 62 + good, who + ': ' + gN(good) + ' подряд без слабых поражений', null, 'Победа или достойное поражение (точность ≥ ' + RULE.lossMinAcc + '%, зевков ≤ ' + RULE.lossMaxBlunders + ')', 'Прогресс', 'Цель');
    if (cur && cur.bad.length) add('bad', 64, who + ': слабые поражения мешают цели — #' + cur.bad.map(function(g) { return g.n; }).join(', #'), null,
      'В пятёрке нужны поражения с точностью ≥ ' + RULE.lossMinAcc + '% и не больше ' + RULE.lossMaxBlunders + ' зевков', 'Прогресс', 'Цель', function() { gsOpenGame(cur.bad[cur.bad.length - 1]); });
  });

  /* --- прогресс: активность --- */
  var st = streaks();
  if (st.current >= 3) add('good', 58 + st.current, st.current + ' ' + plural(st.current, 'день', 'дня', 'дней') + ' подряд за доской', null, 'Серия дней с партиями', 'Прогресс', 'Активность', function() { gsChart('activity', false); });
  if (n) {
    var idle = daysBetween(fromIso(games[n - 1].day), gameToday());
    if (idle >= 3) add('tip', 82, 'Не играл ' + idle + ' ' + plural(idle, 'день', 'дня', 'дней'), null, 'Сыграй хотя бы одну партию, чтобы не терять форму', 'Прогресс', 'Активность');
    else {

      add('tip', 64, 'Играй регулярно: 2–3 партии каждый день', null, 'Лучше несколько партий каждый день, чем много за один вечер. Сейчас дней с партиями: ' + act + ' из 7', 'Прогресс', 'Активность', function() { gsChart('activity', false); });
    }
  }

  /* --- задачи --- */

  if (P && P.rating !== null) {
    var hist = P.history || [];
    var weekAgo = isoDay(addDays(gameToday(), -7));
    var base = hist.filter(function(h) { return h.day <= weekAgo; }).pop() || hist[0];
    if (base && hist.length > 1) {

      else if (dr <= -20) add('bad', 60 - dr / 5, 'Рейтинг задач −' + (-dr) + ' ' + since, null, 'Сейчас ' + P.rating, 'Задачи', 'Рейтинг', function() { togglePuzzleDetail(true); });

      if (l.length >= 6 && pct < 50) {
        add('bad', 58, 'Задачи «' + nm + '»: ' + pct + '% решено', null, 'Тренировка задач по дебюту: решено меньше половины', 'Дебют', 'Задачи', function() { togglePuzzleDetail(true); });
        add('tip', 66, 'Повтори задачи «' + nm + '»', 'https://lichess.org/training/openings', 'Это твой дебют — тактика в нём важнее всего', 'Дебют', 'Задачи');
      } else if (l.length >= 6 && pct >= 70) add('good', 48, 'Задачи «' + nm + '»: ' + pct + '% решено', null, 'Тренировка задач по дебюту', 'Дебют', 'Задачи', function() { togglePuzzleDetail(true); });
    });
    var mon = mondayOf(gameToday());
    function cnt(m) { var f = isoDay(m), t = isoDay(addDays(m, 6)); return P.attempts.filter(function(a) { return a.day >= f && a.day <= t; }).length; }
    var cw = cnt(mon), pw = cnt(addDays(mon, -7));

  }

  V.sort(function(a, b) { return b.w - a.w; });
  return V;
}

function renderVerdictCard() {
  var V = buildVerdicts();
  var bad = V.filter(function(v) { return v.t === 'bad'; });
  var good = V.filter(function(v) { return v.t === 'good'; });
  var tip = V.filter(function(v) { return v.t === 'tip'; });

  if (hush.head) { $('vdCard').innerHTML = head + '<div class="hush-na">нет данных</div><div></div>'; startVdCarousel(0); return; }

  }
  // карусель: по очереди проседает → хорошо → что делать (по 2 главных пункта каждого вида)
  var KIND = {bad: ['▼', 'var(--red)', 'Проседает'], good: ['▲', 'var(--green)', 'Хорошо'], tip: ['💡', '#fbbf24', 'Что делать']};
  var slides = [];
  for (var i = 0; i < 2; i++) [bad[i], good[i], tip[i]].forEach(function(v) { if (v) slides.push(v); });
  $('vdCard').innerHTML = head +
    '<div class="vd-car">' + slides.map(function(v, k) {
      var K = KIND[v.t];
      return '<div class="vd-slide' + (k === 0 ? ' on' : '') + '" title="' + esc(v.more || v.text) + '">' +
        '<div class="vd-kind" style="color:' + K[1] + '">' + K[0] + ' ' + K[2] + '</div>' +
        '<div class="vd-main">' + esc(v.text) + '</div></div>';
    }).join('') + '</div>' +
    '<div class="vd-counts"><span class="w">▲ ' + good.length + '</span> <span class="l">▼ ' + bad.length + '</span> <span class="t">💡 ' + tip.length + '</span>' +
      (slides.length > 1 ? '<span class="vd-dots">' + slides.map(function(v, k) { return '<i class="' + v.t + (k === 0 ? ' on' : '') + '"></i>'; }).join('') + '</span>' : '') +
    '</div>';

}

var vdTimer = null, vdIdx = 0, vdPaused = false;
function startVdCarousel(n) {
  clearInterval(vdTimer);
  vdIdx = 0;
  if (n < 2) return;
  vdTimer = setInterval(function() {
    if (vdPaused || $('sideRow').classList.contains('vd-open')) return;
    var sl = $('vdCard').querySelectorAll('.vd-slide'), dots = $('vdCard').querySelectorAll('.vd-dots i');
    if (!sl.length) return;
    sl[vdIdx].classList.remove('on'); sl[vdIdx].classList.add('out');
    var prev = sl[vdIdx];
    setTimeout(function() { prev.classList.remove('out'); }, 450);
    vdIdx = (vdIdx + 1) % n;
    sl[vdIdx].classList.add('on');
    dots.forEach(function(d, k) { d.classList.toggle('on', k === vdIdx); });
  }, 4500);
}
$('vdCard').addEventListener('mouseenter', function() { vdPaused = true; });

$('aiMenu').addEventListener('wheel', function(e) {

  if (!box) return;
  var sc = e.target.closest('.ai-list, textarea');
  if (!sc || sc.scrollHeight <= sc.clientHeight) { e.preventDefault(); return; }
  var up = e.deltaY < 0, atTop = sc.scrollTop <= 0, atEnd = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 1;
  if ((up && atTop) || (!up && atEnd)) e.preventDefault();
}, {passive: false});
